<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026's costly movie gambles: reported loss forecasts</title>
<meta name="description" content="Four 2026 film flops, the people behind them, and dated loss forecasts from original trade reporting. A 4:5 poster with actual film artwork.">
<script type="importmap">{"imports":{"@bezda/rhp/standalone":"https://cdn.jsdelivr.net/npm/@bezda/rhp@2.0.5/dist/standalone.js"}}</script>
<style>
__FONTS__
:root {color-scheme: light; --page:#d8dade; --paper:#f8f8f4; --ink:#171b24; --soft:#50545c; --rule:#d2d4d5; --red:#b72037; --text:"IBM Plex Sans",Arial,sans-serif; --display:"Anton","Arial Narrow",Arial,sans-serif;}
* {box-sizing:border-box;}
body {margin:0; padding:22px 16px 32px; color:var(--ink); background:var(--page); font:16px/1.4 var(--text);}
.poster {width:100%; max-width:1080px; min-height:1350px; margin:0 auto; padding:34px 44px 26px; background:var(--paper); display:flex; flex-direction:column;}
.poster figcaption {display:grid; gap:12px; margin:0 0 10px;}
.poster .kicker {display:flex; justify-content:space-between; gap:18px; padding-bottom:13px; border-bottom:3px solid var(--ink); font-size:18px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;}
.poster .headline {font:400 64px/1.05 var(--display); letter-spacing:-.012em; text-wrap:balance; max-width:23ch;}
.poster .headline em {font-style:normal; color:var(--red);}
.poster .dek {font-size:22px; line-height:1.35; color:var(--soft); max-width:65ch;}
.key {display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:5px; font-size:20px; line-height:1.3; color:var(--soft);}
.key .hatch {display:inline-block; width:35px; height:15px; margin-right:8px; vertical-align:-1px; border:1px solid var(--red); background:repeating-linear-gradient(135deg,var(--red) 0 2px,transparent 2px 6px);}
.unit {font-weight:600; color:var(--red);}
.axis {display:flex; justify-content:space-between; margin:4px 5px 12px 144px; color:var(--soft); font-size:20px;}
.poster .note {display:block; margin-top:auto; padding-top:14px; border-top:2px solid var(--ink); font-size:21px; line-height:1.4; color:var(--soft);}
.poster .note b {color:var(--ink);}
a {color:inherit; text-underline-offset:3px;}
.below {max-width:1080px; margin:18px auto 0; font-size:14px;}
.below p {margin:6px 0;}
.below h2 {margin:0 0 8px; font-size:18px;}
.source-detail { background:var(--paper); padding:20px; border-left:4px solid var(--red);}
.source-detail dl {display:grid; grid-template-columns:140px 1fr; gap:6px 16px; margin:12px 0 0;}
.source-detail dt {font-weight:600;}
.source-detail + .source-detail {margin-top:8px;}
.source-detail dd {margin:0;}
.source-detail a:focus-visible {outline:2px solid var(--red); outline-offset:3px;}
.files {margin-top:14px !important;}
@media (max-width:900px) {
 .poster {min-height:0; padding:28px 26px 24px;}
 .poster figcaption {gap:12px; margin-bottom:18px;}
 .poster .kicker {font-size:15px; border-bottom-width:2px;}
 .poster .headline {font-size:57px;}
 .poster .dek {font-size:20px;}
 .key {font-size:16px;}
 .axis {margin-left:108px; font-size:14px;}
 .poster .note {font-size:15px; margin-top:18px; padding-top:12px;}
}
@media (max-width:600px) {
 body {padding:12px 10px 24px;}
 .poster {padding:22px 16px 18px;}
 .poster .kicker {font-size:11px; letter-spacing:.075em; gap:8px; padding-bottom:9px;}
 .poster .headline {font-size:39px; max-width:24ch;}
 .poster .dek {font-size:15px; line-height:1.4;}
 .key {font-size:12px; align-items:flex-end; gap:8px; margin-bottom:8px;}
 .key span:last-child {max-width:130px; text-align:right;}
 .key .hatch {width:22px; height:11px; margin-right:5px;}
 .axis {margin-left:71px; font-size:11px;}
 .poster .note {font-size:11.5px;}
 .source-detail { padding:16px; font-size:13px;}
 .source-detail dl {grid-template-columns:1fr; gap:4px;}
 .source-detail dd {margin-bottom:7px;}
}
@media (max-width:360px) {.poster .headline {font-size:35px;} .poster {padding-inline:13px;}}
</style>
</head>
<body>
<main id="chart"></main>
<script type="module">
import {Chart, Plot, Bar, Label, Poster, slat, nice, html, render} from "@bezda/rhp/standalone";

// Original reports supply the forecasts. The Numbers supplies current ticket sales and credits.
const DATA = __DATA__;
const ROWS = DATA.rows;
const lead = ROWS.reduce((best, row, i) => row.report.high > ROWS[best].report.high ? i : best, 0);
const scale = nice(0, Math.max(...ROWS.map(row => row.report.high)), 5);
const date = value => new Intl.DateTimeFormat("en-GB", {day:"numeric", month:"short", timeZone:"UTC"}).format(new Date(value + "T12:00:00Z"));
const money = new Intl.NumberFormat("en-US", {style:"currency", currency:"USD", notation:"compact", maximumFractionDigits:1});
const exactMoney = new Intl.NumberFormat("en-US", {style:"currency", currency:"USD", maximumFractionDigits:0});
const forecast = row => row.report.low === row.report.high ? `About $${row.report.high}M` : `$${row.report.low} to $${row.report.high}M`;
const director = row => row.id === "digger" ? "Alejandro González Iñárritu" : row.directors.join(" & ");
const starring = row => row.featuredStars.join(" & ");
const THEME = {font:"var(--text)", ink:"var(--ink)", muted:"var(--soft)", grid:"var(--rule)", surface:"var(--paper)", series:["var(--red)"]};

// Each film keeps its full artwork beside a common zero-based dollar scale.
const Film = slat({thickness:"var(--film-pitch)", room:{start:"auto", end:5}, css:`
 .film {border-top:1px solid var(--rhp-grid);}
 .film.lead {background:#efefeb;}
 .film:focus-visible {outline:3px solid var(--rhp-ink); outline-offset:-3px;}
 .artwork {width:var(--art-room); height:100%; padding:15px 20px 15px 0; display:flex; justify-content:flex-start; align-items:flex-start; --rhp-label-gap:0px;}
 .artwork img {display:block; width:118px; height:177px; object-fit:contain; object-position:left top;}
 .heading, .credits, .gross, .report {grid-column:track;}
 .heading {position:absolute; left:0; right:0; top:10px; display:flex; align-items:baseline; justify-content:space-between; gap:14px;}
 .title {font-size:40px; font-weight:600; line-height:1.15; white-space:nowrap;}
 .loss {font:400 48px/1.15 "Anton","Arial Narrow",Arial,sans-serif; color:var(--rhp-series-1); white-space:nowrap; font-variant-numeric:tabular-nums;}
 .credits {position:absolute; left:0; right:0; top:66px; font-size:30px; line-height:1.1;}
 .credits span {display:block;}
 .credits small {font-size:22px; color:var(--rhp-muted); margin-right:8px;}
 .gross {position:absolute; left:0; right:0; top:142px; color:var(--rhp-muted); font-size:21px; line-height:1.3;}
 .track, .base, .range {top:177px; translate:0; --rhp-radius:0px;}
 .track {background:transparent; border:1px solid #d2d4d5;}
 .range {background:repeating-linear-gradient(135deg,var(--rhp-series-1) 0 3px,var(--rhp-surface) 3px 8px); border:1px solid var(--rhp-series-1);}
 .range.empty {display:none;}
 .report {position:absolute; left:0; right:0; top:198px; display:flex; justify-content:space-between; gap:12px; font-size:18px; color:var(--rhp-muted); line-height:1.3;}
 @container (max-width:900px) {
  .artwork {padding:13px 15px 10px 0;}
  .artwork img {width:88px; height:132px;}
  .title {font-size:28px;}
  .loss {font-size:31px;}
  .credits {top:54px; font-size:20px;}
  .credits small {font-size:17px;}
  .gross {top:112px; font-size:15px;}
  .track, .base, .range {top:140px;}
  .report {top:165px; font-size:14px;}
 }
 @container (max-width:550px) {
  .artwork {padding:15px 9px 10px 0;}
  .artwork img {width:61px; height:92px;}
  .heading {top:11px; display:block;}
  .title {display:block; font-size:19px;}
  .loss {display:block; font-size:27px; margin-top:5px;}
  .credits {top:78px; font-size:12.5px; line-height:1.4;}
  .credits small {font-size:11.5px; margin-right:4px;}
  .gross {top:134px; font-size:11.5px; line-height:1.4;}
  .track, .base, .range {top:177px;}
  .report {top:202px; display:block; font-size:11px;}
  .report span {display:block;}
 }
`}, d => html`
 <div class=${() => d.id === ROWS[lead].id ? "film lead" : "film"} data-film=${() => d.id} data-row=${() => d.index} aria-label=${() => `${d.title}. ${forecast(d)} projected loss, ${d.report.publisher}, ${date(d.report.date)} 2026. Director ${director(d)}. Starring ${starring(d)}. ${d.report.basis}`}>
  <${Label} edge="start" class="artwork"><img src=${() => d.art} alt=${() => `${d.title} promotional film poster`} width="118" height="177" /><//>
  <div class="heading"><span class="title">${() => d.title}</span><strong class="loss">${() => forecast(d)}</strong></div>
  <div class="credits"><span><small>Director</small>${() => director(d)}</span><span><small>Starring</small>${() => starring(d)}</span></div>
  <div class="gross">${() => `${d.studioLabel} · Worldwide gross now: ${money.format(d.worldwide)}`}</div>
  <${Bar} to=${scale.max} thick="17px" color="grid" class="track" />
  <${Bar} to=${() => d.report.low} thick="17px" class="base" />
  <${Bar} from=${() => d.report.low} to=${() => d.report.high} thick="17px" class=${() => d.report.high > d.report.low ? "range" : "range empty"} />
  <div class="report"><span>${() => `${d.report.publisher} · ${date(d.report.date)} 2026`}</span><span>${() => d.id === "supergirl" ? "Theatrical loss forecast" : "Includes post-theatrical revenue"}</span></div>
 </div>`);

function MovieBombs() {
 return html`
 <${Poster} style=${{"--film-pitch":"224px", "--art-room":"144px"}}
  kicker=${html`<span>2026 · The costly gambles</span><span>Forecasts, not final losses</span>`}
  title=${html`<span>Tom Cruise’s <em>${ROWS[lead].title}</em> could<br/>lose <em>$${ROWS[lead].report.high} million.</em></span>`}
  dek="Four 2026 flops, with loss forecasts reported at the dates shown."
  note=${html`<span><b>Forecasts use different assumptions and revenue windows.</b> Moana has passed its model’s $250M gross. Sources: TheWrap, Deadline, Variety. Grosses/art: The Numbers, 17 Oct 2026. Selected cases.</span>`}
  >
  <div class="key"><span class="unit">Projected loss · US$ millions</span><span><i class="hatch"></i>Span of reported estimates</span></div>
  <${Chart} scale=${[scale.min, scale.max]} ticks=${false} static=${true} label="Reported loss forecasts for four 2026 film flops, in millions of US dollars. Ranges span different source estimates, not statistical confidence intervals." theme=${THEME}>
   <${Plot} rows=${ROWS} key="id">${Film}<//>
  <//>
  <div class="axis" aria-label="Every track uses the same scale"><span>$0</span><span>${`$${scale.max}M projected loss`}</span></div>
 <//>
 <section class="below" aria-label="Sources and forecast assumptions">
  <p>Forecast assumptions and original reports:</p>
  ${ROWS.map(row => html`<article class="source-detail">
   <h2>${row.title}: ${forecast(row)} forecast</h2>
   <p><a href=${row.report.url}>Original loss report</a> · <a href=${row.source}>Current box office and credits</a></p>
   <dl><dt>What was estimated</dt><dd>${row.report.basis}</dd><dt>Assumptions</dt><dd>${row.report.assumption}</dd><dt>What to keep in mind</dt><dd>${row.report.caveat}</dd><dt>Current box office</dt><dd>${exactMoney.format(row.worldwide)} worldwide as of 17 October 2026. Ticket sales are not studio revenue.</dd><dt>Production budget</dt><dd>${exactMoney.format(row.budget)} reported by The Numbers. Budget and gross are contextual figures, not the loss calculation.</dd></dl>
  </article>`)}
  <p class="files"><a href="data.json">Exact figures and report assumptions</a> · <a href="artwork-credits.json">Artwork credits</a> · <a href="post.txt">Reddit draft</a></p>
 </section>`;
}
render(() => html`<${MovieBombs} />`, document.getElementById("chart"));
</script>
<style>
@media (max-width:900px) {.poster {--film-pitch:192px !important; --art-room:108px !important;}}
@media (max-width:600px) {.poster {--film-pitch:240px !important; --art-room:71px !important;}}
</style>

</body>
</html>
