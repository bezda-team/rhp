<style>
  :root {

  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 16px; background: #0a0807; color: var(--cream); font-family: var(--text); }
  /* The poster: a dark CRT screen, warm in the middle, with scanlines over everything */
  .poster { container-type: inline-size; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; max-width: 1080px; margin: 0 auto; padding: 50px 60px 44px; overflow: hidden;
    background: radial-gradient(ellipse 75% 55% at 50% 0%, var(--glow), transparent 100%), radial-gradient(ellipse 120% 90% at 50% 45%, #1d1510, var(--ground) 70%, #100c0a); }
  .poster::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: repeating-linear-gradient(transparent 0 2px, rgb(0 0 0 / .2) 2px 4px); }
  .poster > * { grid-column: 1 / -1; min-width: 0; }
  .poster figcaption { display: grid; margin-bottom: 24px; }
  .kicker { display: flex; justify-content: space-between; align-items: baseline; font: 16px/1 var(--pixel); letter-spacing: .06em; color: var(--orange); }
  .kicker .play { font-family: var(--text); font-size: 1.5em; line-height: 0; vertical-align: -.1em; margin-right: .2em; }
  .kicker .rec { color: #ea4f41; } /* a touch brighter than the DNF red: the glow behind it is lighter */
  .kicker .rec::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 10px; vertical-align: 1px; background: currentColor; border-radius: 50%; animation: rec 1.2s steps(1) infinite; }
  @keyframes rec { 50% { opacity: 0; } }
  .headline { display: grid; margin-top: 32px; font-family: var(--pixel); text-transform: uppercase; }
  .headline .game { font-size: min(50px, 5.2cqw); line-height: 1; color: var(--cream); }
  .headline .run { margin-top: min(26px, 2.7cqw); font-size: min(103px, 10.7cqw); line-height: 1; color: #ffce5a; /* 3:1 against its orange edge */
    text-shadow: 2px 2px 0 var(--orange), 4px 4px 0 var(--orange), 6px 6px 0 var(--orange), 8px 8px 0 var(--brick), 10px 10px 0 var(--brick), 12px 12px 0 var(--brick); }
  .dek { margin-top: min(44px, 4.6cqw); max-width: 46em; font-size: clamp(17px, 2.8cqw, 27px); line-height: 1.3; color: var(--sand); text-wrap: pretty; }
  .dek b { font-weight: 700; color: var(--cream); }

  /* The leaderboard: a frame with its name on the top edge, the picked row lit inside, the frame counts below */
  .board { --pad: 21px; --axis: 24px; --pitch: 56px; --bar: 9px; position: relative; isolation: isolate; padding: 15px var(--pad) 0; }
  .board::before { content: ""; position: absolute; z-index: -1; inset: 0 0 var(--axis); border: 3px solid var(--line); background: rgb(0 0 0 / .35); }
  .board .tab { position: absolute; top: -8px; left: 60px; z-index: 1; padding: 0 12px; background: var(--ground); font: 12px/1 var(--pixel); letter-spacing: .06em; color: var(--muted); }
  .board .tab.hint { left: auto; right: 60px; }

  .split { display: flex; align-items: center; gap: 0 28px; flex-wrap: wrap; margin: 28px 0 0; font: 15px/1.6 var(--pixel); letter-spacing: .05em; color: var(--cream); }
  .split b { padding: 8px 12px 6px; background: var(--orange); font-weight: 400; color: #0a0807; }
  .split em { font-style: normal; white-space: nowrap; color: var(--gold); }

  .note { grid-column: 1; grid-row: 4; margin-top: 40px; max-width: 54em; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .note b { font-weight: 600; color: var(--stone); }
  .note a { color: inherit; }
  .credit { grid-column: 2; grid-row: 4; align-self: end; margin: 40px 0 0 40px; color: inherit; text-decoration: none; text-align: right; }
  .credit b { display: block; font-size: 22px; font-weight: 700; color: var(--cream); }
  .credit span { font-size: 14px; color: var(--muted); }

  .below { max-width: 1080px; margin: 14px auto 0; font-size: 13px; color: var(--muted); }
  .below a { color: inherit; }

  @media (prefers-reduced-motion: reduce) { .kicker .rec::before { animation: none; } }

  /* Narrower than the reference: each runner's name goes above its track, so the tracks keep their length */
  @media (max-width: 900px) {
    .poster { padding-inline: 40px; }
    .board { --pad: 14px; --pitch: 68px; --bar: 9px; }
    .board .tab { left: 32px; }
    .board .tab.hint { right: 32px; }
    .board .long { display: none; }
  }
  /* A phone: the same parts in one column, smaller type */

    body { padding: 16px 0 24px; }
    .below { padding-inline: 16px; }
    .poster { padding: 26px 16px 24px; }

    .poster figcaption { margin-bottom: 22px; }
    .kicker { font-size: 9px; letter-spacing: .02em; }
    .kicker .rec::before { width: 4px; height: 4px; margin-right: 6px; }
    .headline { margin-top: 22px; }
    .dek { font-size: 16px; }
    .board { --pad: 10px; --axis: 22px; --pitch: 60px; --bar: 7px; padding-top: 14px; }
    .board::before { border-width: 2px; }
    .board .tab { top: -5px; left: 16px; padding: 0 6px; font-size: 9px; }
    .board .tab.hint { right: 16px; }
    .split { gap: 8px 12px; margin-top: 18px; font-size: 9px; }
    .split b { padding: 6px 8px 5px; }
    .note { grid-column: 1 / -1; grid-row: 4; margin-top: 22px; font-size: 11.5px; }
    .credit { grid-column: 1 / -1; grid-row: 5; margin: 16px 0 0; }
    .credit b { font-size: 16px; }
    .credit span { font-size: 12px; }
  }
  @media (max-width: 420px) { .kicker .runners { display: none; } }
  @media (max-width: 359px) { .board .tab .board-name { display: none; } }

const PERFECT = { place: "DNF", runner: "Perfect run", seconds: DATA.perfect, frames: 0, date: null, perfect: true };
const ROWS = [...DATA.runs.map((r) => ({ ...r, perfect: false })), PERFECT];
const MAX = 66; // frames: a little past the slowest of the ten
const TICKS = [0, 15, 30, 45, 60]; // a quarter of a second each
const GROW = 0.625; // the picked row is this much of a row taller (91px against 56px on a desktop)
const saved = DATA.previous.frames - RECORD.frames; // frames the record took off the one before it
const GOLD = "#ffc94a", ORANGE = "#e07b4f", RED = "#e5483a";
const LONGEST = Math.max(...ROWS.map((r) => r.frames));
const PACE = 1; // the bars grow at the NES's own pace (1) or slower (0.5 is half speed)

const month = (date) => new Date(date + "T12:00:00Z").toLocaleString("en-US", { month: "short", year: "numeric", timeZone: "UTC" });
const two = (n) => String(n).padStart(2, "0");
const clockText = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(3).padStart(6, "0")}`;
// 4:54.332, its separators set small and dim
const clock = (s) => {
  const [whole, ms] = (s % 60).toFixed(3).split(".");
  return html`<b>${Math.floor(s / 60)}</b><i>:</i><b>${two(whole)}</b><i>.</i><b>${ms}</b>`;
};

  ? `Perfect run: ${clockText(r.seconds)}, not yet run by a human`
  : `${r.place === 1 ? `World record, ${saved} frames faster than the record before it` : `Place ${r.place}`}: ${r.runner}, ${clockText(r.seconds)}, ${r.frames} frames off perfect, ${month(r.date)}`;

      color: var(--cream); border-bottom: 1px solid var(--rule); }
    .row.dnf { border-bottom: 0; }
    .row::before { content: ""; position: absolute; inset: 0 calc(-1 * var(--pad)); border: 2px solid transparent; transition: top .3s ease-in-out, background-color .15s; }
    .row:not(.on):hover::before { background: color-mix(in srgb, var(--rhp-color) 8%, transparent); }
    .row:focus-visible { outline: none; }
    .row:focus-visible::before { outline: 2px solid var(--cream); outline-offset: -7px; }
    .place { width: var(--start); --rhp-label-gap: 0px; overflow: visible; text-align: left; font: var(--place-size)/1 var(--pixel); color: var(--muted); }
    .dnf .place { color: var(--red); }
    .who { position: absolute; left: var(--name-x); top: 50%; translate: 0 -50%; display: grid; gap: 4px; max-width: calc(var(--start) - var(--name-x) - 10px); }
    .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 var(--name-size)/1.1 var(--text); letter-spacing: -.01em; }
    .who small { font: 400 var(--date-size)/1.2 var(--text); color: var(--muted); }
    .dnf .who b { color: var(--red); }

// Chart component: a click, a tap or the keyboard picks a run, which is lit and grows; it stays picked until another is,
// or a click beside the chart
function Speedrun() {
  const [picked, setPicked] = createSignal(0); // the record's row at first
  const rowOf = (el) => {
    const root = el.closest("[data-row]");
    return root ? +root.dataset.row : null;
  };
  // A click beside the chart (on the headline, the note) goes back to the record
  const pick = (e) => {
    const row = rowOf(e.target);
    if (row != null) setPicked(row);
    else if (e.type === "click" && !e.target.closest(".rhp-chart, a")) setPicked(0);
  };
  // On load every bar grows from zero at the same pace, one block per frame at the NES's 60.0988 frames a second, so
  // each takes as long as its run lost to a perfect one (with reduced motion they are drawn at their length)
  const [ran, setRan] = createSignal(matchMedia("(prefers-reduced-motion: reduce)").matches ? LONGEST : 0);
  onMount(() => document.fonts.ready.then(() => {
    if (ran() >= LONGEST) return;
    let start = null;
    const tick = (now) => {
      start ??= now;
      setRan(Math.min(LONGEST, ((now - start) / 1000) * DATA.fps * PACE));
      if (ran() < LONGEST) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }));
  const shown = () => ROWS.map((r) => Math.min(r.frames, ran()));
  // Each row's place: the rows from the picked one down make room for its taller box
  const places = () => ROWS.map((r, i) => i + (i >= picked() ? GROW : 0));
  const theme = { font: "Inter, sans-serif", ink: "#f3e9dc", muted: "#8c7f72", grid: "#2c2420" };
  return html`
    <${Poster}
      kicker=${html`<span><span class="play">▶</span> PLAYER SELECT: TOP 10<span class="runners"> RUNNERS</span></span><span class="rec">REC</span>`}
      title=${html`<span class="game">${DATA.game.split(" (")[0]}</span>${" "}<span class="run">Speedrun</span>`}
      dek=${html`<span>Time from <b>taking control of Mario</b> to <b>Bowser's axe</b>, in frames off a perfect run. ${DATA.previous.runner} held the record at ${DATA.previous.frames} frames. <b>${RECORD.runner} just cut it to ${RECORD.frames}.</b></span>`}
      note=${html`<span><b>Any% (NTSC), each runner's best verified run on speedrun.com</b>, as of ${new Date(DATA.retrieved + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" })}. Timing starts when the player takes control of Mario and stops when he touches the axe in World 8-4; a frame is 1/60.0988 s. Perfect run: ${clockText(DATA.perfect)}, the fastest tool-assisted run within the real-time rules (2019), thought to be the best possible. Since 2023 the best runs match it up to World 8-4. Sources: <a href=${DATA.board}>speedrun.com</a>, <a href=${DATA.sources.history}>Wikipedia</a> (record history), Kotaku, Polygon.</span>`}
      onClick=${pick} onFocusIn=${pick}>
      <section class="board">
        <span class="tab" aria-hidden="true"><span class="board-name">LEADERBOARD · </span>ANY%</span>
        <span class="tab hint" aria-hidden="true"><span class="long">1 BLOCK = 1 FRAME · </span>PICK A RUN</span>
        <${Chart} scale=${[0, MAX]} theme=${theme} label="The ten fastest runs and the perfect run, in frames off perfect">
          <${Scale} ticks=${TICKS}>${Count}<//>
          <${Plot} keyboard=${true} rows=${ROWS} shown=${shown} order=${places} on=${(d) => picked() === d.index}>${Run}<//>
        <//>
      </section>
      <p class="split"><b>NEXT SPLIT</b><span>WORLD 8-4 · THE LAST LEVEL · <em>${RECORD.frames} FRAMES TO GO</em></span></p>
      <a class="credit" href="https://github.com/bezda-team/rhp" target="_blank" rel="noopener"><b>Made with rhp</b><span>github.com/bezda-team/rhp</span></a>
    <//>`;
}

render(() => html`<${Speedrun} />`, document.getElementById("chart"));
</script>

<script type="module" id="poster-download-script">
function addPosterFit(poster, button, changed) {
  const frame = document.createElement('div'), content = document.createElement('div');
  frame.className = 'poster-fit-frame'; content.className = 'poster-fit-content';
  poster.before(frame); frame.append(content); content.append(poster);
  const properties = ['width', 'max-width', 'margin', 'box-sizing'];
  const original = properties.map(name => [name, poster.style.getPropertyValue(name), poster.style.getPropertyPriority(name)]);
  let fitted = false, scale = 1, request = 0, layout = null;
  const availableHeight = () => parseFloat(getComputedStyle(frame).maxHeight) || innerHeight * .95;
  const layoutKey = () => {
    const css = getComputedStyle(poster);
    return [innerWidth, availableHeight(), css.width, css.height].join('/');
  };
  const restore = () => original.forEach(([name, value, priority]) => {
    if (value) poster.style.setProperty(name, value, priority);
    else poster.style.removeProperty(name);
  });
  function update() {
    request = 0;
    if (fitted && layout === layoutKey()) return;
    frame.classList.remove('is-fitted'); frame.style.width = ''; frame.style.height = '';
    content.style.width = ''; content.style.transform = ''; restore(); scale = 1;
    if (fitted) {
      const box = poster.getBoundingClientRect();
      scale = Math.min(1, availableHeight() / box.height);
      poster.style.setProperty('box-sizing', 'border-box');
      poster.style.setProperty('width', `${box.width}px`);
      poster.style.setProperty('max-width', 'none');
      poster.style.setProperty('margin', '0');
      content.style.width = `${box.width}px`;
      content.style.transform = `scale(${scale})`;
      frame.style.width = `${box.width * scale}px`; frame.style.height = `${box.height * scale}px`;
      frame.classList.add('is-fitted');
    }

    const label = fitted ? 'Restore poster size' : 'Fit poster to screen';
    button.setAttribute('aria-label', label); button.title = label;
    button.setAttribute('aria-pressed', String(fitted));
    button.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${fitted ? 'M15 3h6v6m0-6-7 7M9 21H3v-6m0 6 7-7' : 'M4 4l6 6m0-6v6H4m16 10-6-6m0 6v-6h6'}"/></svg>`;

      const css = getComputedStyle(poster);
      return {width:parseFloat(css.width),height:parseFloat(css.height)};
    },
  };
}

      // Safari misreports percentage insets in subgrids, and grid auto margins resolve to zero.
      const autoMargins = new Set(), positioned = new Set();
      const isMargin = name => name === 'margin' || name.startsWith('margin-');
      const isInset = name => name === 'inset' || name.startsWith('inset-') || ['top', 'right', 'bottom', 'left'].includes(name);
      const layoutRules = rules => [...rules].map(rule => {
        if (rule.selectorText && rule.style) {
          const margins = [...rule.style].filter(isMargin);
          if (margins.some(name => /\bauto\b/.test(rule.style.getPropertyValue(name)))) autoMargins.add(rule.selectorText);
          const insets = [...rule.style].filter(isInset);
          if (insets.length) positioned.add(rule.selectorText);
          const layout = [...margins, ...insets];
          return layout.length ? `${rule.selectorText} { ${layout.map(name => `${name}: ${rule.style.getPropertyValue(name)}${rule.style.getPropertyPriority(name) ? ' !important' : ''};`).join(' ')} }` : '';
        }
        if (!rule.cssRules) return /^@layer\b/.test(rule.cssText) ? rule.cssText : '';
        if (rule instanceof CSSMediaRule) return matchMedia(rule.conditionText).matches ? layoutRules(rule.cssRules) : '';
        if (rule instanceof CSSSupportsRule) return CSS.supports(rule.conditionText) ? layoutRules(rule.cssRules) : '';
        return rule.cssText.slice(0, rule.cssText.indexOf('{') + 1) + layoutRules(rule.cssRules) + '}';
      }).join('\n');
      const sheets = [...document.styleSheets, ...document.adoptedStyleSheets];
      const layout = sheets.map(sheet => {
        try { return layoutRules(sheet.cssRules); } catch (cause) { return ''; }
      }).join('\n');
      // Omit display-none HTML subtrees, such as collapsed chart rows, from the image and its SVG payload.
      const includeNode = node => !(node instanceof HTMLElement) || getComputedStyle(node).display !== 'none';
      const restoreLayout = (source, clone) => {
        if (clone.style && source !== poster) {
          const margins = [...autoMargins].some(selector => source.matches(selector));
          const computed = getComputedStyle(source);
          const insets = computed.position === 'absolute' && [...positioned].some(selector => source.matches(selector));
          const restore = name => (margins && isMargin(name)) || (insets && isInset(name));
          [...clone.style].filter(restore).forEach(name => clone.style.removeProperty(name));
          [...source.style].filter(restore).forEach(name => clone.style.setProperty(name, source.style.getPropertyValue(name), source.style.getPropertyPriority(name)));
          if (insets) {
            // Only the scaled axis needs its percentage rule. Freeze the other axis in pixels:
            // Firefox does not reevaluate container queries reliably inside an SVG foreignObject.
            const axis = source.getAttribute('data-rhp-o');
            const fixed = axis === 'h' ? ['top', 'bottom'] : axis === 'v' ? ['left', 'right'] : ['top', 'right', 'bottom', 'left'];
            fixed.forEach(name => clone.style.setProperty(name, computed.getPropertyValue(name), 'important'));
          }
        }
        const children = [...source.children].filter(node => !['STYLE', 'SCRIPT'].includes(node.tagName) && includeNode(node));
        [...clone.children].forEach((child, i) => { if (children[i]) restoreLayout(children[i], child); });
      };
      // Cross-origin font stylesheets are readable through fetch, but not through cssRules.
      const fontFiles = new Map();
      const fontRules = await Promise.all(sheets.map(async sheet => {
        let css;
        try { css = [...sheet.cssRules].map(rule => rule.cssText).join('\n'); }
        catch (cause) {
          if (!sheet.href) return '';
          const response = await fetch(sheet.href);
          if (!response.ok) throw new Error('Font stylesheet could not be loaded');
          css = await response.text();
        }
        const rules = css.match(/@font-face\s*\{[^}]*\}/g) || [];
        return (await Promise.all(rules.map(async rule => {
          for (const match of [...rule.matchAll(/url\(["']?([^"')]+)["']?\)/g)]) {
            const source = new URL(match[1], sheet.href || document.baseURI).href;
            if (!fontFiles.has(source)) fontFiles.set(source, (async () => {
              const response = await fetch(source);
              if (!response.ok) throw new Error('Font could not be loaded');
              const blob = await response.blob();
              return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
              });
            })());
            rule = rule.replace(match[1], await fontFiles.get(source));
          }
          return rule;
        }))).join('\n');
      }));
      // Rasterize SVG paper textures before nesting them inside the exporter's SVG.
      // This keeps SVG filter fragment references local to their own image.
      const textures = new Map();
      const embedTexture = async (node) => {
        if (!node.style) return;
        let background = node.style.backgroundImage;
        for (const [, source] of background.matchAll(/url\("(data:image\/svg\+xml[^"]+)"\)/g)) {
          if (!textures.has(source)) textures.set(source, (async () => {
            const image = new Image();
            image.src = source;
            await image.decode();
            const canvas = document.createElement('canvas');
            canvas.width = image.naturalWidth;
            canvas.height = image.naturalHeight;
            canvas.getContext('2d').drawImage(image, 0, 0);
            return canvas.toDataURL();
          })());
          background = background.replace(source, await textures.get(source));
        }
        node.style.backgroundImage = background;
      };
      return {
        ...fit.dimensions(), style: { margin: '0' }, filter: includeNode,
        font: { cssText: fontRules.join('\n') }, onCloneEachNode: embedTexture,
        onCloneNode: clone => {
          restoreLayout(poster, clone);
          const style = document.createElement('style');
          style.textContent = layout;
          clone.prepend(style);
        },
        // CSS content's alternative text follows a slash and must not be painted.
        onCreateForeignObjectSvg: svg => svg.querySelectorAll('style').forEach(style => {
          style.textContent = style.textContent.replace(/(content:\s*')([^']*)(')/g, (_, start, text, end) => start + text.split(' / ')[0] + end);
        }),
      };
    }
    let url;
    const save = (blob, extension) => {
      url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const title = poster.querySelector('.headline')?.textContent || document.title || 'poster';
      link.download = (title.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 100) || 'poster') + '.' + extension;
      link.href = url;
      link.addEventListener('click', event => event.stopPropagation(), { once: true });
      document.body.append(link);
      link.click();
      link.remove();
    };
    const begin = kind => {
      busy = true;
      making = kind;
      button.setAttribute('aria-busy', 'true');
      fitButton.setAttribute('aria-disabled', 'true');
      // A GIF takes a while: the button shows its progress and cancels it
      if (kind === 'gif') label('Cancel the GIF');
      else { button.setAttribute('aria-disabled', 'true'); label('Preparing poster PNG'); }
      error.hidden = true;
    };
    const end = () => {
      if (url) setTimeout(() => URL.revokeObjectURL(url), 60000);
      url = null;
      busy = false;
      making = null;
      cancelled = false;
      button.innerHTML = icon;
      button.removeAttribute('aria-disabled');
      button.removeAttribute('aria-busy');
      fitButton.removeAttribute('aria-disabled');
      rest();
    };
    const fail = message => {
      exporter = null;
      encoder = null;
      retries++;
      error.textContent = message;
      error.hidden = false;
    };
    async function savePng() {
      begin('png');
      try {
        const { domToBlob } = await loadExporter();
        const blob = await domToBlob(poster, { ...(await captureOptions()), scale: 2 });
        if (!blob) throw new Error('No PNG was created');
        save(blob, 'png');
      } catch (cause) {
        fail('The PNG could not be saved. Check your connection and try again.');
      } finally {
        end();
      }
    }
    // The GIF's clock: while it is made, rhp's motion (performance.now and animation frames) and the page's CSS
    // animations run on a time of their own, which only moves on when a frame asks it to, so every frame shows the chart
    // exactly as it is that many milliseconds into playing, its glides and slides included
    const gifClock = () => {
      const raf = window.requestAnimationFrame, caf = window.cancelAnimationFrame;
      const queue = new Map(), started = new Map();
      let time = performance.now(), id = 0, pump = 0;
      const flush = () => {
        const due = [...queue.values()];
        queue.clear();
        due.forEach(callback => { try { callback(time); } catch (cause) { reportError(cause); } });
      };
      // Callbacks still run every real frame, at the clock's time, so whatever waits for a frame is not held up
      const loop = () => { flush(); pump = raf.call(window, loop); };
      window.requestAnimationFrame = callback => { queue.set(++id, callback); return id; };
      window.cancelAnimationFrame = n => queue.delete(n);
      performance.now = () => time;
      pump = raf.call(window, loop);
      return {
        // Two of the browser's frames: callbacks that were already waiting for one (rhp's ticker) come over to the clock
        ready: new Promise(resolve => raf.call(window, () => raf.call(window, resolve))),
        advance(ms, steps = 1) {
          for (let i = 0; i < steps; i++) {
            time += ms / steps;
            // A frame's motion, then the style writes it schedules
            flush(); flush(); flush();
            for (const animation of document.getAnimations()) {
              if (!started.has(animation)) started.set(animation, time - (animation.currentTime ?? 0));
              animation.pause();
              animation.currentTime = time - started.get(animation);
            }
          }
        },
        stop() {
          caf.call(window, pump);
          window.requestAnimationFrame = raf;
          window.cancelAnimationFrame = caf;
          delete performance.now;
          for (const callback of queue.values()) raf.call(window, callback);
          started.forEach((_, animation) => animation.play());
        },
      };
    };
    // The GIF: the playback at its own pace, 25 frames a second, at most 1200 pixels wide. One palette from the
    // first and the last frame serves every frame; its last color is never drawn and marks the pixels a frame leaves as
    // the frame before had them, so each frame stores only what changed.
    async function saveGif() {
      const playback = poster.playback;
      const from = playback.position();
      let clock = null;
      begin('gif');
      try {
        encoder ||= import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm' + (retries ? `?retry=${retries}` : ''));
        const [{ domToCanvas }, { GIFEncoder, quantize, applyPalette }] = await Promise.all([loadExporter(), encoder]);
        const options = await captureOptions();
        const scale = Math.min(1, 1200 / options.width);
        // The GIF plays at the chart's own pace: its playback's duration, in frames 40 ms apart
        const step = 40, count = Math.max(2, Math.round((playback.duration ?? 15000) / step) + 1);
        const capture = async () => {
          const canvas = await domToCanvas(poster, { ...options, scale });
          return canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
        };
        clock = gifClock();
        await clock.ready;
        // The end and the start, each given a second to settle, for the palette; the start is also the first frame
        playback.seek(1);
        clock.advance(1000, 25);
        const last = await capture();
        playback.seek(0);
        clock.advance(1000, 25);
        const first = await capture();
        const both = new Uint8ClampedArray(first.data.length + last.data.length);
        both.set(first.data);
        both.set(last.data, first.data.length);
        const palette = quantize(both, 255), kept = palette.length;
        // A flat color that fills a part of the poster keeps its exact value: it takes the nearest palette entry
        const counts = new Map(), taken = new Set();
        for (let j = 0; j < both.length; j += 4) {
          const color = (both[j] << 16) | (both[j + 1] << 8) | both[j + 2];
          counts.set(color, (counts.get(color) ?? 0) + 1);
        }
        for (const [color] of [...counts].filter(([, n]) => n > both.length / 8000).sort((a, b) => b[1] - a[1])) {
          const rgb = [color >> 16, (color >> 8) & 255, color & 255];
          let nearest = -1, distance = Infinity;
          palette.forEach((entry, k) => {
            const d = (entry[0] - rgb[0]) ** 2 + (entry[1] - rgb[1]) ** 2 + (entry[2] - rgb[2]) ** 2;
            if (!taken.has(k) && d < distance) { nearest = k; distance = d; }
          });
          if (nearest >= 0) { palette[nearest] = rgb; taken.add(nearest); }
        }
        palette.push([255, 0, 255]);
        const gif = GIFEncoder();
        let previous = null;
        for (let i = 0; i < count; i++) {
          if (cancelled) return;
          if (i > 0) {
            playback.seek(i / (count - 1));
            clock.advance(step);
            // The last frame is held: it shows the end settled
            if (i === count - 1) clock.advance(1000, 25);
          }
          const image = i === 0 ? first : await capture();
          const index = applyPalette(image.data, palette.slice(0, kept));
          const pixels = previous ? index.map((p, j) => (p === previous[j] ? kept : p)) : index;
          gif.writeFrame(pixels, image.width, image.height, {
            palette: i === 0 ? palette : undefined, delay: i === 0 ? 1000 : i === count - 1 ? 3000 : step,
            transparent: i > 0, transparentIndex: kept, dispose: 1,
          });
          previous = index;
          const done = Math.round(((i + 1) / count) * 100);
          button.innerHTML = `<span class="poster-download-progress" aria-hidden="true">${done}%</span>`;
          label(`Cancel the GIF, ${done}% made`);
        }
        gif.finish();
        save(new Blob([gif.bytes()], { type: 'image/gif' }), 'gif');
      } catch (cause) {
        fail('The GIF could not be made. Check your connection and try again.');
      } finally {
        clock?.stop();
        playback.seek(from);
        end();
      }
    }
    button.addEventListener('click', event => {
      event.stopPropagation();
      if (busy) {
        if (making === 'gif') cancelled = true;
        return;
      }
      if (!playable()) return savePng();
      // A key press is a click with no pointer detail: it opens the menu on its first item
      if (menu.hidden) openMenu(event.detail === 0);
      else closeMenu(event.detail === 0);
    });
    menu.addEventListener('click', event => {
      const item = event.target.closest('[data-format]');
      if (!item) return;
      event.stopPropagation();
      closeMenu(event.detail === 0);
      if (item.dataset.format === 'gif') saveGif();
      else savePng();
    });
    tools.append(actions);
  });
}
// A chart module may await fonts or data after DOMContentLoaded has already fired.
if (document.querySelector('.poster')) addPosterDownloads();
else {
  const observer = new MutationObserver(() => {
    if (!document.querySelector('.poster')) return;
    observer.disconnect();
    addPosterDownloads();
  });
  observer.observe(document.getElementById('chart') || document.body, { childList: true, subtree: true });
}
</script>
</body>
</html>
