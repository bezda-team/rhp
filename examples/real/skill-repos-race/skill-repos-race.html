/* GitHub's dark default theme, from Primer's tokens: the canvas, its borders, text and link colors, the starred star's
   gold, and the contribution graph's greens */
:root { color-scheme: dark; --canvas: #0d1117; --canvas-muted: #151b23; --page: #010409; --fg: #f0f6fc; --muted: #9198a1;
  --border: #3d444d; --border-muted: #3d444db3; --link: #4493f8; --topic-bg: #121d2f; --disabled: #656c76;
  --btn: #212830; --btn-hover: #262c36; --label-gold: #bb800926; --label-gold-edge: #bb800966; --star: #e3b341;
  --attention: #d29922; --bar: #1d232b; --bar-edge: #656c76;
  --g0: #151b23; --g1: #033a16; --g2: #196c2e; --g3: #2ea043; --g4: #56d364; --g-edge: #0104090d;
  --text: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; padding: 40px 16px; background: var(--page); color: var(--fg); font: 16px/1.5 var(--text); }
/* The poster is a GitHub Box: a bordered canvas with a muted header row */
.poster { max-width: 1080px; margin: 0 auto; padding: 0 44px 22px; background: var(--canvas); border: 1px solid var(--border); border-radius: 12px; overflow: clip; }
.poster figcaption { display: grid; gap: 14px; margin: 0 0 16px; }
.poster .kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 -44px 10px; padding: 14px 44px; background: var(--canvas-muted); border-bottom: 1px solid var(--border); font-size: 15px; color: var(--muted); }
.topic { padding: 2px 11px; border-radius: 2em; background: var(--topic-bg); color: var(--link); font-size: 14px; font-weight: 600; line-height: 22px; }
/* The headline is a README's h1: semibold, with its rule under it */
.poster .headline { padding-bottom: 12px; border-bottom: 1px solid var(--border-muted); font: 600 50px/1.15 var(--text); letter-spacing: -.01em; text-wrap: balance; }
.poster .headline a { color: var(--link); text-decoration: none; }
/* "starred" in the starred repos' gold */
.poster .headline .starred { color: var(--star); }
.poster .dek { max-width: 92ch; font-size: 19px; line-height: 1.5; color: var(--fg); }
.poster .dek b { font-weight: 600; }
.repo-link { color: var(--link); font-weight: 600; text-decoration: none; }
.repo-link:hover { font-weight: 700; }
.repo-link:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 3px; }
/* The race: on a desktop the readout above the chart and the week graph under it; on a phone the two ride together
   above the chart, in a dock that stays at the top of the screen while the chart scrolls under it */
.race { display: grid; grid-template-areas: "readout" "stage" "timeline"; }
.dock { display: contents; }
.readout { grid-area: readout; height: 28px; margin: 0 0 6px; overflow: hidden; font-size: 17px; line-height: 28px; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); }
.readout b { color: var(--fg); font-weight: 600; }
.stage { grid-area: stage; position: relative; --slat: 60px; --inset: 19px; }
/* The date, large in the empty place under the shortest bars, as the race plays */
.when { position: absolute; right: 0; bottom: 34px; z-index: 2; padding: 0 0 0 12px; background: var(--canvas); font: 600 62px/1 var(--text); letter-spacing: -.02em; color: var(--disabled); pointer-events: none; }
.stage .rhp-chart { position: relative; z-index: 1; }
.tick { font-variant-numeric: proportional-nums; }
/* The year as GitHub's contribution graph: one square a week, colored by the stars every tracked repo gained that
   week, filled up to the date shown, with the graph's own heading counting the stars; the native slider over the
   squares scrubs the year */
.timeline { grid-area: timeline; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "count play" "graph graph"; align-items: center; gap: 10px 18px; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--border); }
.count { grid-area: count; margin: 0; font-size: 18px; font-weight: 400; color: var(--fg); }
.play { grid-area: play; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 104px; height: 40px; padding: 0 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--btn); color: var(--fg); font: 600 15px/1 var(--text); cursor: pointer; }
.play svg { width: 16px; height: 16px; fill: currentColor; }
.play:hover { background: var(--btn-hover); }
.play:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
.graph { grid-area: graph; position: relative; min-width: 0; }
.months { position: relative; height: 18px; font-size: 13px; color: var(--fg); }
.months span { position: absolute; top: 0; }
/* Who was first, as GitHub labels across the days they led: a starred repo's label in attention gold */
.leads { position: relative; height: 24px; margin-bottom: 6px; }
.leads span { position: absolute; top: 0; height: 22px; padding: 0 9px; overflow: hidden; border: 1px solid var(--border); border-radius: 2em; font-size: 12.5px; font-weight: 500; line-height: 20px; white-space: nowrap; color: var(--muted); opacity: .45; }
.leads span.lit { border-color: var(--label-gold-edge); background: var(--label-gold); color: var(--attention); }
.leads span.on { opacity: 1; }
.leads span.bare { padding: 0; }
.weeks { display: grid; grid-template-columns: repeat(var(--weeks), minmax(0, 1fr)); gap: 3px; }
.weeks i { aspect-ratio: 1; border-radius: 2px; background: var(--g0); box-shadow: inset 0 0 0 1px var(--g-edge); }
.weeks i[data-l="1"].on { background: var(--g1); }
.weeks i[data-l="2"].on { background: var(--g2); }
.weeks i[data-l="3"].on { background: var(--g3); }
.weeks i[data-l="4"].on { background: var(--g4); }
/* The current week's ring lies over its neighbors, and the slider over all the squares */
.weeks i.now { position: relative; z-index: 1; outline: 2px solid var(--fg); outline-offset: 2px; }
.scrub { position: absolute; z-index: 2; left: 0; top: 48px; width: var(--span); height: 30px; margin: -8px 0 0; opacity: 0; cursor: pointer; appearance: none; -webkit-appearance: none; touch-action: pan-y; }
.scrub::-webkit-slider-thumb { width: 1px; height: 30px; -webkit-appearance: none; }
.scrub::-moz-range-thumb { width: 1px; height: 30px; border: 0; }
.graph:has(.scrub:focus-visible) .weeks { outline: 2px solid var(--link); outline-offset: 5px; border-radius: 3px; }
.under { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 18px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.legend { display: inline-flex; align-items: center; gap: 3px; }
.legend i { width: 12px; height: 12px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--g-edge); }
.legend span { margin: 0 4px; }
.poster .note { display: block; margin: 18px -44px -22px; padding: 14px 44px 16px; border-top: 1px solid var(--border); background: var(--canvas-muted); font-size: 13px; line-height: 1.5; color: var(--muted); }
.poster .note b { color: var(--fg); font-weight: 600; }
@media (min-width: 641px) and (max-width: 999px) {
  .readout { height: auto; min-height: 2lh; line-height: 26px; white-space: normal; }
}
@media (max-width: 640px) {
  body { padding: 16px 12px 28px; }
  .poster { padding: 0 16px 16px; border-radius: 6px; }
  .poster figcaption { gap: 12px; margin-bottom: 12px; }
  .poster .kicker { margin: 0 -16px 4px; padding: 10px 16px; font-size: 13px; gap: 6px 10px; }
  .topic { font-size: 12px; padding: 0 9px; }
  .poster .headline { padding-bottom: 8px; font-size: clamp(26px, 7.6vw, 38px); }
  .poster .dek { font-size: 15.5px; }
  .race { display: flex; flex-direction: column; }
  .stage { --slat: 46px; --inset: 15px; }
  .when { font-size: 34px; bottom: 28px; }
  .dock { display: block; order: -1; position: sticky; top: 0; z-index: 3; margin: 0 -16px 6px; padding: 8px 16px 10px; background: var(--canvas); border-bottom: 1px solid var(--border); }
  .readout { height: auto; min-height: 3lh; margin: 0 0 6px; font-size: 14px; line-height: 20px; white-space: normal; }
  .timeline { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "play graph"; gap: 0 12px; margin-top: 0; padding-top: 0; border-top: 0; }
  .count { display: none; }
  /* On a phone Play is its icon, and the week graph takes the width */

      }));
      // Rasterize SVG paper textures before nesting them inside the exporter's SVG.
      // This keeps SVG filter fragment references local to their own image.
      const textures = new Map();
      const embedTexture = async (node) => {
        if (!node.style) return;
        let background = node.style.backgroundImage;
        for (const [, source] of background.matchAll(/url\("(data:image\/svg\+xml[^"]+)"\)/g)) {
          if (!textures.has(source)) textures.set(source, (async () => {
            const image = new Image();
            image.src = source;
            await image.decode();
            const canvas = document.createElement('canvas');
            canvas.width = image.naturalWidth;
            canvas.height = image.naturalHeight;
            canvas.getContext('2d').drawImage(image, 0, 0);
            return canvas.toDataURL();
          })());
          background = background.replace(source, await textures.get(source));
        }
        node.style.backgroundImage = background;
      };
      return {
        ...fit.dimensions(), style: { margin: '0' }, filter: includeNode,
        font: { cssText: fontRules.join('\n') }, onCloneEachNode: embedTexture,
        onCloneNode: clone => {
          restoreLayout(poster, clone);
          const style = document.createElement('style');
          style.textContent = layout;
          clone.prepend(style);
        },
        // CSS content's alternative text follows a slash and must not be painted.
        onCreateForeignObjectSvg: svg => svg.querySelectorAll('style').forEach(style => {
          style.textContent = style.textContent.replace(/(content:\s*')([^']*)(')/g, (_, start, text, end) => start + text.split(' / ')[0] + end);
        }),
      };
    }
    let url;
    const save = (blob, extension) => {
      url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const title = poster.querySelector('.headline')?.textContent || document.title || 'poster';
      link.download = (title.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 100) || 'poster') + '.' + extension;
      link.href = url;
      link.addEventListener('click', event => event.stopPropagation(), { once: true });
      document.body.append(link);
      link.click();
      link.remove();
    };
    const begin = kind => {
      busy = true;
      making = kind;
      button.setAttribute('aria-busy', 'true');
      fitButton.setAttribute('aria-disabled', 'true');
      // A GIF takes a while: the button shows its progress and cancels it
      if (kind === 'gif') label('Cancel the GIF');
      else { button.setAttribute('aria-disabled', 'true'); label('Preparing poster PNG'); }
      error.hidden = true;
    };
    const end = () => {
      if (url) setTimeout(() => URL.revokeObjectURL(url), 60000);
      url = null;
      busy = false;
      making = null;
      cancelled = false;
      button.innerHTML = icon;
      button.removeAttribute('aria-disabled');
      button.removeAttribute('aria-busy');
      fitButton.removeAttribute('aria-disabled');
      rest();
    };
    const fail = message => {
      exporter = null;
      encoder = null;
      retries++;
      error.textContent = message;
      error.hidden = false;
    };
    async function savePng() {
      begin('png');
      try {
        const { domToBlob } = await loadExporter();
        const blob = await domToBlob(poster, { ...(await captureOptions()), scale: 2 });
        if (!blob) throw new Error('No PNG was created');
        save(blob, 'png');
      } catch (cause) {
        fail('The PNG could not be saved. Check your connection and try again.');
      } finally {
        end();
      }
    }
    // The GIF's clock: while it is made, rhp's motion (performance.now and animation frames) and the page's CSS
    // animations run on a time of their own, which only moves on when a frame asks it to, so every frame shows the chart
    // exactly as it is that many milliseconds into playing, its glides and slides included
    const gifClock = () => {
      const raf = window.requestAnimationFrame, caf = window.cancelAnimationFrame;
      const queue = new Map(), started = new Map();
      let time = performance.now(), id = 0, pump = 0;
      const flush = () => {
        const due = [...queue.values()];
        queue.clear();
        due.forEach(callback => { try { callback(time); } catch (cause) { reportError(cause); } });
      };
      // Callbacks still run every real frame, at the clock's time, so whatever waits for a frame is not held up
      const loop = () => { flush(); pump = raf.call(window, loop); };
      window.requestAnimationFrame = callback => { queue.set(++id, callback); return id; };
      window.cancelAnimationFrame = n => queue.delete(n);
      performance.now = () => time;
      pump = raf.call(window, loop);
      return {
        // Two of the browser's frames: callbacks that were already waiting for one (rhp's ticker) come over to the clock
        ready: new Promise(resolve => raf.call(window, () => raf.call(window, resolve))),
        advance(ms, steps = 1) {
          for (let i = 0; i < steps; i++) {
            time += ms / steps;
            // A frame's motion, then the style writes it schedules
            flush(); flush(); flush();
            for (const animation of document.getAnimations()) {
              if (!started.has(animation)) started.set(animation, time - (animation.currentTime ?? 0));
              animation.pause();
              animation.currentTime = time - started.get(animation);
            }
          }
        },
        stop() {
          caf.call(window, pump);
          window.requestAnimationFrame = raf;
          window.cancelAnimationFrame = caf;
          delete performance.now;
          for (const callback of queue.values()) raf.call(window, callback);
          started.forEach((_, animation) => animation.play());
        },
      };
    };
    // The GIF: the playback at its own pace, 25 frames a second, at most 1200 pixels wide. One palette from the
    // first and the last frame serves every frame; its last color is never drawn and marks the pixels a frame leaves as
    // the frame before had them, so each frame stores only what changed.
    async function saveGif() {
      const playback = poster.playback;
      const from = playback.position();
      let clock = null;
      begin('gif');
      try {
        encoder ||= import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm' + (retries ? `?retry=${retries}` : ''));
        const [{ domToCanvas }, { GIFEncoder, quantize, applyPalette }] = await Promise.all([loadExporter(), encoder]);
        const options = await captureOptions();
        const scale = Math.min(1, 1200 / options.width);
        // The GIF plays at the chart's own pace: its playback's duration, in frames 40 ms apart
        const step = 40, count = Math.max(2, Math.round((playback.duration ?? 15000) / step) + 1);
        const capture = async () => {
          const canvas = await domToCanvas(poster, { ...options, scale });
          return canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
        };
        clock = gifClock();
        await clock.ready;
        // The end and the start, each given a second to settle, for the palette; the start is also the first frame
        playback.seek(1);
        clock.advance(1000, 25);
        const last = await capture();
        playback.seek(0);
        clock.advance(1000, 25);
        const first = await capture();
        const both = new Uint8ClampedArray(first.data.length + last.data.length);
        both.set(first.data);
        both.set(last.data, first.data.length);
        const palette = quantize(both, 255), kept = palette.length;
        // A flat color that fills a part of the poster keeps its exact value: it takes the nearest palette entry
        const counts = new Map(), taken = new Set();
        for (let j = 0; j < both.length; j += 4) {
          const color = (both[j] << 16) | (both[j + 1] << 8) | both[j + 2];
          counts.set(color, (counts.get(color) ?? 0) + 1);
        }
        for (const [color] of [...counts].filter(([, n]) => n > both.length / 8000).sort((a, b) => b[1] - a[1])) {
          const rgb = [color >> 16, (color >> 8) & 255, color & 255];
          let nearest = -1, distance = Infinity;
          palette.forEach((entry, k) => {
            const d = (entry[0] - rgb[0]) ** 2 + (entry[1] - rgb[1]) ** 2 + (entry[2] - rgb[2]) ** 2;
            if (!taken.has(k) && d < distance) { nearest = k; distance = d; }
          });
          if (nearest >= 0) { palette[nearest] = rgb; taken.add(nearest); }
        }
        palette.push([255, 0, 255]);
        const gif = GIFEncoder();
        let previous = null;
        for (let i = 0; i < count; i++) {
          if (cancelled) return;
          if (i > 0) {
            playback.seek(i / (count - 1));
            clock.advance(step);
            // The last frame is held: it shows the end settled
            if (i === count - 1) clock.advance(1000, 25);
          }
          const image = i === 0 ? first : await capture();
          const index = applyPalette(image.data, palette.slice(0, kept));
          const pixels = previous ? index.map((p, j) => (p === previous[j] ? kept : p)) : index;
          gif.writeFrame(pixels, image.width, image.height, {
            palette: i === 0 ? palette : undefined, delay: i === 0 ? 1000 : i === count - 1 ? 3000 : step,
            transparent: i > 0, transparentIndex: kept, dispose: 1,
          });
          previous = index;
          const done = Math.round(((i + 1) / count) * 100);
          button.innerHTML = `<span class="poster-download-progress" aria-hidden="true">${done}%</span>`;
          label(`Cancel the GIF, ${done}% made`);
        }
        gif.finish();
        save(new Blob([gif.bytes()], { type: 'image/gif' }), 'gif');
      } catch (cause) {
        fail('The GIF could not be made. Check your connection and try again.');
      } finally {
        clock?.stop();
        playback.seek(from);
        end();
      }
    }
    button.addEventListener('click', event => {
      event.stopPropagation();
      if (busy) {
        if (making === 'gif') cancelled = true;
        return;
      }
      if (!playable()) return savePng();
      // A key press is a click with no pointer detail: it opens the menu on its first item
      if (menu.hidden) openMenu(event.detail === 0);
      else closeMenu(event.detail === 0);
    });
    menu.addEventListener('click', event => {
      const item = event.target.closest('[data-format]');
      if (!item) return;
      event.stopPropagation();
      closeMenu(event.detail === 0);
      if (item.dataset.format === 'gif') saveGif();
      else savePng();
    });
    tools.append(actions);
  });
}
// A chart module may await fonts or data after DOMContentLoaded has already fired.
if (document.querySelector('.poster')) addPosterDownloads();
else {
  const observer = new MutationObserver(() => {
    if (!document.querySelector('.poster')) return;
    observer.disconnect();
    addPosterDownloads();
  });
  observer.observe(document.getElementById('chart') || document.body, { childList: true, subtree: true });
}
</script>
</body>
</html>
