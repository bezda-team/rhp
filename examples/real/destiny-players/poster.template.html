<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destiny 2's Steam player rebounds, from final-update news to unvaulting</title>
<meta name="description" content="A daily Steam concurrency timeline from May through October 2026, with event markers for final-update news, the release, unvaulting, and October hiring reports.">
<script type="importmap">{"imports":{"@bezda/rhp/standalone":"https://cdn.jsdelivr.net/npm/@bezda/rhp@2.0.5/dist/standalone.js"}}</script>
<style>
__FONTS__
:root { color-scheme: light; --page: #d7dbd7; --paper: #f7f7ef; --ink: #24323c; --soft: #4e606d; --rule: #c7cec8; --gold: #8b650d; --before: #5b7181; --display: "Space Grotesk", Arial, sans-serif; --text: "IBM Plex Sans", Arial, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px; background: var(--page); color: var(--ink); font: 16px/1.45 var(--text); }
.poster { position: relative; isolation: isolate; overflow: clip; max-width: 880px; margin: 0 auto; padding: 26px 28px 22px; background: var(--paper); border-top: 4px solid var(--gold); }
.poster-art { position: absolute; left: 50%; top: calc(40% - 80px); width: 180%; translate: -50% -40%; z-index: -1; pointer-events: none; opacity: .12; }
.poster-art img { display: block; width: 100%; height: auto; }
.poster-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(var(--paper), transparent 10%, transparent 88%, var(--paper)); }
.poster figcaption { display: grid; gap: 12px; margin: 0 0 18px; }
.poster .kicker { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 7px 16px; border-bottom: 1px solid var(--rule); padding-bottom: 11px; font-size: 13px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: var(--soft); }
.game { color: var(--ink); font: 700 22px/1.1 var(--display); letter-spacing: .1em; }
.poster .headline { max-width: 28ch; font: 700 42px/1.07 var(--display); letter-spacing: -.035em; text-wrap: balance; }
.poster .headline em { font-style: normal; color: var(--gold); }
.poster .dek { max-width: 70ch; font-size: 17px; line-height: 1.4; color: var(--soft); }
.outcomes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin: 18px 0 0; padding: 16px 0; border-block: 1px solid var(--rule); }
.outcomes section { min-width: 0; }
.outcomes h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; line-height: 1.4; }
.outcomes .number { display: block; margin-bottom: 8px; color: var(--gold); font: 700 34px/1 var(--display); letter-spacing: -.04em; }
.outcomes .number.wait { font-size: 27px; }
.outcomes p { margin: 0; color: var(--soft); font-size: 14px; line-height: 1.4; }
.outcomes p b { color: var(--ink); font-weight: 600; }
.outcomes small { display: block; margin-top: 5px; font-size: 12px; color: var(--soft); }
.chart-unit { margin: 0; font-size: 14px; font-weight: 600; color: var(--soft); }
.timeline { touch-action: pan-y; }
.axis-value { font-size: 13px; }
.inspect { display: grid; grid-template-columns: auto minmax(80px, 1fr) auto; align-items: center; gap: 14px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 14px; }
.inspect label { color: var(--soft); font-size: 13px; }
.inspect input { width: 100%; height: 26px; margin: 0; accent-color: var(--gold); cursor: pointer; }
.inspect input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.reading { display: grid; grid-template-columns: 96px 84px; gap: 12px; align-items: baseline; font-variant-numeric: tabular-nums; }
.reading strong { text-align: right; font: 700 21px/1 var(--display); color: var(--gold); }
.hint { margin: 4px 0 0; color: var(--soft); font-size: 12px; }
.context { margin: 12px 0 0; color: var(--soft); font-size: 14px; line-height: 1.4; }
.context strong { color: var(--ink); font-weight: 600; }
.poster .note { display: block; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); color: var(--soft); font-size: 12.5px; line-height: 1.4; }
.poster .note a { color: inherit; text-underline-offset: 2px; }
.poster .note b { color: var(--ink); font-weight: 600; }
.below { max-width: 880px; margin: 15px auto 0; font-size: 13px; color: var(--soft); }
.below a { color: inherit; }
@media (max-width: 640px) {
 body { padding: 14px 10px 24px; }
 .poster { padding: 23px 16px 20px; }
 .poster figcaption { gap: 13px; margin-bottom: 18px; }
 .poster .kicker { font-size: 11px; letter-spacing: .07em; }
 .game { font-size: 19px; }
 .poster .headline { font-size: clamp(29px, 7.6vw, 43px); max-width: 22ch; }
 .poster .dek { font-size: 15px; }
 .chart-unit { font-size: 13px; max-width: 29ch; }
 .inspect { grid-template-columns: minmax(0, 1fr); gap: 4px; margin-top: 14px; }
 .reading { grid-template-columns: 1fr auto; grid-row: 1; }
 .reading strong { font-size: 20px; }
 .outcomes { grid-template-columns: minmax(0, 1fr); gap: 17px; margin-top: 18px; padding: 17px 0; }
 .outcomes section { display: grid; grid-template-columns: 84px minmax(0, 1fr); column-gap: 12px; align-items: start; }
 .outcomes section + section { border-top: 1px solid var(--rule); padding-top: 14px; }
 .outcomes h2 { grid-column: 2; margin-bottom: 4px; font-size: 13.5px; }
 .outcomes p, .outcomes small { grid-column: 2; }
 .outcomes .number { grid-column: 1; grid-row: 1 / span 3; align-self: center; margin: 0; font-size: 32px; }
 .outcomes .number.wait { font-size: 22px; }
 .inspect label { display: none; }
 .hint { font-size: 12px; }
 .context { font-size: 14px; }
 .poster .note { font-size: 12px; }
}
</style>
</head>
<body>
<main id="chart"></main>
<p class="below">Sources and calculations: <a href="data.json">data.json</a> · <a href="daily-peaks.csv">daily peaks</a> · <a href="analyze.mjs">analysis script</a>. Artwork: Bungie, via <a href="https://wallpaperswide.com/destiny___traveler_white-wallpapers.html">WallpapersWide</a>.</p>
<script type="module">
import { Chart, Plot, Scale, Line, Dot, Tick, Label, Place, Poster, slat, html, render, createSignal } from "@bezda/rhp/standalone";

const DATA = __DATA__;
const ROWS = DATA.rows;
const day = 86400000;
const origin = Date.parse(ROWS[0].date);
const x = date => (Date.parse(date) - origin) / day;
const may = DATA.comparisons.may, september = DATA.comparisons.september;
const lead = x(DATA.maximum.date);
const count = new Intl.NumberFormat("en-US");
const dateLabel = value => new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }).format(new Date(value));
// Give the raised annotation its own headroom while preserving the data scale and baseline on the page.
const scaleTop = 185000;
const plotHeight = 410 * scaleTop / 180000;
const THEME = { font: "var(--text)", ink: "var(--ink)", muted: "var(--soft)", grid: "var(--rule)", surface: "var(--paper)", series: ["var(--gold)", "var(--before)"] };
const notes = {
 may: { noteDay: 20, noteAt: 105000, title: "Final update announced", detail: "Updates end; the game stays online." },
 release: { noteDay: 47, noteAt: 184500, title: "Final content update released", detail: "Monument of Triumph. Peak 167,867 the next day." },
 september: { noteDay: 134, noteAt: 65000, bendAt: 45000, title: "Vaulted content promised", detail: "Restoration work announced." },
 october: { noteDay: 158, noteAt: 120000, bendAt: 85000, title: "Hiring reports", detail: "Linked job now says Marathon. Too early to assess." },
};
const annotations = DATA.events.map(event => ({ ...event, day: x(event.date), peak: ROWS[x(event.date)].peak, ...notes[event.id] }));

const Curve = slat({ room: {}, css: `.curve { stroke-width: 5px; }` }, d => html`<${Line} points=${() => d.points} color="series-2" class="curve" />`);
const Dates = slat({ room: { after: 30 }, css: `
 .mark { top: 100%; height: 5px; translate: -50% 0; background: var(--rhp-muted); }
 .date { top: calc(100% + 9px); translate: -50% 0; --rhp-label-gap: 0px; font-size: 13px; color: var(--rhp-muted); }
 .first .date { translate: 0 0; }
 .last .date { translate: -100% 0; }
 @container (max-width: 700px) { .minor .date, .minor .mark { display: none; } }
 @container (max-width: 500px) { .date { font-size: 12px; } }
` }, d => html`<div class=${() => d.first ? "first" : d.last ? "last" : [31, 92, 153].includes(d.at) ? "minor" : ""}><${Tick} at=${() => d.at} class="mark" /><${Label} at=${() => d.at} class="date">${() => dateLabel(origin + d.at * day)}<//></div>`);
const Event = slat({ room: { before: 16, end: 12 }, css: `
 .leader { stroke-width: 1.5px; stroke-dasharray: 4 3; stroke-linecap: round; }
 .straight-leader { top: var(--stem-top); height: var(--stem-height); width: 1.5px; background: transparent; border-left: 1.5px dashed var(--rhp-series-1); translate: -50% 0; }
 .event-point { background: var(--rhp-surface); border: 3px solid var(--rhp-series-1); }
 .callout { width: 168px; translate: -100% -100%; padding-bottom: 2px; color: var(--rhp-ink); font-size: 14.5px; line-height: 1.3; }
 .callout small { display: block; margin-bottom: 4px; color: var(--rhp-muted); font-size: 12.5px; }
 .callout b { display: block; margin-bottom: 3px; font-size: 15px; font-weight: 600; }
 .release .callout { width: 200px; translate: 0 0; }
 .may .callout { width: 154px; translate: -50% -100%; }
 .september .callout, .october .callout { text-align: right; }
 .october .callout { width: 190px; }
 @container (max-width: 500px) {
  .callout { width: 76px; font-size: 13px; line-height: 1.25; }
  .callout b { font-size: 13px; }
  .callout small { font-size: 11.5px; }
  .callout span { display: none; }
  .release .callout span { display: block; }
  .release .callout { width: 148px; }
  .may .callout { width: 76px; translate: -80% -100%; }
  .september .callout { width: 96px; }
  .october .callout { width: 96px; }
 }
` }, d => html`<div class=${() => d.id}>
 ${() => d.id === "may" ? html`<${Tick} at=${() => d.day} class="straight-leader" style=${{ "--stem-top": `${(1 - d.noteAt / scaleTop) * 100}%`, "--stem-height": `${(d.noteAt - d.peak) / scaleTop * 100}%` }} />` : d.id === "release" ? html`<${Line} points=${() => [[d.day, d.peak], [d.day + (d.noteDay - d.day) * .86, d.peak + (d.noteAt - d.peak) * .86]]} color="series-1" class="leader" />` : html`<${Line} points=${() => [[d.day, d.peak], [d.day, d.bendAt], [d.noteDay, d.noteAt]]} color="series-1" class="leader" />`}
 <${Dot} at=${() => d.day} cross=${() => d.peak} size="18px" class="event-point" />
 <${Place} at=${() => d.noteDay} cross=${() => d.noteAt}><div class="callout"><small>${() => dateLabel(d.date)} 2026</small><b>${() => d.title}</b><span>${() => d.detail}</span></div><//>
 </div>`);
const Reading = slat({ room: {}, css: `.picked { background: var(--rhp-surface); border: 4px solid var(--rhp-series-1); transition: none; }` }, d => html`<${Dot} at=${() => d.day} cross=${() => d.peak} size="24px" class="picked" />`);
const Hit = slat({ room: {}, css: `
 .hit { cursor: crosshair; touch-action: pan-y; }
 .hit:focus-visible { outline: 1px solid var(--rhp-muted); outline-offset: -1px; }
` }, d => html`<div class="hit" data-hit="" data-i=${() => d.picked} tabindex="0" role="slider" aria-label="Inspect the daily Steam player timeline" aria-valuemin="0" aria-valuemax=${ROWS.length - 1} aria-valuenow=${() => d.picked} aria-valuetext=${() => `${dateLabel(ROWS[d.picked].date)} 2026: ${count.format(ROWS[d.picked].peak)} recorded peak concurrent Steam players`}></div>`);

function PlayerTimeline() {
 const [picked, setPicked] = createSignal(lead);
 const [hover, setHover] = createSignal(null);
 const index = () => hover() ?? picked();
 const selected = () => ROWS[index()];
 const rowOf = element => { const root = element?.closest?.("[data-i]"); if (root) return +root.dataset.i; if (element?.matches?.("#inspect-day")) return +element.value; return null; };
 const eventIndex = event => {
  const hit = event.target.closest?.("[data-hit]");
  if (hit && Number.isFinite(event.clientX)) {
   const rect = hit.getBoundingClientRect();
   return Math.max(0, Math.min(ROWS.length - 1, Math.round((event.clientX - rect.left) / rect.width * ROWS.length - .5)));
  }
  return rowOf(event.target);
 };
 const commit = value => { setPicked(value); setHover(null); };
 const pick = event => { const i = eventIndex(event); if (i != null) commit(i); };
 const key = event => {
  if (!event.target.matches?.("[data-hit]")) return;
  const offsets = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 };
  if (!(event.key in offsets) && !["Home", "End"].includes(event.key)) return;
  event.preventDefault();
  commit(event.key === "Home" ? 0 : event.key === "End" ? ROWS.length - 1 : Math.max(0, Math.min(ROWS.length - 1, picked() + offsets[event.key])));
 };
 const leave = event => { if (event.pointerType !== "touch") setHover(null); };
 const move = event => { if (event.pointerType !== "touch") setHover(event.target.closest?.("[data-hit]") ? eventIndex(event) : null); };
 return html`
 <${Poster} kicker=${html`<span class="game">Destiny 2</span><span>Steam activity · May to October 2026</span>`}
  title=${html`<span>Steam peaks rose after both the <em>farewell</em> and the <em>revival</em> news.</span>`}
  dek="Weekend peaks rose 35% after May’s final-update announcement and 99% after September’s unvaulting news. October’s hiring reports are still too recent to assess."
  note=${html`<span><b>Data: </b><a href=${DATA.sourcePage}>Steam Charts</a>, sampled daily Steam peaks, 1 May to 16 October 2026 UTC. Current feed plus <a href=${DATA.snapshots[0].url}>June</a> and <a href=${DATA.snapshots[1].url}>August</a> archives; all 169 days; 46 overlapping dates agree. Captured 17 October UTC.<br/><b>Events: </b><a href=${DATA.events[0].url}>21 May</a>; <a href=${DATA.events[1].url}>9 June release</a>; <a href=${DATA.events[2].url}>21 September public statement</a> (website header: 17 September); <a href=${DATA.events[3].reportUrl}>16 October report</a> / <a href=${DATA.events[3].url}>current job</a>. Unvaulting was promised restoration work, not already-returned content.</span>`}
  onPointerMove=${move} onPointerLeave=${leave} onClick=${pick} onFocusIn=${event => { if (rowOf(event.target) != null) setHover(null); }} onKeyDown=${key}
  onFocusOut=${event => { if (!event.currentTarget.contains(event.relatedTarget)) setHover(null); }}>
  <div class="poster-art" aria-hidden="true"><img src="__ARTWORK__" width="1920" height="1080" alt="" /></div>
  <p class="chart-unit">Daily recorded peak · simultaneous Steam players</p>
  <div class="timeline" style=${{ "margin-top": `${410 - plotHeight}px` }}>
   <${Chart} scale=${[-0.5, ROWS.length - 0.5]} cross=${[0, scaleTop]} crossTicks=${[0, 50000, 100000, 150000]} crossFormat=${value => html`<span class="axis-value">${value === 0 ? "0" : `${value / 1000}k`}</span>`} height=${plotHeight} theme=${THEME} label="Destiny 2 daily recorded peak concurrent Steam players, May 1 through October 16, 2026, with event annotations for final-update news, its release, unvaulting news and hiring reports">
    <${Scale} ticks=${[0, 31, 61, 92, 123, 153, 168]}>${Dates}<//>
    <${Plot} overlap=${true} points=${[ROWS.map(row => [x(row.date), row.peak])]} style=${{ "pointer-events": "none" }}>${Curve}<//>
    <${Plot} overlap=${true} rows=${annotations} style=${{ "pointer-events": "none" }}>${Event}<//>
    <${Plot} overlap=${true} slats=${1} day=${() => x(selected().date)} peak=${() => selected().peak} style=${{ "pointer-events": "none" }}>${Reading}<//>
    <${Plot} overlap=${true} slats=${1} picked=${picked}>${Hit}<//>
   <//>
  </div>
  <div class="inspect"><label for="inspect-day">Inspect a day</label><input id="inspect-day" type="range" min="0" max=${ROWS.length - 1} step="1" value=${index} aria-label="Inspect a day's recorded peak concurrent Steam players" aria-valuetext=${() => `${dateLabel(selected().date)}: ${count.format(selected().peak)} players`} onInput=${event => commit(+event.target.value)} /><div class="reading" aria-live="polite"><span>${() => dateLabel(selected().date)} 2026</span><strong>${() => count.format(selected().peak)}</strong></div></div>
  <p class="hint">Hover to preview; use the slider, click or tap to keep a day.</p>
  <div class="outcomes">
   <section><h2>21 May · Final-update news</h2><b class="number">+${Math.round(may.change * 100)}%</b><p>Weekend peak: <b>${count.format(may.before.peak)} → ${count.format(may.after.peak)}</b></p><small>16 to 17 May vs. 23 to 24 May</small></section>
   <section><h2>21 September · Unvaulting news</h2><b class="number">+${Math.round(september.change * 100)}%</b><p>Weekend peak: <b>${count.format(september.before.peak)} → ${count.format(september.after.peak)}</b></p><small>19 to 20 Sept vs. 26 to 27 Sept</small></section>
   <section><h2>16 October · Hiring reports</h2><b class="number wait">Too early</b><p>No complete post-report weekend is in the data. The linked job currently names <b>Marathon</b>.</p></section>
  </div>
  <p class="context"><strong>Observed changes, not isolated news effects.</strong> May’s announcement previewed June’s update. A discounted bundle of expansions launched alongside it; prices and promotions also affected activity. Steam concurrency does not measure purchases or unique players.</p>
 <//>`;
}
render(() => html`<${PlayerTimeline} />`, document.getElementById("chart"));
</script>
__DOWNLOAD__
</body>
</html>
