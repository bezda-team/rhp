# npm test on every push to master and every pull request, in Chromium, WebKit and Firefox at once (three jobs side by
# side, each about 5 minutes). macOS, so WebKit is Safari's engine and the fonts are the ones the checks were measured
# with. A newer push cancels the run of an older one. The chart checker in mcp/ is tested in a job of its own.
name: test

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    name: test (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }}
      - run: npm test
        env:
          BROWSER: ${{ matrix.browser }}
          RHP_TEST_ARTIFACTS: ${{ runner.temp }}/rhp-test-artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics-${{ matrix.browser }}
          path: ${{ runner.temp }}/rhp-test-artifacts
          if-no-files-found: ignore

  # The checker's and the MCP server's tests (npm test in mcp/) on rhp built from this commit: the broken charts, the
  # skill's recipes, the guard, the skill's example and the server's tools. The site's gallery needs the documentation
  # checkout, so that part is skipped here.
  checker:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: mcp
      - run: node bin/rhp-mcp.js install-browser
        working-directory: mcp
      - run: npm test
        working-directory: mcp
        env:
          RHP_TEST_ARTIFACTS: ${{ runner.temp }}/rhp-checker-artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: checker-diagnostics
          path: ${{ runner.temp }}/rhp-checker-artifacts
          if-no-files-found: ignore
