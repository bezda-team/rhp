<!doctype html>
<html><head><meta charset="utf-8"><title>attr cache</title>
<style>
.d { position: absolute; box-sizing: border-box; margin: 0; padding: 0; border: 0 solid transparent; border-radius: 50%;
  box-shadow: none; outline: revert; background: #2a78d6; overflow: visible; float: none; min-width: 0; min-height: 0;
  max-width: none; max-height: none; vertical-align: baseline; transition: none; animation: none; text-decoration: none;
  font: inherit; letter-spacing: inherit; word-spacing: inherit; text-transform: inherit; text-indent: inherit;
  text-align: inherit; color: inherit; white-space: inherit; width: 4px; height: 4px; }
.v { left: calc(var(--x) * 1%); bottom: calc(var(--y) * 1%); }
.a { left: calc(attr(data-x type(<number>), 0) * 1%); bottom: calc(attr(data-y type(<number>), 0) * 1%); }
</style></head>
<body style="margin:0"><div id="stage" style="position:relative;width:600px;height:400px"></div>
<script>
// N dots at unique places: by inline variables (as rhp does) or by typed attr() (no per-dot style at all)
const N = 5000;
const at = (i) => [((i * 0.6180339887498949) % 1) * 100, ((i * 0.7548776662466927) % 1) * 100];
const WAYS = {
  vars: (el, i) => { const [x, y] = at(i); el.classList.add("v"); el.style.setProperty("--x", x); el.style.setProperty("--y", y); },
  attr: (el, i) => { const [x, y] = at(i); el.classList.add("a"); el.setAttribute("data-x", x); el.setAttribute("data-y", y); },
};
window.run = (way) => new Promise((resolve) => requestAnimationFrame(() => {
  const t0 = performance.now();
  const stage = document.getElementById("stage");
  const frag = document.createDocumentFragment();
  for (let i = 0; i < N; i++) {
    const el = document.createElement("div");
    el.className = "d";
    WAYS[way](el, i);
    frag.append(el);
  }
  stage.append(frag);
  const c = new MessageChannel();
  c.port1.onmessage = () => resolve(performance.now() - t0);
  c.port2.postMessage(0);
}));
window.ways = Object.keys(WAYS);
</script></body></html>
