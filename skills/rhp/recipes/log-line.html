<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitcoin's decade, rung by rung</title>
<meta name="description" content="Log line: one series over ten years on a log scale drawn as a ladder of doublings, every fall below the last record shaded, the falls of more than half measured, events marked at the foot, and a crosshair readout by pointer, tap, sideways drag or arrow keys. Use it for a price or any quantity that grows by multiples.">
<!--
  A recipe gives technique, not a design.
  Take: a daily Line on a log2 cross scale with a rung at each doubling, the shape between the record line and the price as one filled Line (out along the record line, back along the price, with `fill` and `base`), crashes found from the data and measured with a plumb line, events marked with a lead up to the line, a crosshair that follows pointer, tap or drag, and invisible month columns (quarters on a phone) for the arrow keys.
  Leave: the design. This poster was made for its own subject (Bitcoin's decade on a warm peach ground, an italic display face, the multiple of the first price as the big number, teal for the falls and orange split coins for the halvings).
  Its look, the place of its parts and the way its marks are drawn say that subject: design yours from your own (design.md, section 2).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,700;1,700&family=Ubuntu+Sans:wght@400;600&display=swap">
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  /* Bitcoin's own orange, pale, as the paper; a deep teal from the other side of the wheel for the falls */
  :root {
    --page: #d6bd9f; --paper: #fde3c4; --ink: #2a1a0a; --soft: #705c47; --rule: #dbc3a6;
    --accent: #0b5961; --bite: #9ccdc7; --quiet: #89745e; --coin: #f7931a;
    --display: Ubuntu, "Trebuchet MS", sans-serif;
    --text: "Ubuntu Sans", Ubuntu, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px 16px; background: var(--page, #d6bd9f); }

  /* The poster: a header of two columns over a wide chart, the readout in the chart's empty upper left */
  .poster { max-width: 1040px; margin: 0 auto; padding: 44px 48px 26px; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--text);
    display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 12px; grid-template-areas: "kicker" "headline" "dek" "stage" "note"; }
  .poster figcaption { display: contents; }
  .poster .kicker { grid-area: kicker; font: 600 13px/1.3 var(--text); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  .poster .headline { grid-area: headline; max-width: 15em; font: italic 700 clamp(31px, 4.8vw, 50px)/1.02 var(--display); letter-spacing: -.015em; text-wrap: balance; }
  .poster .dek { grid-area: dek; max-width: 46ch; font-size: 17px; line-height: 1.5; color: var(--soft); }
  .poster .headline .nobreak { white-space: nowrap; }
  .poster .dek .drop { padding: 0 .3em; background: var(--bite); color: var(--ink); }
  .poster .stage { grid-area: stage; position: relative; min-width: 0; margin-top: 8px; }
  .poster .note { grid-area: note; display: block; margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 12px; line-height: 1.5; color: var(--soft); }
  @media (min-width: 900px) {
    .poster { grid-template-columns: minmax(0, 8fr) minmax(0, 5fr); column-gap: 48px;
      grid-template-areas: "kicker kicker" "headline dek" "stage stage" "note note"; }
    .poster .dek { align-self: end; }
  }

  /* The readout: the day picked (the latest close at rest), its multiple of the 2016 price as the big number */
  .plate { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 12px; height: 56px; margin: 0 0 8px;
    font-variant-numeric: tabular-nums; }
  .plate .times { grid-row: 1 / 3; font: italic 700 44px/1 var(--display); letter-spacing: -.02em; }
  .plate .times small { font-size: .5em; }
  .plate .when { align-self: end; font-size: 13px; font-weight: 600; line-height: 1.35; white-space: nowrap; }
  .plate .what { align-self: start; font-size: 13px; line-height: 1.35; color: var(--soft); white-space: nowrap; }
  .plate .what b { font-weight: 600; color: var(--accent); }
  @media (max-width: 360px) {
    /* the narrowest phones: the price and its fall below the record may take two lines */
    .plate { height: 74px; }
    .plate .what { white-space: normal; }
  }
  @media (min-width: 900px) {
    /* over the chart's empty upper left, letting the pointer through to the chart under it */
    .plate { position: absolute; z-index: 2; top: 0; left: 0; display: block; width: 300px; height: 142px; margin: 0; padding: 14px 20px 0 0; background: var(--paper); pointer-events: none; }
    .plate .times { display: block; margin: 4px 0 6px; font-size: 64px; }
    .plate .when, .plate .what { font-size: 14px; }
  }

  /* The chart's box: a finger dragging sideways moves through the days, up and down still scrolls */
  .plot { touch-action: pan-y; cursor: crosshair; }
  .plot:has(:focus-visible) { outline: 2px solid var(--ink); outline-offset: 6px; }
  .hint { margin: 6px 0 0; font-size: 13px; color: var(--soft); }
  @media (max-width: 640px) {
    body { padding: 16px 16px 32px; }
    .poster { padding: 26px 18px 18px; row-gap: 10px; }
    .poster .dek { font-size: 15px; }
  }
</style>
</head>

const SAY = `.say { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }`;

// Slat types
// The years under the plot: a short mark and the year at each first of January (every other year on a phone)
const Year = slat({
  room: { after: 28 },
  css: `
    .mark { top: 100%; height: 6px; translate: -50% 0; --rhp-tick-width: 1px; background: var(--rhp-muted); }
    .year { top: calc(100% + 10px); bottom: auto; translate: -50% 0; --rhp-label-gap: 0px; font-size: 12px; color: var(--rhp-muted); }
    @container (max-width: 520px) { .odd .year { display: none; } }
  `,
}, (t) => html`
  <div class=${() => (dateOf(t.at).getUTCFullYear() % 2 ? "odd" : "")}>
    <${Tick} at=${() => t.at} class="mark" />
    <${Label} at=${() => t.at} class="year">${() => dateOf(t.at).getUTCFullYear()}<//>
  </div>`);

// Where a value of the cross scale sits, from the plot's top (0) to its bottom (1): for marks the slat's CSS places
const fromTop = (v) => (Y[1] - v) / (Y[1] - Y[0]);
// A vertical mark from the value hi down to lo, as the style of a Tick that the slat's CSS sets from --top and --length
const span = (hi, lo) => `--top: ${fromTop(hi)}; --length: ${(hi - lo) / (Y[1] - Y[0])}`;

// A rung of the ladder: a hairline at each doubling of the first price (a Bar from the first day to the last, set at
// its height by the slat's CSS), with its multiple and its price at the end
const Rung = slat({
  room: { before: 14, end: 54 },
  css: `
    .rung { top: calc(var(--y) * 100%); translate: 0 -50%; --rhp-radius: 0px; }
    .first .rung { background: repeating-linear-gradient(to right, var(--rhp-muted) 0 2px, transparent 2px 6px); }
    .times { --rhp-label-gap: 8px; display: grid; line-height: 1.05; }
    .times b { font: italic 700 15px/1.05 Ubuntu, "Trebuchet MS", sans-serif; }
    .times small { font-size: 11px; color: var(--rhp-muted); }
  `,
}, (r) => html`
  <div class=${() => (r.k === 0 ? "first" : "")}>
    <${Bar} from=${X[0]} to=${X[1]} thick="1px" color="grid" class="rung" style=${() => `--y: ${fromTop(r.k)}`} />
    <${Label} at=${X[1]} cross=${() => r.k} class="times"><b>×${() => 2 ** r.k}</b><small>${() => short(P0 * 2 ** r.k)}</small><//>
  </div>`);

// Every fall below the record, as one shape between the record line and the price
const Falls = slat({
  room: {},
  css: `
    .falls { stroke: none; }
    .falls .rhp-under { fill: var(--rhp-series-2); }
  `,
}, (d) => html`<div><${Line} points=${() => d.points} fill=${true} base=${Y[0]} class="falls" /></div>`);

// A halving: a coin split in two near the foot, and a dotted lead up to the price that day
const Halving = slat({
  room: {},
  css: `
    .lead { top: calc(var(--top) * 100%); height: calc(var(--length) * 100%); translate: -50% 0; --rhp-tick-width: 2px;
      background: radial-gradient(circle, var(--rhp-series-3) 1px, transparent 1.4px) 50% 0 / 2px 6px repeat-y; }
    .coin { position: absolute; translate: -50% -50%; display: block; width: 22px; height: 22px; }
    .coin path { fill: var(--rhp-series-4); stroke: var(--rhp-ink); stroke-width: 1.5px; }
    .tag { position: absolute; left: 16px; translate: 0 -50%; display: grid; font-size: 12px; line-height: 1.25; white-space: nowrap; }
    .tag b { font-weight: 600; }
    .tag small { font-size: 11px; color: var(--rhp-muted); }
    @container (max-width: 520px) {
      .tag small { display: none; }
      /* the word goes left of its coin, clear of the rung labels at the right edge */
      .tag { left: auto; right: 16px; }
    }
    ${SAY}
  `,
}, (h) => html`
  <div>
    <${Tick} at=${() => h.at} class="lead" style=${() => span(rung(CLOSE[h.at]) - 0.2, 1.05)} />
    <${Place} at=${() => h.at} cross=${0.62} aria-hidden="true">
      <svg class="coin" viewBox="0 0 22 22"><path d="M10 2.5 A8.5 8.5 0 0 0 10 19.5 Z" /><path d="M12 2.5 A8.5 8.5 0 0 1 12 19.5 Z" /></svg>
      <span class="tag"><b>Halving</b><small>${() => month.format(dateOf(h.at))}</small></span>
    <//>
    <span class="say">${() => `Halving on ${day.format(dateOf(h.at))}, at block ${h.block}: the reward for a block was cut from ${h.reward} bitcoins.`}</span>
  </div>`);

// The record line and the price line
const Trace = slat({
  room: {},
  css: `
    .high { stroke-width: 1.5px; }
    .price { stroke-width: 1.75px; }
  `,
}, (d) => html`<div><${Line} points=${() => d.points} color=${() => d.color} class=${() => d.kind} /></div>`);

// A crash of more than half: a dashed plumb line from the record down to the low, and the fall written under the low
const Crash = slat({
  room: {},
  css: `
    .plumb { top: calc(var(--top) * 100%); height: calc(var(--length) * 100%); translate: -50% 0; --rhp-tick-width: 1.5px;
      background: repeating-linear-gradient(var(--rhp-series-1) 0 4px, transparent 4px 7px); }
    .tag { position: absolute; top: 8px; left: 0; translate: -35% 0; display: grid; justify-items: center; white-space: nowrap; } /* a little right of the low, clear of the climb before it */
    .back .tag { left: auto; right: 2px; translate: none; justify-items: end; }
    .tag b { font: italic 700 18px/1 Ubuntu, "Trebuchet MS", sans-serif; color: var(--rhp-series-1); }
    .tag small { margin-top: 2px; font-size: 11px; line-height: 1.2; color: var(--rhp-muted); }
    @container (max-width: 520px) {
      .tag { top: 9px; }
      .tag b { font-size: 12.5px; }
      .tag small { display: none; }
    }
    ${SAY}
  `,
}, (c) => html`
  <div class=${() => (c.low > LAST * 0.85 ? "back" : "")}>
    <${Tick} at=${() => c.low} class="plumb" style=${() => span(rung(CLOSE[c.peak]), rung(CLOSE[c.low]))} />
    <${Dot} at=${() => c.low} cross=${() => rung(CLOSE[c.low])} size="6px" color="series-1" />
    <${Place} at=${() => c.low} cross=${() => rung(CLOSE[c.low])} aria-hidden="true">
      <span class="tag"><b>${() => minus(c.depth)}</b><small>from ${() => month.format(dateOf(c.peak))}</small></span>
    <//>
    <span class="say">${() => `A fall of ${percent.format(c.depth)}: from a record close of ${dollars.format(CLOSE[c.peak])} on ${day.format(dateOf(c.peak))} to ${dollars.format(CLOSE[c.low])} on ${day.format(dateOf(c.low))}.`}</span>
  </div>`);

// The day picked: a hairline and a dot on the price
const Reading = slat({
  room: {},
  css: `
    .hair { --rhp-tick-width: 1px; background: var(--rhp-muted); }
    .rest .hair { opacity: 0; }
    .dot { box-shadow: 0 0 0 2.5px var(--rhp-surface); }
  `,
}, (d) => html`
  <div class=${() => (d.rest ? "rest" : "")}>
    <${Tick} at=${() => d.at} thick=${1} class="hair" />
    <${Dot} at=${() => d.at} cross=${() => d.lift} size="10px" color="ink" class="dot" />
  </div>`);

// One invisible column per month: what the arrow keys step through, and what a screen reader reads
const Month = slat({
  room: {},
  css: `
    .month { pointer-events: none; outline: none; }
    ${SAY}
  `,
}, (m) => html`<div class="month" data-m=${() => m.index}><span class="say">${() => `${fullMonth.format(dateOf(m.at))}. ${say(m.at)}`}</span></div>`);

// Chart component: the readout and the hairline follow the day under the pointer, a tap, a drag or the arrow keys,
// and show the latest close otherwise
function BitcoinDecade() {
  const wide = matchMedia("(min-width: 640px)");
  const [desktop, setDesktop] = createSignal(wide.matches);
  wide.addEventListener("change", (e) => setDesktop(e.matches));
  const [picked, setPicked] = createSignal(null);
  const at = () => picked() ?? LAST;
  const shown = createMemo(() => {
    const i = at();
    return { date: day.format(dateOf(i)), times: times(CLOSE[i] / P0), price: dollars.format(CLOSE[i]), below: 1 - CLOSE[i] / HIGH[i] };
  });
  let plot; // the price Plot's element: its box is the plot area, day 0 at its left and the last day at its right
  // A pointer, a tap or a drag picks the day under it; outside the plot the pick stays
  const point = (e) => {
    const r = plot.getBoundingClientRect();
    if (e.clientX < r.left - 8 || e.clientX > r.right + 8) return;
    setPicked(Math.max(0, Math.min(LAST, Math.round(((e.clientX - r.left) / r.width) * LAST))));
  };
  // The keyboard picks the last day of the month (or quarter, on a phone) it focuses
  const steps = () => (desktop() ? MONTH_ENDS : QUARTER_ENDS);
  const monthOf = (el) => {
    const root = el?.closest?.("[data-m]");
    return root ? steps()[+root.dataset.m] : null;
  };
  const focus = (e) => {
    const i = monthOf(e.target);
    if (i != null) setPicked(i);
  };
  let start = [0, 0]; // where the last finger went down
  // A finger that moves more sideways than up or down scrubs; one that moves up or down scrolls the page
  const sideways = (e) => Math.abs(e.clientX - start[0]) > Math.abs(e.clientY - start[1]);
  // Leaving the chart: back to the month that has focus (the keyboard's pick), or the latest close
  const leave = (e) => {
    if (e.pointerType === "touch") return; // a finger sends pointerleave as it lifts after a tap
    setPicked(e.currentTarget.contains(document.activeElement) ? monthOf(document.activeElement) : null);
  };
  return html`
    <${Poster}
      kicker=${`Bitcoin, ${month.format(dateOf(0))} to ${month.format(dateOf(LAST))}`}
      title=${html`<span>Bitcoin rose <span class="nobreak">${fold}-fold</span> in ${TEN} years, losing over half its value ${COUNT[CRASHES.length] ?? `${CRASHES.length} times`}</span>`}
      dek=${html`<span>Its price at the close of every day, in US dollars, on a ladder where each rung up is a doubling of the ${month.format(dateOf(0))} price and each rung down a halving. <span class="drop">Shaded</span> is how far it stood below its last record.</span>`}
      note=${NOTE}>
      <div class="stage">
        <p class="plate" aria-hidden="true">
          <span class="when">${() => shown().date}</span>
          <span class="times"><small>×</small>${() => shown().times}</span>
          <span class="what">${() => (shown().below === 0 ? html`<span>${shown().price}, <b>a record close</b></span>` : html`<span>${shown().price}, <b>${percent.format(shown().below)} below its record</b></span>`)}</span>
        </p>
        <div class="plot" onPointerDown=${(e) => (start = [e.clientX, e.clientY])}
          onPointerMove=${(e) => (e.pointerType !== "touch" || sideways(e)) && point(e)} onClick=${point} onFocusIn=${focus}
          onPointerLeave=${leave} onFocusOut=${(e) => !e.currentTarget.contains(e.relatedTarget) && setPicked(null)}>
          <${Chart} scale=${X} cross=${Y} crossTicks=${false} height=${() => (desktop() ? 440 : 340)} theme=${THEME}
            label=${`Bitcoin's daily closing price in US dollars, ${day.format(dateOf(0))} to ${day.format(dateOf(LAST))}, on a scale of doublings`}>
            <${Scale} ticks=${YEARS}>${Year}<//>
            <${Plot} overlap=${true} static=${true} slats=${1} points=${[FALLS]}>${Falls}<//>
            <${Plot} overlap=${true} static=${true} k=${RUNGS}>${Rung}<//>
            <${Plot} overlap=${true} static=${true} rows=${HALVING_DAYS}>${Halving}<//>
            <${Plot} overlap=${true} static=${true} points=${[HIGH_LINE, PRICE_LINE]} color=${["series-1", "ink"]} kind=${["high", "price"]}
              ref=${(el) => (plot = el)}>${Trace}<//>
            <${Plot} overlap=${true} static=${true} rows=${CRASHES}>${Crash}<//>
            <${Plot} overlap=${true} slats=${1} at=${at} lift=${() => rung(CLOSE[at()])} rest=${() => picked() == null} animate=${["at", "lift"]}
              style=${{ "pointer-events": "none" }}>${Reading}<//>
            <${Plot} orientation="vertical" keyboard=${true} key="at" at=${steps}>${Month}<//>
          <//>
        </div>
        <p class="hint">Point at the chart, tap it or drag along it; on a keyboard, Tab into it and use the arrow keys.</p>
      </div>
    <//>`;
}

render(() => html`<${BitcoinDecade} />`, document.getElementById("chart"));
</script>
</body>
</html>
