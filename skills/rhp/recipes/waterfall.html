<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profit bridge</title>
<meta name="description" content="Waterfall chart from a starting value through gains and losses to a final total, each step linked to the next, with a switch between periods. Use it to show how one amount becomes another, step by step.">
<!--
  A recipe gives technique, not a design.
  Take: Bars between running totals with a link from each step to the next, and a switch between periods.
  Leave: the design. This poster was made for its own subject (a profit bridge as a page of an accountant's ledger, one ruled line per step and the bottom line double ruled).
  Its look, the place of its parts and the way its marks are drawn say that subject: design yours from your own (design.md, section 2).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400..700&family=DM+Serif+Display&display=swap">
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px 16px; background: #d6d3cb; font-family: "DM Sans", "Segoe UI", system-ui, sans-serif; }
  /* The poster: an accountant's ledger, serif headline, figures in mono, one ruled line per step, the bottom line double-ruled */
  .poster { max-width: 900px; margin: 0 auto; padding: 46px 52px 30px; color: #2a2f38; border-radius: 3px; background: #f6f3ea;
    box-shadow: 0 26px 50px -30px rgb(62 58 50 / .6); }
  .ledger { background: repeating-linear-gradient(transparent 0 49px, rgb(42 47 56 / .12) 49px 50px) 0 2px; }
  .poster figcaption { display: grid; gap: 12px; margin-bottom: 24px; }
  .poster .kicker { font: 500 12px/1.3 "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: #646b78; }
  .poster .headline { max-width: 15em; font: 400 52px/1.02 "DM Serif Display", Georgia, serif; letter-spacing: -.01em; text-wrap: balance; }
  .poster .dek { max-width: 56ch; font-size: 16px; line-height: 1.55; color: #4f5562; }
  .poster .note { display: block; margin-top: 22px; font-size: 12px; line-height: 1.5; color: #646b78; }
  /* The quarter switch, as ledger tabs, and the one-line readout of the quarter shown */
  .quarters { display: inline-flex; border: 1.5px solid #2a2f38; border-radius: 6px; overflow: hidden; }
  .quarters button { padding: 8px 16px; border: 0; border-left: 1.5px solid #2a2f38; background: #f6f3ea; color: #2a2f38; font: 500 14px/1 "DM Mono", ui-monospace, Menlo, monospace; cursor: pointer; }
  .quarters button:first-child { border-left: 0; }
  .quarters button[aria-pressed="true"] { background: #2a2f38; color: #f6f3ea; }
  .quarters button:focus-visible { outline: 3px solid #2457c5; outline-offset: -3px; }
  .readout { min-height: 1lh; margin: 14px 0 18px; font-size: 15px; line-height: 1.45; color: #4f5562; }
  .readout b { font: 500 17px/1 "DM Mono", ui-monospace, Menlo, monospace; color: #1f4fae; }
  @media (max-width: 600px) {
    body { padding: 16px 16px 32px; }
    .poster { padding: 26px 16px 18px; }
    .poster .headline { font-size: 34px; }
    .poster .dek { font-size: 15px; }
    .readout { min-height: 2lh; }
  }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Tick, Label, Poster, Show, slat, nice, running, html, render, createSignal, createMemo } from "@bezda/rhp/standalone";

// Data: a company's quarters in millions of dollars, revenue first, then each cost as a negative. Illustrative data; replace with your own.
const ITEMS = ["Revenue", "Cost of sales", "Research", "Sales & marketing", "Admin", "Tax"];
const TOTAL = "Net profit"; // the last step: what is left
const QUARTERS = [
  { name: "Q1", amounts: [120, -52, -22, -26, -9, -3] },
  { name: "Q2", amounts: [128, -54, -23, -24, -9, -4] },
  { name: "Q3", amounts: [135, -56, -24, -21, -10, -5] },
  { name: "Q4", amounts: [151, -61, -25, -22, -10, -7] },
];

const compact = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", notation: "compact", maximumFractionDigits: 0 });
const money = (m) => compact.format(m * 1e6).replace("-", "−"); // -61 -> −$61M, with a real minus sign
const percent = new Intl.NumberFormat("en-US", { style: "percent" });
const scale = nice(0, Math.max(...QUARTERS.map((q) => q.amounts[0])) * 1.15, 4); // 0 to $200M, room for the labels

// Slat type: a step from the running total before it to the one after, a hairline down to the next step, and its amount
const Step = slat({
  thickness: 50,
  inset: "12px",
  room: { start: "auto", end: 24 }, // the end: half of the last axis number, "$200M"
  css: `
    .item { font-size: 15px; font-weight: 600; --rhp-label-gap: 14px; }
    .bar { --rhp-radius: 2px; }
    .in .bar { background: #5d6676; }
    .out .bar { background: #c9472b; }
    .total .bar { background: #2457c5; }
    .link { background: #8b909a; --rhp-tick-width: 1px; }
    .link:horizontal { top: calc(100% - 12px); height: 24px; translate: -50% 0; }
    .link:vertical { left: calc(100% - 12px); width: 24px; translate: 0 50%; }
    .amount { font: 500 13px/1 "DM Mono", ui-monospace, Menlo, monospace; --rhp-label-gap: 8px; }
    .out .amount { color: #b23a22; }
    .total .amount { color: #1f4fae; font-size: 14px; text-decoration: underline double; text-underline-offset: 5px; }
    @container (max-width: 420px) { .item { max-width: 6.5em; font-size: 13px; line-height: 1.1; white-space: normal; --rhp-label-gap: 8px; } .amount { font-size: 12px; } }
  `,
}, (d) => html`
  <div class=${() => "step " + d.kind}>
    <${Label} edge="start" class="item">${() => d.item}<//>
    <${Bar} from=${() => d.from} to=${() => d.to} class="bar" />
    <${Show} when=${() => d.kind !== "total"}><${Tick} at=${() => d.to} class="link" /><//>
    <${Label} at=${() => Math.max(d.from, d.to)} class="amount">${() => money(d.to - d.from)}<//>
  </div>`);

// Chart component: the quarter picked feeds running(), so every step, the profit and the readout move together
function ProfitBridge() {
  const [q, setQ] = createSignal(QUARTERS.length - 1);
  const quarter = () => QUARTERS[q()];
  const steps = createMemo(() => {
    const r = running(quarter().amounts); // each step from the total before it to the one after
    return { from: [...r.from, 0], to: [...r.to, r.to.at(-1)] }; // and the profit, from 0
  });
  const profit = () => steps().to.at(-1);
  return html`
    <${Poster}
      kicker="Quarterly results · profit bridge"
      title="Profit tripled over the year while revenue grew by a quarter"
      dek="How each quarter's revenue became profit, in millions of dollars. Each cost comes off one step at a time, and what is left at the bottom is the profit."
      note="Illustrative data for a fictional company.">
      <div class="quarters" role="group" aria-label="Quarter">
        ${QUARTERS.map((x, i) => html`<button type="button" aria-pressed=${() => q() === i} onClick=${() => setQ(i)}>${x.name}</button>`)}
      </div>
      <p class="readout" aria-live="polite">
        ${() => quarter().name + ": "}<b>${() => money(profit())}</b>${() => ` net profit on ${money(quarter().amounts[0])} of revenue, a margin of ${percent.format(profit() / quarter().amounts[0])}.`}
      </p>
      <${Chart} class="ledger" scale=${[scale.min, scale.max]} ticks=${scale.ticks} format=${money}
        label=${() => "Profit bridge for " + quarter().name + ", in millions of dollars"}
        theme=${{ font: '"DM Sans", "Segoe UI", system-ui, sans-serif', ink: "#2a2f38", muted: "#646b78", grid: "#dcd8cd" }}>
        <${Plot} item=${[...ITEMS, TOTAL]} from=${() => steps().from} to=${() => steps().to}
          kind=${(d) => (d.index === ITEMS.length ? "total" : d.to >= d.from ? "in" : "out")}>${Step}<//>
      <//>
    <//>`;
}

render(() => html`<${ProfitBridge} />`, document.getElementById("chart"));
</script>
<style id="poster-download-styles">
  .poster-download-tools { display: flex; justify-content: flex-end; align-items: center; margin: 0 auto 12px; max-width: 100%; }
  .poster-actions { position: relative; display: flex; align-items: center; margin-left: auto; }
  .poster-download, .poster-fit-toggle { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 44px; height: 44px; padding: 10px; border: 0; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
  .poster-actions svg { display: block; width: 20px; height: 20px; }
  .poster-actions button:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
  .poster-actions button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .poster-actions button[aria-disabled="true"] { cursor: progress; opacity: .5; }
  .poster-fit-frame, .poster-fit-content { display: contents; }
  .poster-fit-frame { max-height: 95svh; }
  .poster-fit-frame.is-fitted { display: block; margin: 0 auto; overflow: clip; }
  .poster-fit-frame.is-fitted > .poster-fit-content { display: block; transform-origin: top left; }
  .poster-download-error { margin: 8px auto; font: 14px/1.4 system-ui, sans-serif; color: inherit; }
  .poster-download-progress { font: 600 11px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .poster-download-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 20; display: grid; gap: 2px; min-width: 220px; padding: 6px; border: 1px solid color-mix(in srgb, currentColor 24%, transparent); border-radius: 8px; background: var(--poster-tools-ground, Canvas); box-shadow: 0 8px 24px rgb(0 0 0 / .28); }
  .poster-download-menu[hidden] { display: none; }
  .poster-download-menu button { display: grid; gap: 2px; width: 100%; padding: 8px 10px; border: 0; border-radius: 5px; background: none; color: inherit; font: 600 14px/1.3 system-ui, sans-serif; text-align: left; cursor: pointer; }
  .poster-download-menu button span { font-weight: 400; font-size: 12.5px; opacity: .8; }
  .poster-download-menu button:hover { background: color-mix(in srgb, currentColor 9%, transparent); }
  .poster-download-menu button:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
  @media print { .poster-download-tools, .poster-actions, .poster-download-menu, .poster-download-error { display: none !important; } }
</style>
<script type="module" id="poster-download-script">
function addPosterFit(poster, button, changed) {
  const frame = document.createElement('div'), content = document.createElement('div');
  frame.className = 'poster-fit-frame'; content.className = 'poster-fit-content';
  poster.before(frame); frame.append(content); content.append(poster);
  const properties = ['width', 'max-width', 'margin', 'box-sizing'];
  const original = properties.map(name => [name, poster.style.getPropertyValue(name), poster.style.getPropertyPriority(name)]);
  let fitted = false, scale = 1, request = 0, layout = null;
  const availableHeight = () => parseFloat(getComputedStyle(frame).maxHeight) || innerHeight * .95;
  const layoutKey = () => {
    const css = getComputedStyle(poster);
    return [innerWidth, availableHeight(), css.width, css.height].join('/');
  };
  const restore = () => original.forEach(([name, value, priority]) => {
    if (value) poster.style.setProperty(name, value, priority);
    else poster.style.removeProperty(name);
  });
  function update() {
    request = 0;
    if (fitted && layout === layoutKey()) return;
    frame.classList.remove('is-fitted'); frame.style.width = ''; frame.style.height = '';
    content.style.width = ''; content.style.transform = ''; restore(); scale = 1;
    if (fitted) {
      const box = poster.getBoundingClientRect();
      scale = Math.min(1, availableHeight() / box.height);
      poster.style.setProperty('box-sizing', 'border-box');
      poster.style.setProperty('width', `${box.width}px`);
      poster.style.setProperty('max-width', 'none');
      poster.style.setProperty('margin', '0');
      content.style.width = `${box.width}px`;
      content.style.transform = `scale(${scale})`;
      frame.style.width = `${box.width * scale}px`; frame.style.height = `${box.height * scale}px`;
      frame.classList.add('is-fitted');
    }
    layout = layoutKey();
    const label = fitted ? 'Restore poster size' : 'Fit poster to screen';
    button.setAttribute('aria-label', label); button.title = label;
    button.setAttribute('aria-pressed', String(fitted));
    button.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${fitted ? 'M15 3h6v6m0-6-7 7M9 21H3v-6m0 6 7-7' : 'M4 4l6 6m0-6v6H4m16 10-6-6m0 6v-6h6'}"/></svg>`;
    changed();
    poster.dispatchEvent(new Event('poster-view-change'));
  }
  const schedule = () => { if (fitted && !request && layout !== layoutKey()) request = requestAnimationFrame(update); };
  new ResizeObserver(schedule).observe(poster);
  addEventListener('resize', schedule);
  document.fonts.ready.then(schedule);
  update();
  return {
    toggle() { fitted = !fitted; layout = null; cancelAnimationFrame(request); update(); },
    dimensions() {
      if (!fitted) { const box = poster.getBoundingClientRect(); return {width:box.width,height:box.height}; }
      const css = getComputedStyle(poster);
      return {width:parseFloat(css.width),height:parseFloat(css.height)};
    },
  };
}
function addPosterDownloads() {
  document.querySelectorAll('.poster').forEach((poster, index) => {
    const navigation = index === 0 && document.querySelector('.recipe-navigation');
    const tools = navigation || document.createElement('div');
    if (tools.querySelector('.poster-download')) return;
    const align = () => { if (!navigation) tools.style.width = `${poster.getBoundingClientRect().width}px`; };
    if (!navigation) {
      tools.className = 'poster-download-tools';
      poster.before(tools);
      new ResizeObserver(align).observe(poster);
      align();
      const rgb = getComputedStyle(document.body).backgroundColor.match(/[\d.]+/g);
      if (rgb) {
        const light = rgb.slice(0, 3).map(Number).map(v => {
          v /= 255;
          return v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4;
        });
        tools.style.color = light[0] * .2126 + light[1] * .7152 + light[2] * .0722 < .179 ? '#eef2f5' : '#1d1b17';
      }
    }
    const ground = getComputedStyle(document.body).backgroundColor;
    if (!/^(transparent|rgba\(0, 0, 0, 0\))$/.test(ground)) tools.style.setProperty('--poster-tools-ground', ground);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'poster-download';
    button.setAttribute('aria-label', 'Download poster as PNG');
    button.title = 'Download poster as PNG';
    button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></svg>';
    const actions = document.createElement('div'), fitButton = document.createElement('button');
    actions.className = 'poster-actions'; fitButton.className = 'poster-fit-toggle'; fitButton.type = 'button';
    if (!poster.id) {
      let id = `rhp-poster-${index + 1}`;
      while (document.getElementById(id)) id += '-view';
      poster.id = id;
    }
    fitButton.setAttribute('aria-controls', poster.id);
    fitButton.setAttribute('data-poster-view-toggle', '');
    const fit = addPosterFit(poster, fitButton, align);
    fitButton.addEventListener('click', event => { event.stopPropagation(); if (!busy) fit.toggle(); });
    actions.append(fitButton, button);
    const error = document.createElement('p');
    error.className = 'poster-download-error';
    error.setAttribute('role', 'alert');
    error.hidden = true;
    tools.after(error);
    // Download is part of the poster interaction, even though its control sits outside the image.
    actions.addEventListener('pointerdown', event => {
      event.stopPropagation();
    });
    actions.addEventListener('mousedown', event => {
      // Pointer activation downloads without taking focus from the selected chart item.
      event.preventDefault();
      event.stopPropagation();
    });
    poster.addEventListener('focusout', event => {
      if (actions.contains(event.relatedTarget) || actions.querySelector(':active')) event.stopImmediatePropagation();
    }, true);
    poster.addEventListener('pointerleave', event => {
      if (actions.contains(event.relatedTarget) || actions.contains(document.activeElement)) event.stopImmediatePropagation();
    }, true);
    poster.addEventListener('pointermove', event => {
      // Safari can move the pointer over the title while a keyboard-triggered download is being prepared.
      if (actions.contains(document.activeElement) && !event.target.closest('.rhp-chart')) event.stopImmediatePropagation();
    }, true);
    for (const type of ['keydown', 'keyup']) actions.addEventListener(type, event => {
      if (event.key === 'Enter' || event.key === ' ') event.stopPropagation();
    });
    // A poster that plays through its data gives itself a playback ({ duration, position, seek }): its download then
    // offers the poster as it is now, a PNG, or the whole playback, an animated GIF
    let exporter, encoder, retries = 0, busy = false, making = null, cancelled = false;
    const playable = () => typeof poster.playback?.seek === 'function';
    const icon = button.innerHTML;
    const menu = document.createElement('div');
    menu.className = 'poster-download-menu';
    menu.setAttribute('role', 'menu');
    menu.setAttribute('aria-label', 'Download poster');
    menu.hidden = true;
    menu.innerHTML = '<button type="button" role="menuitem" data-format="png">PNG image<span>The poster as it is now</span></button>'
      + '<button type="button" role="menuitem" data-format="gif">Animated GIF<span>The whole playback</span></button>';
    const items = [...menu.querySelectorAll('[role="menuitem"]')];
    actions.append(menu);
    const label = text => { button.setAttribute('aria-label', text); button.title = text; };
    const rest = () => {
      label(playable() ? 'Download poster' : 'Download poster as PNG');
      if (playable()) { button.setAttribute('aria-haspopup', 'menu'); button.setAttribute('aria-expanded', String(!menu.hidden)); }
    };
    rest();
    const closeMenu = focus => {
      if (menu.hidden) return;
      menu.hidden = true;
      rest();
      if (focus) button.focus();
    };
    const openMenu = focus => {
      menu.hidden = false;
      rest();
      if (focus) items[0].focus();
    };
    document.addEventListener('pointerdown', event => { if (!actions.contains(event.target)) closeMenu(false); }, true);
    menu.addEventListener('keydown', event => {
      const at = items.indexOf(document.activeElement);
      const to = { ArrowDown: at + 1, ArrowUp: at - 1, Home: 0, End: items.length - 1 }[event.key];
      if (to !== undefined) { event.preventDefault(); items[(to + items.length) % items.length].focus(); }
      else if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); closeMenu(true); }
      else if (event.key === 'Tab') closeMenu(false);
    });
    menu.addEventListener('focusout', event => { if (!menu.contains(event.relatedTarget) && event.relatedTarget !== button) closeMenu(false); });
    // The capture options, made once for a download and for every frame of a GIF
    const loadExporter = () => (exporter ||= import('https://cdn.jsdelivr.net/npm/modern-screenshot@4.7.0/+esm' + (retries ? `?retry=${retries}` : '')));
    async function captureOptions() {
      await document.fonts.ready;
      // Preserve author layout rules where computed styles lose the grid's used geometry.
      // Safari misreports percentage insets in subgrids, and grid auto margins resolve to zero.
      const autoMargins = new Set(), positioned = new Set();
      const isMargin = name => name === 'margin' || name.startsWith('margin-');
      const isInset = name => name === 'inset' || name.startsWith('inset-') || ['top', 'right', 'bottom', 'left'].includes(name);
      const layoutRules = rules => [...rules].map(rule => {
        if (rule.selectorText && rule.style) {
          const margins = [...rule.style].filter(isMargin);
          if (margins.some(name => /\bauto\b/.test(rule.style.getPropertyValue(name)))) autoMargins.add(rule.selectorText);
          const insets = [...rule.style].filter(isInset);
          if (insets.length) positioned.add(rule.selectorText);
          const layout = [...margins, ...insets];
          return layout.length ? `${rule.selectorText} { ${layout.map(name => `${name}: ${rule.style.getPropertyValue(name)}${rule.style.getPropertyPriority(name) ? ' !important' : ''};`).join(' ')} }` : '';
        }
        if (!rule.cssRules) return /^@layer\b/.test(rule.cssText) ? rule.cssText : '';
        if (rule instanceof CSSMediaRule) return matchMedia(rule.conditionText).matches ? layoutRules(rule.cssRules) : '';
        if (rule instanceof CSSSupportsRule) return CSS.supports(rule.conditionText) ? layoutRules(rule.cssRules) : '';
        return rule.cssText.slice(0, rule.cssText.indexOf('{') + 1) + layoutRules(rule.cssRules) + '}';
      }).join('\n');
      const sheets = [...document.styleSheets, ...document.adoptedStyleSheets];
      const layout = sheets.map(sheet => {
        try { return layoutRules(sheet.cssRules); } catch (cause) { return ''; }
      }).join('\n');
      // Omit display-none HTML subtrees, such as collapsed chart rows, from the image and its SVG payload.
      const includeNode = node => !(node instanceof HTMLElement) || getComputedStyle(node).display !== 'none';
      const restoreLayout = (source, clone) => {
        if (clone.style && source !== poster) {
          const margins = [...autoMargins].some(selector => source.matches(selector));
          const computed = getComputedStyle(source);
          const insets = computed.position === 'absolute' && [...positioned].some(selector => source.matches(selector));
          const restore = name => (margins && isMargin(name)) || (insets && isInset(name));
          [...clone.style].filter(restore).forEach(name => clone.style.removeProperty(name));
          [...source.style].filter(restore).forEach(name => clone.style.setProperty(name, source.style.getPropertyValue(name), source.style.getPropertyPriority(name)));
          if (insets) {
            // Only the scaled axis needs its percentage rule. Freeze the other axis in pixels:
            // Firefox does not reevaluate container queries reliably inside an SVG foreignObject.
            const axis = source.getAttribute('data-rhp-o');
            const fixed = axis === 'h' ? ['top', 'bottom'] : axis === 'v' ? ['left', 'right'] : ['top', 'right', 'bottom', 'left'];
            fixed.forEach(name => clone.style.setProperty(name, computed.getPropertyValue(name), 'important'));
          }
        }
        const children = [...source.children].filter(node => !['STYLE', 'SCRIPT'].includes(node.tagName) && includeNode(node));
        [...clone.children].forEach((child, i) => { if (children[i]) restoreLayout(children[i], child); });
      };
      // Cross-origin font stylesheets are readable through fetch, but not through cssRules.
      const fontFiles = new Map();
      const fontRules = await Promise.all(sheets.map(async sheet => {
        let css;
        try { css = [...sheet.cssRules].map(rule => rule.cssText).join('\n'); }
        catch (cause) {
          if (!sheet.href) return '';
          const response = await fetch(sheet.href);
          if (!response.ok) throw new Error('Font stylesheet could not be loaded');
          css = await response.text();
        }
        const rules = css.match(/@font-face\s*\{[^}]*\}/g) || [];
        return (await Promise.all(rules.map(async rule => {
          for (const match of [...rule.matchAll(/url\(["']?([^"')]+)["']?\)/g)]) {
            const source = new URL(match[1], sheet.href || document.baseURI).href;
            if (!fontFiles.has(source)) fontFiles.set(source, (async () => {
              const response = await fetch(source);
              if (!response.ok) throw new Error('Font could not be loaded');
              const blob = await response.blob();
              return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
              });
            })());
            rule = rule.replace(match[1], await fontFiles.get(source));
          }
          return rule;
        }))).join('\n');
      }));
      // Rasterize SVG paper textures before nesting them inside the exporter's SVG.
      // This keeps SVG filter fragment references local to their own image.
      const textures = new Map();
      const embedTexture = async (node) => {
        if (!node.style) return;
        let background = node.style.backgroundImage;
        for (const [, source] of background.matchAll(/url\("(data:image\/svg\+xml[^"]+)"\)/g)) {
          if (!textures.has(source)) textures.set(source, (async () => {
            const image = new Image();
            image.src = source;
            await image.decode();
            const canvas = document.createElement('canvas');
            canvas.width = image.naturalWidth;
            canvas.height = image.naturalHeight;
            canvas.getContext('2d').drawImage(image, 0, 0);
            return canvas.toDataURL();
          })());
          background = background.replace(source, await textures.get(source));
        }
        node.style.backgroundImage = background;
      };
      return {
        ...fit.dimensions(), style: { margin: '0' }, filter: includeNode,
        font: { cssText: fontRules.join('\n') }, onCloneEachNode: embedTexture,
        onCloneNode: clone => {
          restoreLayout(poster, clone);
          const style = document.createElement('style');
          style.textContent = layout;
          clone.prepend(style);
        },
        // CSS content's alternative text follows a slash and must not be painted.
        onCreateForeignObjectSvg: svg => svg.querySelectorAll('style').forEach(style => {
          style.textContent = style.textContent.replace(/(content:\s*')([^']*)(')/g, (_, start, text, end) => start + text.split(' / ')[0] + end);
        }),
      };
    }
    let url;
    const save = (blob, extension) => {
      url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const title = poster.querySelector('.headline')?.textContent || document.title || 'poster';
      link.download = (title.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 100) || 'poster') + '.' + extension;
      link.href = url;
      link.addEventListener('click', event => event.stopPropagation(), { once: true });
      document.body.append(link);
      link.click();
      link.remove();
    };
    const begin = kind => {
      busy = true;
      making = kind;
      button.setAttribute('aria-busy', 'true');
      fitButton.setAttribute('aria-disabled', 'true');
      // A GIF takes a while: the button shows its progress and cancels it
      if (kind === 'gif') label('Cancel the GIF');
      else { button.setAttribute('aria-disabled', 'true'); label('Preparing poster PNG'); }
      error.hidden = true;
    };
    const end = () => {
      if (url) setTimeout(() => URL.revokeObjectURL(url), 60000);
      url = null;
      busy = false;
      making = null;
      cancelled = false;
      button.innerHTML = icon;
      button.removeAttribute('aria-disabled');
      button.removeAttribute('aria-busy');
      fitButton.removeAttribute('aria-disabled');
      rest();
    };
    const fail = message => {
      exporter = null;
      encoder = null;
      retries++;
      error.textContent = message;
      error.hidden = false;
    };
    async function savePng() {
      begin('png');
      try {
        const { domToBlob } = await loadExporter();
        const blob = await domToBlob(poster, { ...(await captureOptions()), scale: 2 });
        if (!blob) throw new Error('No PNG was created');
        save(blob, 'png');
      } catch (cause) {
        fail('The PNG could not be saved. Check your connection and try again.');
      } finally {
        end();
      }
    }
    // The GIF: the playback in frames 80 ms apart, for up to 15 seconds, at most 1200 pixels wide. One palette from
    // the first and the last frame serves every frame; its last color is never drawn and marks the pixels a frame leaves
    // as the frame before had them, so each frame stores only what changed.
    async function saveGif() {
      const playback = poster.playback;
      const from = playback.position();
      begin('gif');
      try {
        encoder ||= import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm' + (retries ? `?retry=${retries}` : ''));
        const [{ domToCanvas }, { GIFEncoder, quantize, applyPalette }] = await Promise.all([loadExporter(), encoder]);
        const options = await captureOptions();
        const scale = Math.min(1, 1200 / options.width);
        const count = Math.max(2, Math.round(Math.min(playback.duration ?? 15000, 15000) / 80) + 1);
        const frame = async (at, settled) => {
          playback.seek(at);
          // rhp moves the marks to their new values over 150 ms
          await new Promise(requestAnimationFrame);
          await new Promise(resolve => setTimeout(resolve, 200));
          // After a jump, rows that come back fade in: the frames the palette is made from wait for them
          if (settled) await Promise.all(poster.getAnimations({ subtree: true }).filter(animation => animation.effect?.getComputedTiming().iterations !== Infinity).map(animation => animation.finished.catch(() => {})));
          const canvas = await domToCanvas(poster, { ...options, scale });
          return canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
        };
        const last = await frame(1, true), first = await frame(0, true);
        const both = new Uint8ClampedArray(first.data.length + last.data.length);
        both.set(first.data);
        both.set(last.data, first.data.length);
        const palette = quantize(both, 255), kept = palette.length;
        // A flat color that fills a part of the poster keeps its exact value: it takes the nearest palette entry
        const counts = new Map(), taken = new Set();
        for (let j = 0; j < both.length; j += 4) {
          const color = (both[j] << 16) | (both[j + 1] << 8) | both[j + 2];
          counts.set(color, (counts.get(color) ?? 0) + 1);
        }
        for (const [color] of [...counts].filter(([, n]) => n > both.length / 8000).sort((a, b) => b[1] - a[1])) {
          const rgb = [color >> 16, (color >> 8) & 255, color & 255];
          let nearest = -1, distance = Infinity;
          palette.forEach((entry, k) => {
            const d = (entry[0] - rgb[0]) ** 2 + (entry[1] - rgb[1]) ** 2 + (entry[2] - rgb[2]) ** 2;
            if (!taken.has(k) && d < distance) { nearest = k; distance = d; }
          });
          if (nearest >= 0) { palette[nearest] = rgb; taken.add(nearest); }
        }
        palette.push([255, 0, 255]);
        const gif = GIFEncoder();
        let previous = null;
        for (let i = 0; i < count; i++) {
          if (cancelled) return;
          const image = i === 0 ? first : await frame(i / (count - 1));
          const index = applyPalette(image.data, palette.slice(0, kept));
          const pixels = previous ? index.map((p, j) => (p === previous[j] ? kept : p)) : index;
          gif.writeFrame(pixels, image.width, image.height, {
            palette: i === 0 ? palette : undefined, delay: i === 0 ? 1000 : i === count - 1 ? 3000 : 80,
            transparent: i > 0, transparentIndex: kept, dispose: 1,
          });
          previous = index;
          const done = Math.round(((i + 1) / count) * 100);
          button.innerHTML = `<span class="poster-download-progress" aria-hidden="true">${done}%</span>`;
          label(`Cancel the GIF, ${done}% made`);
        }
        gif.finish();
        save(new Blob([gif.bytes()], { type: 'image/gif' }), 'gif');
      } catch (cause) {
        fail('The GIF could not be made. Check your connection and try again.');
      } finally {
        playback.seek(from);
        end();
      }
    }
    button.addEventListener('click', event => {
      event.stopPropagation();
      if (busy) {
        if (making === 'gif') cancelled = true;
        return;
      }
      if (!playable()) return savePng();
      // A key press is a click with no pointer detail: it opens the menu on its first item
      if (menu.hidden) openMenu(event.detail === 0);
      else closeMenu(event.detail === 0);
    });
    menu.addEventListener('click', event => {
      const item = event.target.closest('[data-format]');
      if (!item) return;
      event.stopPropagation();
      closeMenu(event.detail === 0);
      if (item.dataset.format === 'gif') saveGif();
      else savePng();
    });
    tools.append(actions);
  });
}
// A chart module may await fonts or data after DOMContentLoaded has already fired.
if (document.querySelector('.poster')) addPosterDownloads();
else {
  const observer = new MutationObserver(() => {
    if (!document.querySelector('.poster')) return;
    observer.disconnect();
    addPosterDownloads();
  });
  observer.observe(document.getElementById('chart') || document.body, { childList: true, subtree: true });
}
</script>
</body>
</html>
