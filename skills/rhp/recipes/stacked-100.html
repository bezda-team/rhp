<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How cities get to work</title>
<meta name="description" content="100% stacked bar chart of shares per category, labeled where they fit, with a key that lights one part in every bar on hover, focus and tap. Use it to compare how a whole splits across several categories.">
<!--
  A recipe gives technique, not a design.
  Take: stackUp() of shares() in an overlap inner Plot, labels inside where they fit, and a key that lights one part in every bar.
  Leave: the design. This poster was made for its own subject (ways to commute as a transit map: enamel white, geometric type, the key drawn as a metro line whose stations are the buttons).
  Its look, the place of its parts and the way its marks are drawn say that subject: design yours from your own (design.md, section 2).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400..800&display=swap">
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px 16px; background: #dedcd8; font-family: Jost, "Futura", "Century Gothic", system-ui, sans-serif; }
  /* The poster: a transit map's white paper with faint 45 degree hatching, bold geometric type, the key drawn as a metro line */
  .poster { max-width: 940px; margin: 0 auto; padding: 46px 52px 30px; color: #1d1b17; border-radius: 10px;
    background: repeating-linear-gradient(45deg, rgb(29 27 23 / .028) 0 1px, transparent 1px 11px), #fbfbf9;
    box-shadow: 0 28px 56px -30px rgb(64 60 52 / .6); }
  .poster figcaption { display: grid; gap: 12px; margin-bottom: 26px; }
  .poster .kicker { font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #2f5bd3; }
  .poster .headline { max-width: 15em; font-size: 50px; font-weight: 700; line-height: 1.02; letter-spacing: -.015em; text-wrap: balance; }
  .poster .dek { max-width: 56ch; font-size: 17px; line-height: 1.5; color: #4b4840; }
  .poster .note { display: block; margin-top: 20px; font-size: 13px; line-height: 1.5; color: #6b675e; }
  /* The key: a metro line whose stations are the modes; pointing at or focusing a station lights that mode */
  .route { display: flex; max-width: 480px; margin: 0 0 24px; }
  .route button { position: relative; flex: 1; display: grid; justify-items: start; gap: 8px; padding: 0 0 4px; border: 0; background: none; color: #1d1b17; font: 600 15px/1 Jost, system-ui, sans-serif; cursor: pointer; }
  .route button:last-child { flex: none; }
  .route button:not(:last-child)::before { content: ""; position: absolute; top: 8px; left: 11px; width: 100%; height: 6px; background: var(--c); }
  .route i { position: relative; width: 22px; height: 22px; border: 5px solid var(--c); border-radius: 50%; background: #fbfbf9; }
  .route button:is(:hover, .on) i { background: var(--c); }
  .route button[aria-pressed="true"] { font-weight: 800; }
  .route button:focus-visible { outline: 2px solid #1d1b17; outline-offset: 4px; border-radius: 4px; }
  @media (max-width: 600px) {
    body { padding: 16px 16px 32px; }
    .poster { padding: 26px 16px 18px; }
    .poster .headline { font-size: 33px; }
    .poster .dek { font-size: 16px; }
    .route button { font-size: 14px; }
  }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Label, Poster, slat, sortBy, stackUp, shares, html, render, createSignal, createMemo } from "@bezda/rhp/standalone";

// Data: how people usually get to work in six invented cities, as % of commuters. Illustrative data; replace with your own.
const MODES = [
  { key: "car", name: "Car", color: "#d0453a" },
  { key: "transit", name: "Transit", color: "#2f5bd3" },
  { key: "bike", name: "Bike", color: "#2e9a62" },
  { key: "walk", name: "Walk", color: "#e0a40c" },
];
const CITIES = [
  { city: "Riverton", car: 84, transit: 8, bike: 1, walk: 7 },
  { city: "Harbour City", car: 29, transit: 49, bike: 5, walk: 17 },
  { city: "Millbrook", car: 26, transit: 21, bike: 41, walk: 12 },
  { city: "Greenhaven", car: 20, transit: 22, bike: 36, walk: 22 },
  { city: "Port Ellis", car: 13, transit: 62, bike: 8, walk: 17 },
  { city: "Lakemont", car: 12, transit: 64, bike: 12, walk: 12 },
];

const KEYS = MODES.map((m) => m.key);
const percent = (v) => Math.round(v) + "%";

// Slat types: one mode's share of a city (its number inside it when it fits), and a city holding its shares in one band.
// A share starts 2px after the one before it, and the first starts on the baseline. A share too thin to show at this
// width keeps a 2px sliver, drawn over its neighbor, so it shows at every width.
const size = (share) => (share < 3 ? "thin small" : share < 9 ? "small" : share < 15 ? "mid" : "");
const Share = slat({
  inset: 0,
  css: `
    .share { --rhp-radius: 0px; display: grid; place-items: center; cursor: pointer; }
    .after { --rhp-gap: 2px; }
    .first { --rhp-start-radius: 14px; }
    .share:last-child { --rhp-end-radius: 14px; }
    .thin { min-width: 2px; z-index: 1; }
    .share > span { font-size: 13px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
    .share:is(.bike, .walk) > span { color: #1d1b17; } /* ink on the light colors, white on the dark ones */
    .small > span, .off > span { display: none; }
    .off { opacity: .2; }
    .on { z-index: 2; }
    .on:is(.small, .mid) > span { display: block; position: absolute; left: 50%; top: 50%; translate: -50% -50%; padding: 4px 8px; border-radius: 99px; background: var(--rhp-color); box-shadow: 0 0 0 2px #fbfbf9; }
    .on.first:is(.small, .mid) > span { left: 2px; translate: 0 -50%; }
    .on.share:last-child:is(.small, .mid) > span { left: auto; right: 2px; translate: 0 -50%; }
    @container (max-width: 420px) { .mid:not(.on) > span { display: none; } }
  `,
}, (s) => html`
  <${Bar} from=${() => s.from} to=${() => s.to} color=${() => s.color} data-mode=${() => s.mode}
    class=${() => ["share", s.mode, s.from > 0 ? "after" : "first", s.to > s.from && size(s.to - s.from), s.lit && (s.lit === s.mode ? "on" : "off")].filter(Boolean).join(" ")}>
    <span>${() => percent(s.to - s.from)}</span>
  <//>`);

const City = slat({
  thickness: 52,
  room: { start: "auto", end: 18 },
  css: `
    .city { font-size: 17px; font-weight: 600; --rhp-label-gap: 14px; }
    @container (max-width: 420px) { .city { max-width: 7em; font-size: 14px; line-height: 1.1; white-space: normal; --rhp-label-gap: 10px; } }
  `,
}, (d) => {
  const share = createMemo(() => shares(KEYS.map((k) => d[k]))); // each mode as a share of 100
  const stack = createMemo(() => stackUp(share())); // the shares end to end
  return html`
    <div aria-label=${() => `${d.city}: ` + MODES.map((m, i) => `${m.name.toLowerCase()} ${percent(share()[i])}`).join(", ")}>
      <${Label} edge="start" class="city">${() => d.city}<//>
      <${Plot} overlap=${true} thick="28px" mode=${KEYS} color=${MODES.map((m) => m.color)} lit=${() => d.lit}
        from=${() => stack().from} to=${() => stack().to}>${Share}<//>
    </div>`;
});

// Chart component: the mode pointed at or reached with the keyboard (else the one clicked or tapped) lights up in every
// city
function Commutes() {
  const [hovered, setHovered] = createSignal(null);
  const [pinned, setPinned] = createSignal(null);
  const lit = () => hovered() ?? pinned();
  const modeOf = (el) => el?.closest("[data-mode]")?.dataset.mode ?? null;
  // A mouse or a pen previews a mode; away from the line and bars, the keyboard's or kept mode shows
  const hover = (e) => e.pointerType !== "touch" && setHovered(modeOf(e.target) ?? modeOf(e.currentTarget.querySelector(":focus-visible")));
  // The keyboard lights the mode it reaches. A click or a tap focuses its button too, so only a focus ring counts.
  const focus = (e) => e.target.matches(":focus-visible") && setHovered(modeOf(e.target));
  // Leaving the poster: back to the mode the keyboard is on, or none, so the kept mode shows
  const leave = (e) => e.pointerType !== "touch" && setHovered(modeOf(e.currentTarget.querySelector(":focus-visible")));
  // A click or a tap keeps a mode lit, and another on it lets it go
  const keep = (e) => setPinned((p) => (modeOf(e.target) === p ? null : modeOf(e.target)));
  return html`
    <${Poster}
      kicker="The commute in six cities"
      title="Only in Riverton do most people drive to work"
      dek="How commuters usually get to work, as a share of all of them. Point at a mode on the line or in a bar to follow it through every city; click or tap it to keep it lit."
      note="Illustrative data for six invented cities. Shares are rounded to whole percents."
      onPointerMove=${hover} onPointerLeave=${leave} onFocusIn=${focus}
      onFocusOut=${(e) => !e.currentTarget.contains(e.relatedTarget) && setHovered(null)}
      onClick=${keep} onKeyDown=${(e) => e.key === "Escape" && setPinned(null)}>
      <div class="route" role="group" aria-label="Modes of transport">
        ${MODES.map((m) => html`
          <button type="button" data-mode=${m.key} style=${"--c: " + m.color} aria-pressed=${() => pinned() === m.key} class=${() => (lit() === m.key ? "on" : "")}><i></i>${m.name}</button>`)}
      </div>
      <!-- no axis: every bar runs from 0% to 100%, and the shares are written in the bars -->
      <${Chart} scale=${[0, 100]} ticks=${false}
        label="How commuters get to work in six cities, as a share of all commuters"
        theme=${{ font: 'Jost, "Futura", "Century Gothic", system-ui, sans-serif', ink: "#1d1b17", muted: "#6b675e" }}>
        <${Plot} rows=${CITIES} order=${sortBy("car", "desc")} lit=${lit}>${City}<//>
      <//>
    <//>`;
}

render(() => html`<${Commutes} />`, document.getElementById("chart"));
</script>
<style id="poster-download-styles">
  .poster-download-tools { display: flex; justify-content: flex-end; align-items: center; margin: 0 auto 12px; max-width: 100%; }
  .poster-download { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 44px; height: 44px; padding: 10px; border: 0; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
  .poster-download svg { display: block; width: 20px; height: 20px; }
  .poster-download:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
  .poster-download:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .poster-download:disabled { cursor: progress; opacity: .5; }
  .poster-download-error { margin: 8px auto; font: 14px/1.4 system-ui, sans-serif; color: inherit; }
  @media print { .poster-download-tools, .poster-download, .poster-download-error { display: none !important; } }
</style>
<script type="module" id="poster-download-script">
function addPosterDownloads() {
  document.querySelectorAll('.poster').forEach((poster, index) => {
    const navigation = index === 0 && document.querySelector('.recipe-navigation');
    const tools = navigation || document.createElement('div');
    if (tools.querySelector('.poster-download')) return;
    if (!navigation) {
      tools.className = 'poster-download-tools';
      poster.before(tools);
      const align = () => { tools.style.width = `${poster.getBoundingClientRect().width}px`; };
      new ResizeObserver(align).observe(poster);
      align();
      const rgb = getComputedStyle(document.body).backgroundColor.match(/[\d.]+/g);
      if (rgb) {
        const light = rgb.slice(0, 3).map(Number).map(v => {
          v /= 255;
          return v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4;
        });
        tools.style.color = light[0] * .2126 + light[1] * .7152 + light[2] * .0722 < .179 ? '#eef2f5' : '#1d1b17';
      }
    }
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'poster-download';
    button.setAttribute('aria-label', 'Download poster as PNG');
    button.title = 'Download poster as PNG';
    button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></svg>';
    const error = document.createElement('p');
    error.className = 'poster-download-error';
    error.setAttribute('role', 'alert');
    error.hidden = true;
    tools.after(error);
    let exporter, retries = 0;
    button.addEventListener('click', async () => {
      button.disabled = true;
      button.setAttribute('aria-busy', 'true');
      button.setAttribute('aria-label', 'Preparing poster PNG');
      error.hidden = true;
      let url;
      try {
        exporter ||= import('https://cdn.jsdelivr.net/npm/modern-screenshot@4.7.0/+esm' + (retries ? `?retry=${retries}` : ''));
        const { domToBlob } = await exporter;
        await document.fonts.ready;
        // Grid auto margins resolve to zero in getComputedStyle, so keep their author rules.
        const autoMargins = new Set();
        const marginRules = rules => [...rules].map(rule => {
          if (rule.selectorText && rule.style) {
            const margins = [...rule.style].filter(name => name === 'margin' || name.startsWith('margin-'));
            if (margins.some(name => /\bauto\b/.test(rule.style.getPropertyValue(name)))) autoMargins.add(rule.selectorText);
            return margins.length ? `${rule.selectorText} { ${margins.map(name => `${name}: ${rule.style.getPropertyValue(name)}${rule.style.getPropertyPriority(name) ? ' !important' : ''};`).join(' ')} }` : '';
          }
          if (!rule.cssRules) return '';
          if (rule instanceof CSSMediaRule) return matchMedia(rule.conditionText).matches ? marginRules(rule.cssRules) : '';
          if (rule instanceof CSSSupportsRule) return CSS.supports(rule.conditionText) ? marginRules(rule.cssRules) : '';
          return rule.cssText.slice(0, rule.cssText.indexOf('{') + 1) + marginRules(rule.cssRules) + '}';
        }).join('\n');
        const margins = [...document.styleSheets].map(sheet => {
          try { return marginRules(sheet.cssRules); } catch (cause) { return ''; }
        }).join('\n');
        const restoreMargins = (source, clone) => {
          if (clone.style && source !== poster && [...autoMargins].some(selector => source.matches(selector))) {
            [...clone.style].filter(name => name === 'margin' || name.startsWith('margin-')).forEach(name => clone.style.removeProperty(name));
            [...source.style].filter(name => name === 'margin' || name.startsWith('margin-')).forEach(name => clone.style.setProperty(name, source.style.getPropertyValue(name), source.style.getPropertyPriority(name)));
          }
          const children = [...source.children].filter(node => !['STYLE', 'SCRIPT'].includes(node.tagName));
          [...clone.children].forEach((child, i) => { if (children[i]) restoreMargins(children[i], child); });
        };
        // Cross-origin font stylesheets are readable through fetch, but not through cssRules.
        const fontFiles = new Map();
        const fontRules = await Promise.all([...document.styleSheets].map(async sheet => {
          let css;
          try { css = [...sheet.cssRules].map(rule => rule.cssText).join('\n'); }
          catch (cause) {
            if (!sheet.href) return '';
            const response = await fetch(sheet.href);
            if (!response.ok) throw new Error('Font stylesheet could not be loaded');
            css = await response.text();
          }
          const rules = css.match(/@font-face\s*\{[^}]*\}/g) || [];
          return (await Promise.all(rules.map(async rule => {
            for (const match of [...rule.matchAll(/url\(["']?([^"')]+)["']?\)/g)]) {
              const source = new URL(match[1], sheet.href || document.baseURI).href;
              if (!fontFiles.has(source)) fontFiles.set(source, (async () => {
                const response = await fetch(source);
                if (!response.ok) throw new Error('Font could not be loaded');
                const blob = await response.blob();
                return new Promise((resolve, reject) => {
                  const reader = new FileReader();
                  reader.onload = () => resolve(reader.result);
                  reader.onerror = reject;
                  reader.readAsDataURL(blob);
                });
              })());
              rule = rule.replace(match[1], await fontFiles.get(source));
            }
            return rule;
          }))).join('\n');
        }));
        // Rasterize SVG paper textures before nesting them inside the exporter's SVG.
        // This keeps SVG filter fragment references local to their own image.
        const textures = new Map();
        const embedTexture = async (node) => {
          if (!node.style) return;
          let background = node.style.backgroundImage;
          for (const [, source] of background.matchAll(/url\("(data:image\/svg\+xml[^"]+)"\)/g)) {
            if (!textures.has(source)) textures.set(source, (async () => {
              const image = new Image();
              image.src = source;
              await image.decode();
              const canvas = document.createElement('canvas');
              canvas.width = image.naturalWidth;
              canvas.height = image.naturalHeight;
              canvas.getContext('2d').drawImage(image, 0, 0);
              return canvas.toDataURL();
            })());
            background = background.replace(source, await textures.get(source));
          }
          node.style.backgroundImage = background;
        };
        const blob = await domToBlob(poster, {
          scale: 2, style: { margin: '0' },
          font: { cssText: fontRules.join('\n') }, onCloneEachNode: embedTexture,
          onCloneNode: clone => {
            restoreMargins(poster, clone);
            const style = document.createElement('style');
            style.textContent = margins;
            clone.prepend(style);
          },
          // CSS content's alternative text follows a slash and must not be painted.
          onCreateForeignObjectSvg: svg => svg.querySelectorAll('style').forEach(style => {
            style.textContent = style.textContent.replace(/(content:\s*')([^']*)(')/g, (_, start, text, end) => start + text.split(' / ')[0] + end);
          }),
        });
        if (!blob) throw new Error('No PNG was created');
        url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const title = poster.querySelector('.headline')?.textContent || document.title || 'poster';
        link.download = (title.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 100) || 'poster') + '.png';
        link.href = url;
        document.body.append(link);
        link.click();
        link.remove();
      } catch (cause) {
        exporter = null;
        retries++;
        error.textContent = 'The PNG could not be saved. Check your connection and try again.';
        error.hidden = false;
      } finally {
        if (url) setTimeout(() => URL.revokeObjectURL(url), 60000);
        button.disabled = false;
        button.removeAttribute('aria-busy');
        button.setAttribute('aria-label', 'Download poster as PNG');
      }
    });
    tools.append(button);
  });
}
// A chart module may await fonts or data after DOMContentLoaded has already fired.
if (document.querySelector('.poster')) addPosterDownloads();
else {
  const observer = new MutationObserver(() => {
    if (!document.querySelector('.poster')) return;
    observer.disconnect();
    addPosterDownloads();
  });
  observer.observe(document.getElementById('chart') || document.body, { childList: true, subtree: true });
}
</script>
</body>
</html>
