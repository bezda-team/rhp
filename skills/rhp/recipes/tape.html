<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A day on one tape</title>
<meta name="description" content="Tape: the parts of one whole laid end to end along a ruled measure and cut into equal lengths (a Chart per length, an overlap Plot of the parts that fall in it, a Scale of rules, notches and numerals that counts on), names and times inside a part only where the measured text fits, one group lit at rest, a big-number readout and a grouped key that picks too. Use it for how a day, a budget or any whole splits into parts that add up, read as lengths along one measure.">
<!--
  A recipe gives technique, not a design.
  Take: the parts of one whole laid end to end (where each starts and ends, summed in order) and cut into equal lengths, a Chart per length with an overlap Plot of the parts that fall in it (a part carried over from the length before is drawn open at its start); a Scale of rules, notches and numerals that counts on from the length before; names and times inside a part only where the text, measured once its font is in, fits; picking a part by pointer, tap, keyboard or its line in the key; section headings that toggle all their parts; one group lit at rest; a big-number readout.
  Leave: the design. This poster was made for its own subject (the average American day as a yellow tape measure in three 8-hour lengths, its numerals and rules printed in black, leisure in one deep blue, a grouped key under the tape).
  Its look, the place of its parts and the way its marks are drawn say that subject: design yours from your own (design.md, section 2).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600;700&display=swap">
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  /* Tokens: tape-measure yellow, the ink of printed numerals, one deep blue for the story */
  :root {
    --page: #d1ad44;
    --paper: #edc965;
    --ink: #231a05;
    --soft: #4a3a0e;
    --rule: #d4b33c;
    --accent: #163077;
    --tint: #f7e5a8;
    --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    --text: "Barlow", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px 16px; background: var(--page, #d1ad44); }

  .poster { display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 14px; max-width: 1040px; margin: 0 auto; padding: 44px 48px 28px;
    grid-template-areas: "kicker" "headline" "dek" "readout" "tapes" "key" "note";
    background: var(--paper); color: var(--ink); font: 16px/1.5 var(--text); }
  .poster figcaption { display: contents; }
  .poster .kicker { grid-area: kicker; font: 700 14px/1.3 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .poster .headline { grid-area: headline; max-width: 17em; font: 700 clamp(36px, 6vw, 64px)/.98 var(--display); letter-spacing: -.005em; text-wrap: balance; }
  .poster .dek { grid-area: dek; max-width: 36em; font-size: 17px; line-height: 1.45; color: var(--soft); }
  .poster .note { grid-area: note; display: block; margin-top: 10px; padding-top: 12px; border-top: 2px solid var(--ink); font-size: 12px; line-height: 1.5; color: var(--soft); }
  .poster :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* The readout: the stretch picked, in big printed numerals; it keeps its height so nothing below moves */
  .readout { grid-area: readout; display: flex; align-items: center; gap: 18px; min-height: 84px; margin: 6px 0 10px; }
  .readout .big { flex: none; width: 3.1em; font: 700 clamp(48px, 9vw, 76px)/1 var(--display); font-variant-numeric: tabular-nums; color: var(--accent); white-space: nowrap; }
  .readout .big span { margin: 0 .12em 0 .05em; font-size: .46em; font-weight: 600; }
  .readout .what { min-width: 0; font-size: 16px; line-height: 1.3; color: var(--soft); }
  .readout .what strong { display: block; font: 700 clamp(22px, 3.4vw, 28px)/1.1 var(--display); color: var(--ink); }
  .readout .detail { display: block; }

  /* The tapes: three lengths of 8 hours, one above the other */
  .tapes { grid-area: tapes; display: grid; gap: 14px; min-width: 0; }
  .tapes .hours { pointer-events: none; }

  /* The key: every stretch of tape, grouped, in tape order */
  .key { grid-area: key; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px 28px; margin-top: 8px; min-width: 0; }
  .key h3 { display: flex; justify-content: space-between; gap: 10px; margin: 0 0 4px; padding-bottom: 5px; border-bottom: 2px solid var(--ink);
    font: 700 15px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; }
  .key h3 span { font-variant-numeric: tabular-nums; letter-spacing: .04em; white-space: nowrap; }
  .key ul { margin: 0; padding: 0; list-style: none; }
  .key button { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: baseline; gap: 9px; width: 100%; margin: 0; padding: 3px 0;
    border: 0; background: none; color: var(--ink); font: 400 15px/1.3 var(--text); text-align: left; cursor: pointer; }
  .key button i { align-self: center; width: 14px; height: 14px; background: var(--tint); box-shadow: inset 0 0 0 2px var(--ink); }
  .key button b { font: 700 16px/1.2 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .key button.on { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; }
  .key button.on i { background: var(--accent); box-shadow: none; }
  .key h3 button { display: flex; justify-content: space-between; align-items: normal; gap: 10px; padding: 0;
    color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; }

  @media (min-width: 860px) {
    .poster { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); column-gap: 40px;
      grid-template-areas: "kicker kicker" "headline headline" "dek readout" "tapes tapes" "key key" "note note"; }
    .readout { margin: 0; }
  }
  @media (min-width: 860px) and (max-width: 1000px) {
    .readout .what strong { min-height: 2lh; }
  }
  @media (max-width: 640px) {
    body { padding: 16px 16px 32px; }
    .poster { padding: 24px 16px 16px; }
    .poster .dek { font-size: 15px; }
    .readout { gap: 12px; min-height: 128px; }
    .readout .what { font-size: 14px; }
  }
  @media (max-width: 390px) {
    .readout .what strong { min-height: 2lh; }
    .readout .detail { min-height: 4lh; }
  }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Scale, Bar, Tick, Place, Poster, slat, every, html, render, createSignal } from "@bezda/rhp/standalone";

// Data: average hours per day in 2025, for Americans aged 15 and older, over all seven days of the week, people with
// and without jobs alike. U.S. Bureau of Labor Statistics, American Time Use Survey, 2025 results (released June 25,
// 2026), table 1. Each activity includes the travel that goes with it.
const GROUPS = ["Sleep and self-care", "Work and school", "Home and family", "Leisure and sports", "Everything else"];
const DAY = [
  { group: 0, name: "Sleep", short: "Sleep", hours: 9.03 },
  { group: 0, name: "Eating and drinking", short: "Meals", hours: 1.21 },
  { group: 0, name: "Grooming and health", short: "Grooming", hours: 0.77 },
  { group: 1, name: "Paid work", short: "Work", hours: 3.32 },
  { group: 1, name: "Classes and homework", short: "School", hours: 0.44 },
  { group: 2, name: "Housework, cooking and yard", short: "Chores", hours: 1.99 },
  { group: 2, name: "Shopping and errands", short: "Errands", hours: 0.69 },
  { group: 2, name: "Caring for others", short: "Care", hours: 0.64 },
  { group: 3, name: "Watching TV", short: "TV", hours: 2.61 },
  { group: 3, name: "Reading, games and other leisure", short: "Leisure", hours: 1.63 },
  { group: 3, name: "Socializing", short: "Social", hours: 0.58 },
  { group: 3, name: "Sports and exercise", short: "Sport", hours: 0.34 },
  { group: 4, name: "Worship, volunteering, calls, mail and other", short: "Other", hours: 0.74 },
];
const NOTE = "Source: U.S. Bureau of Labor Statistics, American Time Use Survey, 2025 results (June 2026), table 1: average hours per day, people aged 15 and older, all days of the week. Each activity includes the travel it takes. Times are rounded, so they may not add up to exactly 24 hours.";

// What depends on the data: where each activity starts and ends on the tape, group totals, the headline's numbers
let at = 0;
const ACTS = DAY.map((a) => ({ ...a, from: at, to: (at += a.hours) }));
const groupHours = GROUPS.map((_, g) => DAY.filter((a) => a.group === g).reduce((sum, a) => sum + a.hours, 0));
const LEAD = 3; // the group the headline names: leisure, lit until the reader picks a stretch
const WORK = DAY.find((a) => a.name === "Paid work").hours;
const percent = new Intl.NumberFormat("en-US", { style: "percent", maximumFractionDigits: 0 });
const minutes = (hours) => Math.round(hours * 60);
const short = (hours) => {
  const m = minutes(hours);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`;
};
const HEADLINE = groupHours[LEAD] >= WORK
  ? `Leisure gets ${short(groupHours[LEAD])} of the day, paid work only ${short(WORK)}`
  : `Paid work gets ${short(WORK)} of the day, leisure only ${short(groupHours[LEAD])}`;
const say = (i) => `${ACTS[i].name}: ${short(ACTS[i].hours)} a day, ${percent.format(ACTS[i].hours / 24)} of the day`;

// The tape: three lengths of 8 hours. A length holds the part of each activity that falls inside its 8 hours.
const LENGTH = 8, PAD = 12, TAPE = 66;
const piecesOf = (r) => ACTS.flatMap((a, i) => {
  const lo = r * LENGTH, from = Math.max(a.from, lo), to = Math.min(a.to, lo + LENGTH);
  return to > from + 1e-6 ? [{ act: i, from: from - lo, to: to - lo, cont: a.from < lo }] : [];
});

// Labels go on the tape only where they fit, measured once the font is in; the key names every stretch
const LABEL_FONT = '700 100px "Barlow Condensed", Arial, sans-serif';
const [ems, setEms] = createSignal(null);
const [perHour, setPerHour] = createSignal(0);
const pen = document.createElement("canvas").getContext("2d");
document.fonts.load(LABEL_FONT).finally(() => {
  pen.font = LABEL_FONT;
  setEms(() => (text) => pen.measureText(text).width / 100);
});
const room = (d, text, size) => ems() != null && ems()(text) * size + 16 <= (d.to - d.from) * perHour();
const nameOf = (d) => (room(d, ACTS[d.act].short, 19) ? ACTS[d.act].short : "");
const timeOf = (d) => (!d.cont && nameOf(d) && room(d, short(ACTS[d.act].hours), 16) ? short(ACTS[d.act].hours) : "");

const THEME = {
  font: "var(--text)", ink: "var(--ink)", muted: "var(--soft)", grid: "var(--rule)", surface: "var(--paper)",
  series: ["var(--accent)", "var(--tint)"],
};

// Slat types
// A stretch of tape: a Bar from where the activity starts to where it ends, with its name and time inside when they fit
const Piece = slat({
  thickness: TAPE,
  room: { start: PAD, end: PAD },
  css: `
    .bar { pointer-events: auto; --rhp-start-radius: 0px; --rhp-end-radius: 0px; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px;
      padding: 0 8px 7px; overflow: hidden; cursor: pointer; color: var(--rhp-ink);
      box-shadow: inset 0 3px 0 var(--rhp-ink), inset 0 -3px 0 var(--rhp-ink), inset -3px 0 0 var(--rhp-ink); }
    .bar.first { box-shadow: inset 0 3px 0 var(--rhp-ink), inset 0 -3px 0 var(--rhp-ink), inset -3px 0 0 var(--rhp-ink), inset 3px 0 0 var(--rhp-ink); }
    .bar.on { color: var(--rhp-surface); }
    .nm { font: 700 19px/1 "Barlow Condensed", Arial, sans-serif; white-space: nowrap; }
    .tm { font: 600 16px/1 "Barlow Condensed", Arial, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bar:focus-visible { outline: 3px solid var(--rhp-ink); outline-offset: 2px; }
    @media (max-width: 640px) { .nm { font-size: 17px; } .tm { font-size: 14px; } }
  `,
}, (d) => html`
  <${Bar} from=${() => d.from} to=${() => d.to} color=${() => (d.on ? "series-1" : "series-2")} thick=${1}
    class=${() => `seg bar${d.on ? " on" : ""}${d.from === 0 ? " first" : ""}`}
    data-act=${() => d.act} role="button" aria-pressed=${() => d.on} aria-label=${() => say(d.act)}>
    <span class="nm">${() => nameOf(d)}</span><span class="tm">${() => timeOf(d)}</span>
  <//>`);

// The tape's printing: a hairline at every hour across the tape (so the hours can be counted), notches at the quarter
// hours, and a numeral above each hour
const Hour = slat({
  room: { start: PAD, end: PAD, before: 26 },
  css: `
    .line { --rhp-tick-width: 1.5px; background: color-mix(in oklab, var(--rhp-ink) 22%, transparent); pointer-events: none; }
    .notch { position: absolute; left: 0; top: 0; translate: -50% 0; width: 2px; background: var(--rhp-ink); pointer-events: none; }
    .notch.q { height: 6px; }
    .notch.h { height: 11px; }
    .num { position: absolute; left: 0; top: -22px; translate: -50% 0; font: 700 17px/1 "Barlow Condensed", Arial, sans-serif; color: var(--rhp-ink); font-variant-numeric: tabular-nums; pointer-events: none; }
  `,
}, (t) => {
  const whole = Math.abs(t.at - Math.round(t.at)) < 1e-6, half = Math.abs(t.at * 2 - Math.round(t.at * 2)) < 1e-6;
  return html`
    <div>
      ${whole ? html`<${Tick} at=${t.at} thick=${1} class="line" />` : null}
      <${Place} at=${t.at} across=${0}>
        <i class=${whole ? "notch h" : half ? "notch h" : "notch q"}></i>
        ${whole ? html`<span class="num">${t.at + t.base}</span>` : null}
      <//>
    </div>`;
});

// Chart component: section toggles and individual picks share one selection; hover only previews
function DayTape() {
  const members = GROUPS.map((_, g) => ACTS.flatMap((a, i) => a.group === g ? [i] : []));
  const [selected, setSelected] = createSignal(members[LEAD]);
  const [on, setOn] = createSignal(null);
  const lit = (i) => selected().includes(i);
  const shown = () => ACTS[on() ?? (selected().length === 1 ? selected()[0] : -1)];
  const allSelected = (g) => members[g].every((i) => selected().includes(i));
  const groupState = (g) => allSelected(g) ? "true" : members[g].some((i) => selected().includes(i)) ? "mixed" : "false";
  const selectedGroup = () => {
    const group = ACTS[selected()[0]]?.group;
    return group != null && selected().every((i) => ACTS[i].group === group) ? group : null;
  };
  const selectedHours = () => selected().reduce((sum, i) => sum + ACTS[i].hours, 0);

  // The activity of the element under the pointer or focus, or null
  const actOf = (el) => {
    const hit = el.closest?.("[data-act]");
    return hit ? +hit.dataset.act : null;
  };
  // Hover and keyboard focus inspect an activity without changing the selection
  const pick = (e) => {
    const act = actOf(e.target);
    if (act != null) setOn(act);
    else if (e.target.closest("[data-group]")) setOn(null);
  };
  const tap = (e) => {
    const heading = e.target.closest("[data-group]");
    if (heading) {
      const group = +heading.dataset.group;
      heading.focus({ preventScroll: true });
      const clear = allSelected(group);
      setSelected((now) => clear ? now.filter((i) => ACTS[i].group !== group)
        : ACTS.flatMap((a, i) => now.includes(i) || a.group === group ? [i] : []));
      setOn(null);
      return;
    }
    const act = actOf(e.target);
    if (act == null) return;
    setSelected((now) => now.includes(act) ? now.filter((i) => i !== act) : [...now, act].sort((a, b) => a - b));
    e.target.closest("[data-act]")?.focus({ preventScroll: true });
    setOn(null);
  };
  const key = (e) => {
    if (!e.target.closest(".seg") || (e.key !== "Enter" && e.key !== " ")) return;
    e.preventDefault();
    if (!e.repeat) tap(e);
  };
  // Leaving the poster: back to the keyboard's preview, or the committed selection
  const leave = (e) => {
    if (e.pointerType === "touch") return; // a finger sends pointerleave as it lifts after a tap
    const focused = document.activeElement;
    setOn(focused && e.currentTarget.contains(focused) && focused.matches(":focus-visible") ? actOf(focused) : null);
  };
  const move = (e) => e.pointerType !== "touch" && (e.target.closest(".tapes, .key") ? pick(e) : leave(e));

  const big = (hours) => {
    const m = minutes(hours);
    return m < 60 ? html`${m}<span>min</span>` : html`${Math.floor(m / 60)}<span>h</span>${String(m % 60).padStart(2, "0")}<span>min</span>`;
  };
  const share = (hours) => `${percent.format(hours / 24)} of the day`;

  // Watches the first tape's width: one hour is a fixed width, the same on all three tapes
  const measure = (el) => {
    const update = () => setPerHour((el.clientWidth - 2 * PAD) / LENGTH);
    new ResizeObserver(() => requestAnimationFrame(update)).observe(el);
    update();
  };

  return html`
    <${Poster}
      kicker="One day, 24 hours of tape"
      title=${HEADLINE}
      dek="The average American day as a tape measure cut into three lengths of 8 hours: each stretch is how long an activity takes in all, laid end to end, so read the numbers as hours used up, not as clock times. Point at or tap a stretch to read it."
      note=${NOTE}
      onPointerMove=${move} onClick=${tap} onFocusIn=${pick} onKeyDown=${key}
      onPointerLeave=${leave} onFocusOut=${(e) => !e.currentTarget.contains(e.relatedTarget) && setOn(null)}>
      <div class="readout" aria-live="polite">
        <b class="big">${() => big(shown() ? shown().hours : selectedHours())}</b>
        <span class="what">
          <strong>${() => shown() ? shown().name : selectedGroup() != null ? GROUPS[selectedGroup()] : selected().length ? "Selected activities" : "No activities selected"}</strong>
          <span class="detail">${() => shown() ? `${share(shown().hours)}, part of ${GROUPS[shown().group].toLowerCase()}` : selected().length
            ? selectedGroup() === LEAD && allSelected(LEAD) ? `${share(selectedHours())}, all four kinds of it together`
              : selectedGroup() != null ? `${share(selectedHours())}, ${selected().length} of ${members[selectedGroup()].length} activities selected`
                : `${share(selectedHours())}, ${selected().length} activities selected`
            : "Choose a section heading or an activity."}</span>
        </span>
      </div>
      <div class="tapes">
        ${[0, 1, 2].map((r) => html`
          <${Chart} scale=${[0, LENGTH]} height=${TAPE} ticks=${false} theme=${THEME} ref=${r === 0 ? measure : undefined}
            label=${`Hours ${r * LENGTH} to ${(r + 1) * LENGTH} of the day, by activity`}>
            <${Plot} overlap=${true} keyboard=${true} rows=${piecesOf(r)} on=${(d) => lit(d.act)}>${Piece}<//>
            <${Scale} ticks=${every(0.25)} base=${r * LENGTH} class="hours">${Hour}<//>
          <//>`)}
      </div>
      <div class="key" onPointerLeave=${leave}>
        ${GROUPS.map((g, gi) => html`
          <section>
            <h3><button type="button" data-group=${gi} aria-pressed=${() => groupState(gi)}>${g}<span>${short(groupHours[gi])}</span></button></h3>
            <ul>
              ${ACTS.map((x, i) => (x.group === gi ? html`
                <li><button type="button" data-act=${i} aria-pressed=${() => lit(i)} class=${() => (lit(i) ? "on" : "")}><i></i><span>${x.name}</span><b>${short(x.hours)}</b></button></li>` : null))}
            </ul>
          </section>`)}
      </div>
    <//>`;
}

render(() => html`<${DayTape} />`, document.getElementById("chart"));
</script>
<style id="poster-download-styles">
  .poster-download-tools { display: flex; justify-content: flex-end; align-items: center; margin: 0 auto 12px; max-width: 100%; }
  .poster-actions { position: relative; display: flex; align-items: center; margin-left: auto; }
  .poster-download, .poster-fit-toggle { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 44px; height: 44px; padding: 10px; border: 0; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
  .poster-actions svg { display: block; width: 20px; height: 20px; }
  .poster-actions button:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
  .poster-actions button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .poster-actions button[aria-disabled="true"] { cursor: progress; opacity: .5; }
  .poster-fit-frame, .poster-fit-content { display: contents; }
  .poster-fit-frame { max-height: 95svh; }
  .poster-fit-frame.is-fitted { display: block; margin: 0 auto; overflow: clip; }
  .poster-fit-frame.is-fitted > .poster-fit-content { display: block; transform-origin: top left; }
  .poster-download-error { margin: 8px auto; font: 14px/1.4 system-ui, sans-serif; color: inherit; }
  .poster-download-progress { font: 600 11px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .poster-download-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 20; display: grid; gap: 2px; min-width: 220px; padding: 6px; border: 1px solid color-mix(in srgb, currentColor 24%, transparent); border-radius: 8px; background: var(--poster-tools-ground, Canvas); box-shadow: 0 8px 24px rgb(0 0 0 / .28); }
  .poster-download-menu[hidden] { display: none; }
  .poster-download-menu button { display: grid; gap: 2px; width: 100%; padding: 8px 10px; border: 0; border-radius: 5px; background: none; color: inherit; font: 600 14px/1.3 system-ui, sans-serif; text-align: left; cursor: pointer; }
  .poster-download-menu button span { font-weight: 400; font-size: 12.5px; opacity: .8; }
  .poster-download-menu button:hover { background: color-mix(in srgb, currentColor 9%, transparent); }
  .poster-download-menu button:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
  @media print { .poster-download-tools, .poster-actions, .poster-download-menu, .poster-download-error { display: none !important; } }
</style>
<script type="module" id="poster-download-script">
function addPosterFit(poster, button, changed) {
  const frame = document.createElement('div'), content = document.createElement('div');
  frame.className = 'poster-fit-frame'; content.className = 'poster-fit-content';
  poster.before(frame); frame.append(content); content.append(poster);
  const properties = ['width', 'max-width', 'margin', 'box-sizing'];
  const original = properties.map(name => [name, poster.style.getPropertyValue(name), poster.style.getPropertyPriority(name)]);
  let fitted = false, scale = 1, request = 0, layout = null;
  const availableHeight = () => parseFloat(getComputedStyle(frame).maxHeight) || innerHeight * .95;
  const layoutKey = () => {
    const css = getComputedStyle(poster);
    return [innerWidth, availableHeight(), css.width, css.height].join('/');
  };
  const restore = () => original.forEach(([name, value, priority]) => {
