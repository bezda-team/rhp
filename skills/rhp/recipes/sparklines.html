<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richer since 1990</title>
<meta name="description" content="Sparkline table: one small line per item, each scaled to its own peak, with the start level dashed, and a scrub through the years (pointer, tap, a sideways drag or arrow keys) that moves a dot along every line and updates each item's value and its change since the start. Use it for many series side by side, a table of trends.">
<!--
  A recipe gives technique, not a design.
  Take: a Line in each slat scaled to itself, the start level dashed, numbers in columns, and a year scrub that moves a dot along every line.
  Leave: the design. This poster was made for its own subject (incomes since 1990 as a table page of a statistical yearbook, cream paper between a thick and a thin rule).
  Its look, the place of its parts and the way its marks are drawn say that subject: design yours from your own (design.md, section 2).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Libre+Franklin:wght@400..800&display=swap">
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px 16px; background: #d9d5cc; font-family: "Libre Franklin", "Helvetica Neue", Arial, sans-serif; }
  /* The poster: a table page from a statistical yearbook, cream paper between a thick and a thin rule */
  .poster { max-width: 900px; margin: 0 auto; padding: 40px 52px 28px; color: #1f1c17; border-top: 6px solid #1f1c17;
    background: linear-gradient(#1f1c17 0 0) 52px 10px / calc(100% - 104px) 1px no-repeat, #f7f3ea;
    box-shadow: 0 1px 2px rgb(50 44 34 / .18), 0 26px 50px -28px rgb(50 44 34 / .55); }
  .poster figcaption { display: grid; gap: 12px; margin-bottom: 22px; }
  .poster .kicker { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #a3360d; }
  .poster .headline { max-width: 15em; font: 700 48px/1.05 "Libre Caslon Text", Georgia, serif; letter-spacing: -.015em; text-wrap: balance; }
  .poster .dek { max-width: 58ch; font-size: 16px; line-height: 1.55; color: #4c463d; }
  .poster .dek i { display: inline-block; width: 18px; margin: 0 3px; border-top: 1.5px dashed #6b645a; vertical-align: 4px; }
  .poster .note { display: block; margin-top: 18px; padding-top: 10px; border-top: 1px solid #d9d2c4; font-size: 12px; line-height: 1.5; color: #6b645a; }
  /* The table's head: the year being read, and what the two number columns hold */
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; margin: 0 0 6px; padding: 8px 0;
    border-block: 1px solid #1f1c17; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #6b645a; }
  .head b { font: 700 26px/1 "Libre Caslon Text", Georgia, serif; letter-spacing: 0; color: #1f1c17; font-variant-numeric: tabular-nums; }
  .head b:focus-visible { outline: 2px solid #c2410c; outline-offset: 4px; border-radius: 2px; }
  .plot { touch-action: pan-y; } /* a finger dragging sideways moves through the years; up and down still scrolls */
  /* On a phone the table is taller than half the screen: its head, with the year, stays at the top of the screen while
     the lines scroll under it */
  @media (max-width: 600px) {
    body { padding: 16px 16px 32px; }
    .poster { padding: 30px 16px 18px; background-position: 16px 8px, 0 0; background-size: calc(100% - 32px) 1px, auto; }
    .poster .headline { font-size: 32px; }
    .poster .dek { font-size: 15px; }
    .head { position: sticky; top: 0; z-index: 2; background: #f7f3ea; font-size: 11px; }
    .head b { font-size: 22px; }
  }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Line, Dot, Tick, Label, Poster, slat, sortBy, html, render, createSignal } from "@bezda/rhp/standalone";

// Data: GDP per person from 1990 to 2024, in constant 2021 international dollars (adjusted for prices and for what
// money buys in each country), World Bank via Our World in Data. Replace with your own rows: one value per year each.
const FIRST = 1990;
const COUNTRIES = [
  { name: "China", gdp: [1667, 1798, 2030, 2287, 2557, 2808, 3056, 3306, 3534, 3774, 4066, 4372, 4744, 5192, 5684, 6298, 7057, 8014, 8744, 9519, 10476, 11405, 12218, 13081, 13969, 14857, 15773, 16758, 17807, 18821, 19215, 20843, 21499, 22687, 23841] },
  { name: "Vietnam", gdp: [2468, 2561, 2726, 2890, 3090, 3328, 3584, 3820, 3983, 4119, 4349, 4570, 4810, 5090, 5421, 5776, 6098, 6419, 6659, 6914, 7275, 7653, 7980, 8324, 8752, 9248, 9743, 10291, 10937, 11629, 11851, 12049, 12980, 13535, 14396] },
  { name: "India", gdp: [2140, 2116, 2185, 2241, 2342, 2469, 2603, 2656, 2766, 2954, 3010, 3097, 3157, 3347, 3551, 3770, 4011, 4254, 4322, 4595, 4914, 5099, 5304, 5567, 5905, 6302, 6741, 7116, 7493, 7702, 7187, 7819, 8347, 8871, 9416] },
  { name: "South Korea", gdp: [14378, 15784, 16613, 17596, 19052, 20698, 22140, 23311, 22000, 24382, 26404, 27441, 29395, 30142, 31580, 32886, 34430, 36257, 37064, 37176, 39574, 40719, 41538, 42710, 43807, 44849, 46088, 47537, 48834, 49791, 49374, 51718, 53229, 54029, 55071] },
  { name: "Poland", gdp: [12821, 11880, 12141, 12563, 13200, 14228, 15083, 16032, 16767, 17556, 18566, 18801, 19167, 19856, 20879, 21569, 22921, 24484, 25554, 26204, 27112, 28522, 28953, 29169, 30335, 31700, 32675, 34355, 36500, 38182, 37853, 41060, 43405, 43673, 45153] },
  { name: "Ethiopia", gdp: [874, 778, 681, 744, 741, 760, 827, 826, 773, 788, 810, 851, 838, 796, 877, 952, 1025, 1109, 1194, 1262, 1381, 1493, 1577, 1697, 1821, 1957, 2085, 2223, 2311, 2438, 2517, 2588, 2656, 2758, 2892] },
  { name: "United States", gdp: [44384, 43748, 44665, 45293, 46543, 47227, 48442, 49991, 51626, 53481, 55046, 55024, 55443, 56505, 58139, 59612, 60684, 61314, 60806, 58722, 59797, 60253, 61142, 61967, 63027, 64368, 65026, 66164, 67728, 69121, 67407, 71441, 72829, 74352, 75698] },
  { name: "Japan", gdp: [36138, 37226, 37403, 37089, 37353, 38138, 39222, 39662, 38853, 38647, 39732, 39749, 39690, 40152, 40987, 41740, 42359, 43042, 42519, 40000, 41647, 41641, 42395, 43304, 43754, 44589, 44927, 45693, 46133, 46055, 44213, 45999, 46819, 47387, 47480] },
  { name: "Italy", gdp: [42657, 43283, 43614, 43216, 44137, 45410, 46008, 46869, 47701, 48494, 50353, 51332, 51369, 51126, 51495, 51586, 52304, 52747, 51806, 48774, 49302, 49473, 47796, 46833, 46826, 47312, 47988, 48849, 49356, 49691, 45505, 49825, 52333, 52843, 53285] },
  { name: "Ukraine", gdp: [22816, 20784, 18672, 16012, 12411, 10983, 9970, 9754, 9646, 9704, 10364, 11379, 12093, 13343, 15021, 15611, 16902, 18374, 18884, 16093, 16812, 17784, 17849, 17889, 16979, 15404, 15857, 16310, 16979, 17637, 17093, 17846, 13787, 15917, 16371] },
];

const YEARS = COUNTRIES[0].gdp.map((_, i) => FIRST + i);
const LAST = YEARS.at(-1);
const INSET = 0.2; // the empty share of each slat's band, half above and half below its line
const dollars = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const times = new Intl.NumberFormat("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
// Where a value sits across its slat: a Line in a slat draws 0 at the bottom of its band and the peak at the top
const across = (value, peak) => INSET / 2 + (1 - INSET) * (1 - value / peak);

// Slat types
// A country: its name, its line (scaled to its own peak, over a hairline at zero), its 1990 level dashed, a dot at the
// year being read, and that year's value with how many times its 1990 value it is
const Country = slat({
  thickness: 44,
  inset: INSET,
  room: "auto",
  css: `
    .country { background: linear-gradient(var(--rhp-grid) 0 0) 0 ${(1 - INSET / 2) * 100}% / 100% 1px no-repeat; }
    .name { font-size: 14px; font-weight: 700; --rhp-label-gap: 14px; }
    .spark { stroke-width: 1.75px; }
    .start path { stroke-dasharray: 3 3; }
    .now { background: #c2410c; box-shadow: 0 0 0 2px #f7f3ea; }
    .numbers { display: flex; justify-content: flex-end; align-items: baseline; gap: 10px; justify-self: stretch; font-variant-numeric: tabular-nums; --rhp-label-gap: 14px; }
    .numbers b { font-size: 14px; font-weight: 700; }
    .numbers span { min-width: 3.2em; font-size: 13px; font-weight: 600; color: var(--rhp-muted); text-align: right; }
    .poorer .numbers span { color: #b42318; }
    @container (max-width: 520px) {
      .name { font-size: 13px; --rhp-label-gap: 10px; }
      .numbers { flex-direction: column; align-items: flex-end; gap: 1px; line-height: 1.15; --rhp-label-gap: 10px; }
      .numbers b { font-size: 13px; }
      .numbers span { font-size: 12px; }
    }
  `,
}, (d) => html`
  <div class=${() => (d.gdp[d.i] < d.gdp[0] ? "country poorer" : "country")}
    aria-label=${() => `${d.name}: ${dollars.format(d.gdp[d.i])} a person in ${d.year}, ${times.format(d.gdp[d.i] / d.gdp[0])} times its ${FIRST} level`}>
    <${Label} edge="start" class="name">${() => d.name}<//>
    <${Line} points=${() => d.gdp.map((v, i) => [FIRST + i, v])} peak=${() => d.peak} color="ink" class="spark" />
    <${Line} points=${() => [[FIRST, d.gdp[0]], [LAST, d.gdp[0]]]} peak=${() => d.peak} color="muted" class="start" />
    <${Dot} at=${() => d.year} across=${() => across(d.gdp[d.i], d.peak)} size="7px" class="now" />
    <${Label} edge="end" class="numbers"><b>${() => dollars.format(d.gdp[d.i])}</b><span>${() => times.format(d.gdp[d.i] / d.gdp[0]) + "×"}</span><//>
  </div>`);

// The year being read: a hairline down every slat
const Crosshair = slat({ room: {}, css: `.hair { --rhp-tick-width: 1px; background: #c2410c; opacity: .55; }` }, (d) => html`
  <${Tick} at=${() => d.year} thick=${1} class="hair" />`);

// Chart component: hovering previews a year; a click, tap, sideways drag or the arrow keys saves it for every slat.
// With no saved year, the latest shows. The year in the table's head is a slider for the keyboard and screen readers.
function RicherSince1990() {
  const [picked, setPicked] = createSignal(null);
  const [hovered, setHovered] = createSignal(null);
  const i = () => hovered() ?? picked() ?? YEARS.length - 1;
  // The year under the pointer, measured on a line (every line runs from the first year to the last), or null beside it
  const point = (e) => {
    const r = e.currentTarget.querySelector(".spark").getBoundingClientRect();
    const k = Math.round(((e.clientX - r.left) / r.width) * (YEARS.length - 1));
    return k >= 0 && k < YEARS.length ? k : null;
  };
  const pick = (e) => {
    const k = point(e);
    if (k == null) return;
    setPicked(k);
    setHovered(null);
  };
  const STEPS = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1, PageDown: -10, PageUp: 10, Home: -Infinity, End: Infinity };
  const key = (e) => {
    if (!(e.key in STEPS)) return;
    e.preventDefault();
    setPicked(Math.max(0, Math.min(YEARS.length - 1, i() + STEPS[e.key])));
    setHovered(null);
  };
  let start = [0, 0]; // where the last finger went down
  // A finger that moves more sideways than up or down scrubs; one that moves up or down scrolls the page
  const sideways = (e) => Math.abs(e.clientX - start[0]) > Math.abs(e.clientY - start[1]);
  // Leaving the lines ends the preview and restores the saved year; a finger lifting after a tap keeps its selection
  const leave = (e) => e.pointerType !== "touch" && setHovered(null);
  const said = () => `${YEARS[i()]}: ` + COUNTRIES.map((c) => `${c.name} ${dollars.format(c.gdp[i()])}`).join(", ");
  return html`
    <${Poster}
      kicker=${`Income per person, ${FIRST} to ${LAST}`}
      title="China's income per person is 14 times what it was in 1990"
      dek=${html`<span>GDP per person in ten countries, adjusted for prices. Each line rises from zero, the hairline under it, to its own peak, and its dashes <i></i> mark its ${FIRST} level: Ukraine is still below it, and Japan and Italy barely rose above it.</span>`}
      note="Source: World Bank, GDP per person in constant 2021 international dollars (purchasing power parity), via Our World in Data, retrieved 2026. Point at a year to preview it, click or tap to keep it, drag across the lines, or Tab to the year and use the arrow keys.">
      <p class="head">
        <b tabindex="0" role="slider" aria-label="Year read on every line" aria-valuemin=${FIRST} aria-valuemax=${LAST}
          aria-valuenow=${() => YEARS[i()]} aria-valuetext=${said} onKeyDown=${key}>${() => YEARS[i()]}</b>
        <span aria-hidden="true">GDP per person · × its ${FIRST} level</span>
      </p>
      <div class="plot" onPointerDown=${(e) => (start = [e.clientX, e.clientY])}
        onPointerMove=${(e) => e.pointerType === "touch" ? sideways(e) && pick(e) : setHovered(point(e))} onClick=${pick} onPointerLeave=${leave}>
        <!-- half a year past each end, so each year's column is centered on it -->
        <${Chart} scale=${[FIRST - 0.5, LAST + 0.5]} ticks=${YEARS.filter((y) => y % 10 === 0)}
          label=${`GDP per person in ten countries, ${FIRST} to ${LAST}, each line scaled to its own peak`}
          theme=${{ font: '"Libre Franklin", "Helvetica Neue", Arial, sans-serif', ink: "#1f1c17", muted: "#6b645a", grid: "#e2dccf" }}>
          <${Plot} rows=${COUNTRIES} peak=${(d) => Math.max(...d.gdp)} growth=${(d) => d.gdp.at(-1) / d.gdp[0]}
            order=${sortBy("growth", "desc")} year=${() => YEARS[i()]} i=${i}>${Country}<//>
          <${Plot} overlap=${true} slats=${1} year=${() => YEARS[i()]} style=${{ "pointer-events": "none" }}>${Crosshair}<//>
        <//>
      </div>
    <//>`;
}

render(() => html`<${RicherSince1990} />`, document.getElementById("chart"));
</script>
<style id="poster-download-styles">
  .poster-download-tools { display: flex; justify-content: flex-end; align-items: center; margin: 0 auto 12px; max-width: 100%; }
  .poster-actions { display: flex; align-items: center; margin-left: auto; }
  .poster-download, .poster-fit-toggle { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 44px; height: 44px; padding: 10px; border: 0; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
  .poster-actions svg { display: block; width: 20px; height: 20px; }
  .poster-actions button:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
  .poster-actions button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .poster-actions button[aria-disabled="true"] { cursor: progress; opacity: .5; }
  .poster-fit-frame, .poster-fit-content { display: contents; }
  .poster-fit-frame { max-height: 95svh; }
  .poster-fit-frame.is-fitted { display: block; margin: 0 auto; overflow: clip; }
  .poster-fit-frame.is-fitted > .poster-fit-content { display: block; transform-origin: top left; }
  .poster-download-error { margin: 8px auto; font: 14px/1.4 system-ui, sans-serif; color: inherit; }
  @media print { .poster-download-tools, .poster-actions, .poster-download-error { display: none !important; } }
</style>
<script type="module" id="poster-download-script">
function addPosterFit(poster, button, changed) {
  const frame = document.createElement('div'), content = document.createElement('div');
  frame.className = 'poster-fit-frame'; content.className = 'poster-fit-content';
  poster.before(frame); frame.append(content); content.append(poster);
  const properties = ['width', 'max-width', 'margin', 'box-sizing'];
  const original = properties.map(name => [name, poster.style.getPropertyValue(name), poster.style.getPropertyPriority(name)]);
  let fitted = false, scale = 1, request = 0, layout = null;
  const availableHeight = () => parseFloat(getComputedStyle(frame).maxHeight) || innerHeight * .95;
  const layoutKey = () => {
    const css = getComputedStyle(poster);
    return [innerWidth, availableHeight(), css.width, css.height].join('/');
  };
  const restore = () => original.forEach(([name, value, priority]) => {
    if (value) poster.style.setProperty(name, value, priority);
    else poster.style.removeProperty(name);
  });
  function update() {
    request = 0;
    if (fitted && layout === layoutKey()) return;
    frame.classList.remove('is-fitted'); frame.style.width = ''; frame.style.height = '';
    content.style.width = ''; content.style.transform = ''; restore(); scale = 1;
    if (fitted) {
      const box = poster.getBoundingClientRect();
      scale = Math.min(1, availableHeight() / box.height);
      poster.style.setProperty('box-sizing', 'border-box');
      poster.style.setProperty('width', `${box.width}px`);
      poster.style.setProperty('max-width', 'none');
      poster.style.setProperty('margin', '0');
      content.style.width = `${box.width}px`;
      content.style.transform = `scale(${scale})`;
      frame.style.width = `${box.width * scale}px`; frame.style.height = `${box.height * scale}px`;
      frame.classList.add('is-fitted');
    }
    layout = layoutKey();
    const label = fitted ? 'Restore poster size' : 'Fit poster to screen';
    button.setAttribute('aria-label', label); button.title = label;
    button.setAttribute('aria-pressed', String(fitted));
    button.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${fitted ? 'M15 3h6v6m0-6-7 7M9 21H3v-6m0 6 7-7' : 'M4 4l6 6m0-6v6H4m16 10-6-6m0 6v-6h6'}"/></svg>`;
    changed();
    poster.dispatchEvent(new Event('poster-view-change'));
  }
  const schedule = () => { if (fitted && !request && layout !== layoutKey()) request = requestAnimationFrame(update); };
  new ResizeObserver(schedule).observe(poster);
  addEventListener('resize', schedule);
  document.fonts.ready.then(schedule);
  update();
  return {
    toggle() { fitted = !fitted; layout = null; cancelAnimationFrame(request); update(); },
    dimensions() {
      if (!fitted) { const box = poster.getBoundingClientRect(); return {width:box.width,height:box.height}; }
      const css = getComputedStyle(poster);
      return {width:parseFloat(css.width),height:parseFloat(css.height)};
    },
  };
}
function addPosterDownloads() {
  document.querySelectorAll('.poster').forEach((poster, index) => {
    const navigation = index === 0 && document.querySelector('.recipe-navigation');
    const tools = navigation || document.createElement('div');
    if (tools.querySelector('.poster-download')) return;
    const align = () => { if (!navigation) tools.style.width = `${poster.getBoundingClientRect().width}px`; };
    if (!navigation) {
      tools.className = 'poster-download-tools';
      poster.before(tools);
      new ResizeObserver(align).observe(poster);
      align();
      const rgb = getComputedStyle(document.body).backgroundColor.match(/[\d.]+/g);
      if (rgb) {
        const light = rgb.slice(0, 3).map(Number).map(v => {
          v /= 255;
          return v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4;
        });
        tools.style.color = light[0] * .2126 + light[1] * .7152 + light[2] * .0722 < .179 ? '#eef2f5' : '#1d1b17';
      }
    }
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'poster-download';
    button.setAttribute('aria-label', 'Download poster as PNG');
    button.title = 'Download poster as PNG';
    button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></svg>';
    const actions = document.createElement('div'), fitButton = document.createElement('button');
    actions.className = 'poster-actions'; fitButton.className = 'poster-fit-toggle'; fitButton.type = 'button';
    if (!poster.id) {
      let id = `rhp-poster-${index + 1}`;
      while (document.getElementById(id)) id += '-view';
      poster.id = id;
    }
    fitButton.setAttribute('aria-controls', poster.id);
    fitButton.setAttribute('data-poster-view-toggle', '');
    const fit = addPosterFit(poster, fitButton, align);
    fitButton.addEventListener('click', event => { event.stopPropagation(); if (!busy) fit.toggle(); });
    actions.append(fitButton, button);
    const error = document.createElement('p');
    error.className = 'poster-download-error';
    error.setAttribute('role', 'alert');
    error.hidden = true;
    tools.after(error);
    // Download is part of the poster interaction, even though its control sits outside the image.
    actions.addEventListener('pointerdown', event => {
      event.stopPropagation();
    });
    actions.addEventListener('mousedown', event => {
      // Pointer activation downloads without taking focus from the selected chart item.
      event.preventDefault();
      event.stopPropagation();
    });
    poster.addEventListener('focusout', event => {
      if (actions.contains(event.relatedTarget) || actions.querySelector(':active')) event.stopImmediatePropagation();
    }, true);
    poster.addEventListener('pointerleave', event => {
      if (actions.contains(event.relatedTarget) || actions.contains(document.activeElement)) event.stopImmediatePropagation();
    }, true);
    poster.addEventListener('pointermove', event => {
      // Safari can move the pointer over the title while a keyboard-triggered download is being prepared.
      if (actions.contains(document.activeElement) && !event.target.closest('.rhp-chart')) event.stopImmediatePropagation();
    }, true);
    for (const type of ['keydown', 'keyup']) actions.addEventListener(type, event => {
      if (event.key === 'Enter' || event.key === ' ') event.stopPropagation();
    });
    let exporter, retries = 0, busy = false;
    button.addEventListener('click', async event => {
      event.stopPropagation();
      if (busy) return;
      busy = true;
      button.setAttribute('aria-disabled', 'true');
      button.setAttribute('aria-busy', 'true');
      fitButton.setAttribute('aria-disabled', 'true');
      button.setAttribute('aria-label', 'Preparing poster PNG');
      error.hidden = true;
      let url;
      try {
        exporter ||= import('https://cdn.jsdelivr.net/npm/modern-screenshot@4.7.0/+esm' + (retries ? `?retry=${retries}` : ''));
        const { domToBlob } = await exporter;
        await document.fonts.ready;
        // Preserve author layout rules where computed styles lose the grid's used geometry.
        // Safari misreports percentage insets in subgrids, and grid auto margins resolve to zero.
        const autoMargins = new Set(), positioned = new Set();
        const isMargin = name => name === 'margin' || name.startsWith('margin-');
        const isInset = name => name === 'inset' || name.startsWith('inset-') || ['top', 'right', 'bottom', 'left'].includes(name);
        const layoutRules = rules => [...rules].map(rule => {
          if (rule.selectorText && rule.style) {
            const margins = [...rule.style].filter(isMargin);
            if (margins.some(name => /\bauto\b/.test(rule.style.getPropertyValue(name)))) autoMargins.add(rule.selectorText);
            const insets = [...rule.style].filter(isInset);
            if (insets.length) positioned.add(rule.selectorText);
            const layout = [...margins, ...insets];
            return layout.length ? `${rule.selectorText} { ${layout.map(name => `${name}: ${rule.style.getPropertyValue(name)}${rule.style.getPropertyPriority(name) ? ' !important' : ''};`).join(' ')} }` : '';
          }
          if (!rule.cssRules) return /^@layer\b/.test(rule.cssText) ? rule.cssText : '';
          if (rule instanceof CSSMediaRule) return matchMedia(rule.conditionText).matches ? layoutRules(rule.cssRules) : '';
          if (rule instanceof CSSSupportsRule) return CSS.supports(rule.conditionText) ? layoutRules(rule.cssRules) : '';
          return rule.cssText.slice(0, rule.cssText.indexOf('{') + 1) + layoutRules(rule.cssRules) + '}';
        }).join('\n');
        const sheets = [...document.styleSheets, ...document.adoptedStyleSheets];
        const layout = sheets.map(sheet => {
          try { return layoutRules(sheet.cssRules); } catch (cause) { return ''; }
        }).join('\n');
        // Omit display-none HTML subtrees, such as collapsed chart rows, from the image and its SVG payload.
        const includeNode = node => !(node instanceof HTMLElement) || getComputedStyle(node).display !== 'none';
        const restoreLayout = (source, clone) => {
          if (clone.style && source !== poster) {
            const margins = [...autoMargins].some(selector => source.matches(selector));
            const computed = getComputedStyle(source);
            const insets = computed.position === 'absolute' && [...positioned].some(selector => source.matches(selector));
            const restore = name => (margins && isMargin(name)) || (insets && isInset(name));
            [...clone.style].filter(restore).forEach(name => clone.style.removeProperty(name));
            [...source.style].filter(restore).forEach(name => clone.style.setProperty(name, source.style.getPropertyValue(name), source.style.getPropertyPriority(name)));
            if (insets) {
              // Only the scaled axis needs its percentage rule. Freeze the other axis in pixels:
              // Firefox does not reevaluate container queries reliably inside an SVG foreignObject.
              const axis = source.getAttribute('data-rhp-o');
              const fixed = axis === 'h' ? ['top', 'bottom'] : axis === 'v' ? ['left', 'right'] : ['top', 'right', 'bottom', 'left'];
              fixed.forEach(name => clone.style.setProperty(name, computed.getPropertyValue(name), 'important'));
            }
          }
          const children = [...source.children].filter(node => !['STYLE', 'SCRIPT'].includes(node.tagName) && includeNode(node));
          [...clone.children].forEach((child, i) => { if (children[i]) restoreLayout(children[i], child); });
        };
        // Cross-origin font stylesheets are readable through fetch, but not through cssRules.
        const fontFiles = new Map();
        const fontRules = await Promise.all(sheets.map(async sheet => {
          let css;
          try { css = [...sheet.cssRules].map(rule => rule.cssText).join('\n'); }
          catch (cause) {
            if (!sheet.href) return '';
            const response = await fetch(sheet.href);
            if (!response.ok) throw new Error('Font stylesheet could not be loaded');
            css = await response.text();
          }
          const rules = css.match(/@font-face\s*\{[^}]*\}/g) || [];
          return (await Promise.all(rules.map(async rule => {
            for (const match of [...rule.matchAll(/url\(["']?([^"')]+)["']?\)/g)]) {
              const source = new URL(match[1], sheet.href || document.baseURI).href;
              if (!fontFiles.has(source)) fontFiles.set(source, (async () => {
                const response = await fetch(source);
                if (!response.ok) throw new Error('Font could not be loaded');
                const blob = await response.blob();
                return new Promise((resolve, reject) => {
                  const reader = new FileReader();
                  reader.onload = () => resolve(reader.result);
                  reader.onerror = reject;
                  reader.readAsDataURL(blob);
                });
              })());
              rule = rule.replace(match[1], await fontFiles.get(source));
            }
            return rule;
          }))).join('\n');
        }));
        // Rasterize SVG paper textures before nesting them inside the exporter's SVG.
        // This keeps SVG filter fragment references local to their own image.
        const textures = new Map();
        const embedTexture = async (node) => {
          if (!node.style) return;
          let background = node.style.backgroundImage;
          for (const [, source] of background.matchAll(/url\("(data:image\/svg\+xml[^"]+)"\)/g)) {
            if (!textures.has(source)) textures.set(source, (async () => {
              const image = new Image();
              image.src = source;
              await image.decode();
              const canvas = document.createElement('canvas');
              canvas.width = image.naturalWidth;
              canvas.height = image.naturalHeight;
              canvas.getContext('2d').drawImage(image, 0, 0);
              return canvas.toDataURL();
            })());
            background = background.replace(source, await textures.get(source));
          }
          node.style.backgroundImage = background;
        };
        const blob = await domToBlob(poster, {
          ...fit.dimensions(), scale: 2, style: { margin: '0' }, filter: includeNode,
          font: { cssText: fontRules.join('\n') }, onCloneEachNode: embedTexture,
          onCloneNode: clone => {
            restoreLayout(poster, clone);
            const style = document.createElement('style');
            style.textContent = layout;
            clone.prepend(style);
          },
          // CSS content's alternative text follows a slash and must not be painted.
          onCreateForeignObjectSvg: svg => svg.querySelectorAll('style').forEach(style => {
            style.textContent = style.textContent.replace(/(content:\s*')([^']*)(')/g, (_, start, text, end) => start + text.split(' / ')[0] + end);
          }),
        });
        if (!blob) throw new Error('No PNG was created');
        url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const title = poster.querySelector('.headline')?.textContent || document.title || 'poster';
        link.download = (title.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 100) || 'poster') + '.png';
        link.href = url;
        link.addEventListener('click', event => event.stopPropagation(), { once: true });
        document.body.append(link);
        link.click();
        link.remove();
      } catch (cause) {
        exporter = null;
        retries++;
        error.textContent = 'The PNG could not be saved. Check your connection and try again.';
        error.hidden = false;
      } finally {
        if (url) setTimeout(() => URL.revokeObjectURL(url), 60000);
        busy = false;
        button.removeAttribute('aria-disabled');
        button.removeAttribute('aria-busy');
        fitButton.removeAttribute('aria-disabled');
        button.setAttribute('aria-label', 'Download poster as PNG');
      }
    });
    tools.append(actions);
  });
}
// A chart module may await fonts or data after DOMContentLoaded has already fired.
if (document.querySelector('.poster')) addPosterDownloads();
else {
  const observer = new MutationObserver(() => {
    if (!document.querySelector('.poster')) return;
    observer.disconnect();
    addPosterDownloads();
  });
  observer.observe(document.getElementById('chart') || document.body, { childList: true, subtree: true });
}
</script>
</body>
</html>
