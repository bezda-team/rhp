<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Eight occupations, two pay packets. An interactive dumbbell chart of illustrative median weekly earnings for women and men.">
<title>The gender pay gap, by occupation</title>
<script type="importmap">{"imports":{"@bezda/rhp/standalone":"https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js"}}</script>
<style>
  :root { color-scheme: light; --page: #e4e5e3; --paper: #faf9f6; --ink: #202a31; --soft: #535b60; --red: #d10b16; --rule: #d5d6d3; --font: "Helvetica Neue", Helvetica, Arial, sans-serif; --pitch: 62px; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 24px; background: var(--page); color: var(--ink); font-family: var(--font); }
  .poster { position: relative; max-width: 1000px; margin: 0 auto; padding: 34px 44px 26px; background: var(--paper); border-top: 2px solid var(--red); box-shadow: 0 4px 24px #202a3110; }
  .poster::before { content: ""; position: absolute; left: 44px; top: -2px; width: 58px; height: 9px; background: var(--red); }
  .poster figcaption { display: grid; gap: 14px; margin-bottom: 24px; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--red); }
  .headline { max-width: 760px; font-size: clamp(34px, 4.6vw, 54px); font-weight: 700; line-height: 1.04; letter-spacing: -.035em; text-wrap: balance; }
  .dek { max-width: 690px; font-size: 17px; line-height: 1.45; color: var(--soft); }
  .chart-meta { display: flex; justify-content: space-between; align-items: end; gap: 16px; padding: 16px 0 13px; border-top: 1px solid var(--ink); }
  .measure { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.4; }
  .measure span { display: block; font-size: 13px; font-weight: 400; color: var(--soft); }
  .key { display: flex; gap: 20px; margin: 0; font-size: 14px; white-space: nowrap; }
  .key span { display: inline-flex; gap: 7px; align-items: center; }
  .key i { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
  .key .men { background: var(--ink); }
  .hint { margin: 0 0 10px; font-size: 12px; line-height: 1.5; color: var(--soft); }
  .readout { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; min-height: 74px; margin-top: 20px; padding: 12px 0; background: var(--paper); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
  .readout-name { display: block; font-size: 15px; font-weight: 700; }
  .readout-detail { display: block; margin-top: 4px; font-size: 13px; color: var(--soft); }
  .readout-number { color: var(--red); font-size: 30px; line-height: 1; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .readout-number small { display: block; margin-top: 5px; color: var(--soft); font-size: 11px; letter-spacing: 0; font-weight: 400; text-align: right; }
  .note { display: block; margin-top: 16px; max-width: 760px; font-size: 12px; line-height: 1.5; color: var(--soft); }
  .error { max-width: 650px; margin: 40px auto; line-height: 1.5; }
  @media (max-width: 640px) {
    :root { --pitch: 78px; }
    body { padding: 16px 10px; }
    .poster { padding: 26px 18px 20px; }
    .poster::before { left: 18px; width: 44px; }
    .poster figcaption { gap: 12px; margin-bottom: 18px; }
    .headline { font-size: 35px; }
    .dek { font-size: 15px; }
    .chart-meta { align-items: start; flex-direction: column; gap: 12px; }
    .readout { min-height: 94px; gap: 8px; }
    .readout-name { font-size: 14px; max-width: 215px; }
    .readout-detail { font-size: 12px; max-width: 205px; line-height: 1.4; }
    .readout-number { font-size: 27px; }
  }
  @media print {
    body { padding: 0; background: white; }
    .poster { max-width: none; box-shadow: none; break-inside: avoid; }
    .readout { position: static; }
    .hint { display: none; }
    @page { size: portrait; margin: 10mm; }
  }
</style>
</head>
<body>
<main id="chart"><p class="error">Loading the earnings chart…</p></main>
<noscript>This interactive chart requires JavaScript.</noscript>
<script type="module">
import { Chart, Plot, Bar, Dot, Label, Poster, slat, nice, html, render, createSignal } from "@bezda/rhp/standalone";

// Data: illustrative median weekly earnings in US dollars, supplied for this poster.
const DATA = [
  { name: "Software developers", women: 1850, men: 2100 },
  { name: "Lawyers", women: 1880, men: 2450 },
  { name: "Physicians", women: 1950, men: 2800 },
  { name: "Registered nurses", women: 1400, men: 1550 },
  { name: "Elementary school teachers", women: 1150, men: 1250 },
  { name: "Accountants", women: 1300, men: 1600 },
  { name: "Retail salespersons", women: 650, men: 820 },
  { name: "Chefs and head cooks", women: 700, men: 850 }
];
const ROWS = DATA.map(d => ({ ...d, gap: d.men - d.women, percent: (d.men - d.women) / d.men * 100 })).sort((a, b) => b.gap - a.gap);
const values = ROWS.flatMap(d => [d.women, d.men]);
const range = nice(Math.min(0, ...values), Math.max(0, ...values));
const number = new Intl.NumberFormat("en-US");
const dollars = n => "$" + number.format(n);
const percent = new Intl.NumberFormat("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const description = d => `${d.name}: women ${dollars(d.women)}, men ${dollars(d.men)} per week. Gap ${dollars(d.gap)}, or ${percent.format(d.percent)}% of men's earnings.`;

// Slat: the occupation, two directly labelled dots and a connecting rule.
const Occupation = slat({
  thickness: "var(--pitch)",
  room: { start: "auto", end: 38 },
  css: `
    .occupation { border-bottom: 1px solid #e6e6e2; cursor: pointer; }
    .occupation.on { background: #f0eeea; }
    .occupation:focus-visible { outline: 2px solid #202a31; outline-offset: -2px; }
    .name { width: 214px; max-width: 214px; white-space: normal; text-align: left; line-height: 1.25; font-size: 15px; --rhp-label-gap: 18px; }
    .on .name, .on .mobile-name { font-weight: 700; }
    .mobile-name { display: none; }
    .inline-gap { display: none; position: absolute; right: 0; bottom: 3px; font-size: 11px; line-height: 1.2; color: #535b60; }
    .on .inline-gap { display: block; }
    .span { --rhp-radius: 0px; }
    .value { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; --rhp-label-gap: 10px; }
    .women-value { color: #bd0b16; }
    .on .value { font-weight: 700; }
    @media (max-width: 640px) {
      .name { display: none; width: 0; --rhp-label-gap: 0px; }
      .mobile-name { display: block; position: absolute; top: 7px; left: 0; font-size: 13px; line-height: 1.2; white-space: nowrap; }
      .value { font-size: 12px; --rhp-label-gap: 8px; top: 59%; }
      .span, .point { top: 59%; }
    }
  `
}, d => html`
  <div class=${() => d.on ? "occupation on" : "occupation"} data-row=${() => d.index} aria-label=${() => description(d)}>
    <${Label} edge="start" class="name">${() => d.name}<//>
    <span class="mobile-name" aria-hidden="true">${() => d.name}</span>
    <${Bar} from=${() => d.women} to=${() => d.men} thick="2px" color="#82898c" class="span" />
    <${Dot} at=${() => d.women} size="10px" color="#d10b16" class="point" />
    <${Dot} at=${() => d.men} size="10px" color="#202a31" class="point" />
    <${Label} at=${() => d.women} side="before" class="value women-value">${() => number.format(d.women)}<//>
    <${Label} at=${() => d.men} class="value">${() => number.format(d.men)}<//>
    <span class="inline-gap" aria-hidden="true">${() => `${dollars(d.gap)} gap · ${percent.format(d.percent)}% less`}</span>
  </div>`);

// Chart component: a pick exposes the dollar gap and the gap relative to men's earnings.
function EarningsPoster() {
  const [on, setOn] = createSignal(null);
  const current = () => ROWS[on() ?? 0];
  const rowOf = el => {
    const row = el?.closest?.("[data-row]");
    return row ? Number(row.dataset.row) : null;
  };
  const pick = e => { const row = rowOf(e.target); if (row != null) setOn(row); };
  const leave = e => {
    if (e.pointerType !== "touch") setOn(e.currentTarget.contains(document.activeElement) ? rowOf(document.activeElement) : null);
  };
  return html`
    <${Poster}
      kicker="Gender pay gap"
      title="The widest pay gap is in medicine"
      dek=${`In these illustrative figures, women earn less in all ${ROWS.length} occupations. ${ROWS[0].name} have the largest weekly shortfall: ${dollars(ROWS[0].gap)}.`}
      note="Illustrative figures supplied for this chart, not observed estimates. Gap = men’s median weekly earnings minus women’s; percentage gap uses men’s earnings as the denominator. These comparisons do not adjust for hours, experience or other factors."
      onPointerMove=${e => e.pointerType !== "touch" && pick(e)} onClick=${pick} onFocusIn=${pick}
      onPointerLeave=${leave} onFocusOut=${e => !e.currentTarget.contains(e.relatedTarget) && setOn(null)}>
      <div class="chart-meta">
        <p class="measure">Median weekly earnings<span>US dollars · Ordered by dollar gap</span></p>
        <p class="key"><span><i></i>Women</span><span><i class="men"></i>Men</span></p>
      </div>
      <p class="hint">Point at or tap a row to compare gaps. Keyboard: Tab, then arrow keys.</p>
      <${Chart} scale=${[range.min, range.max]} ticks=${range.ticks} format=${v => number.format(v)}
        label="Illustrative median weekly earnings in US dollars, women versus men in eight occupations"
        theme=${{ font: "var(--font)", ink: "#202a31", muted: "#535b60", grid: "#e1e2df", surface: "#faf9f6" }}>
        <${Plot} rows=${ROWS} key="name" keyboard=${true} on=${d => (on() ?? 0) === d.index}>${Occupation}<//>
      <//>
      <div class="readout" aria-hidden="true">
        <div><span class="readout-name">${() => current().name}</span><span class="readout-detail">${() => `Women earn ${percent.format(current().percent)}% less than men.`}</span></div>
        <div class="readout-number">${() => dollars(current().gap)}<small>weekly gap</small></div>
      </div>
    <//>`;
}

// Mount the self-contained page.
document.getElementById("chart").replaceChildren();
render(() => html`<${EarningsPoster} />`, document.getElementById("chart"));
</script>
</body>
</html>
