<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A week at our neighbourhood café: an interactive heatmap of illustrative average customers per hour, Monday to Sunday, 7:00 to 20:00.">
<title>The rush takes its time on weekends | The neighbourhood café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"@bezda/rhp/standalone":"https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js"}}</script>
<style>
  :root { --paper: #faf5e9; --ink: #352219; --soft: #695348; --accent: #874629; --rule: #d9c9b4; --text: 'DM Sans', sans-serif; --display: 'Fraunces', Georgia, serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 24px; background: #ded6c7; color: var(--ink); font-family: var(--text); }
  .poster { position: relative; max-width: 1100px; margin: auto; padding: 40px 48px 24px; background: var(--paper); box-shadow: 0 12px 48px #35221912; border-top: 7px solid var(--ink); }
  .masthead { display: flex; justify-content: space-between; gap: 16px; padding-bottom: 17px; border-bottom: 1px solid var(--ink); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .edition { font-weight: 500; letter-spacing: .06em; }
  figcaption { position: relative; margin: 30px 0 28px; padding-right: 110px; }
  h1 { max-width: 760px; margin: 0; font: 500 clamp(42px, 5.3vw, 68px)/1.03 var(--display); letter-spacing: -.045em; text-wrap: balance; }
  h1 em { color: var(--accent); font-weight: 500; }
  .dek { max-width: 610px; margin: 20px 0 0; font-size: 16px; line-height: 1.6; color: var(--soft); }
  .cup { position: absolute; right: 0; top: 15px; width: 92px; height: 110px; color: var(--accent); transform: rotate(-8deg); }
  .chart-heading { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 5px 20px; padding-top: 18px; border-top: 1px solid var(--rule); }
  .chart-heading h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .chart-heading p { margin: 0; font-size: 12px; color: var(--soft); }
  .heatmap { margin-top: 10px; }
  .legend { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin: 14px 0 0; font-size: 12px; color: var(--soft); }
  .ramp { width: 160px; }
  .gradient { height: 9px; background: linear-gradient(90deg in oklab, #f1e6d2, #683319); border: 1px solid #35221918; }
  .legend-ticks { display: flex; justify-content: space-between; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .readout { display: flex; align-items: center; gap: 14px; min-height: 66px; margin-top: 16px; padding: 10px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .readout-number { min-width: 53px; font: 500 40px/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
  .readout-detail { display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
  .readout-detail small { font-size: 12px; color: var(--soft); }
  .hint { margin-left: auto; max-width: 220px; font-size: 12px; line-height: 1.6; color: var(--soft); }
  .insights { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 28px; padding: 25px 0 22px; }
  .insight + .insight { border-left: 1px solid var(--rule); padding-left: 28px; }
  .insight .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .11em; font-weight: 700; color: var(--soft); }
  .insight strong { display: block; margin: 5px 0 7px; font: 500 31px/1.2 var(--display); }
  .insight p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--soft); }
  .note { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 20px; padding-top: 12px; border-top: 1px solid var(--ink); font-size: 11px; line-height: 1.5; color: var(--soft); }
  @media (max-width: 700px) {
    body { padding: 18px 12px; }
    .poster { padding: 25px 24px 20px; }
    figcaption { padding-right: 0; margin-top: 24px; }
    .cup { display: none; }
    .insights { gap: 16px; }
    .insight + .insight { padding-left: 16px; }
    .hint { max-width: 160px; }
  }
  @media (max-width: 480px) {
    body { padding: 10px 8px; }
    .poster { padding: 20px 12px 16px; border-top-width: 5px; }
    .masthead { font-size: 10px; letter-spacing: .10em; padding-bottom: 13px; }
    .edition { max-width: 72px; text-align: right; }
    figcaption { margin: 22px 0; }
    h1 { font-size: 42px; }
    .dek { font-size: 14px; line-height: 1.55; margin-top: 15px; }
    .chart-heading { padding-top: 14px; }
    .chart-heading h2 { font-size: 14px; }
    .chart-heading p { font-size: 11px; }
    .legend { margin-top: 10px; font-size: 11px; }
    .ramp { width: 125px; }
    .readout { flex-wrap: wrap; gap: 8px 12px; padding: 12px 0; }
    .readout.picked { position: sticky; bottom: 0; z-index: 3; background: var(--paper); box-shadow: 0 -8px 16px #3522190a; }
    .readout-number { font-size: 36px; min-width: 44px; }
    .readout-detail { font-size: 13px; }
    .hint { max-width: none; margin: 0; flex-basis: 100%; font-size: 11px; }
    .insights { grid-template-columns: 1fr; gap: 15px; padding: 21px 0; }
    .insight { display: grid; grid-template-columns: 100px 1fr; column-gap: 12px; }
    .insight + .insight { border-left: 0; padding-left: 0; }
    .insight .eyebrow { grid-column: 1; font-size: 10px; }
    .insight strong { grid-column: 1; font-size: 27px; margin-bottom: 0; }
    .insight p { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: 12px; }
  }
  @media print { body { padding: 0; background: var(--paper); } .poster { box-shadow: none; max-width: none; } * { print-color-adjust: exact; } .hint { display: none; } }
</style>
</head>
<body>
<main id="poster"><noscript>This interactive heatmap needs JavaScript enabled.</noscript></main>
<script type="module">
import { Chart, Plot, Cell, Label, slat, nice, html, render, createSignal, Show } from '@bezda/rhp/standalone';

// Data: illustrative average customers per hour, with each column starting at 7:00 through 20:00.
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const CUSTOMERS = [
  [12,32,27,7,8,20,22,10,10,15,10,6,2,4],
  [11,32,27,11,8,20,27,8,14,14,10,6,1,4],
  [12,34,27,8,8,19,22,9,13,15,11,8,2,1],
  [15,35,25,9,7,23,26,9,14,13,12,9,1,2],
  [11,35,27,9,9,20,26,11,13,17,19,15,4,3],
  [3,8,17,35,41,28,21,24,19,14,6,4,1,3],
  [3,5,14,31,33,26,19,23,21,15,6,5,1,4]
];
const SCALE = nice(0, Math.max(...CUSTOMERS.flat()));
const number = new Intl.NumberFormat('en-GB', { maximumFractionDigits: 1 });
const clock = h => `${h}:00`;
const ranked = CUSTOMERS.flatMap((row, day) => row.map((value, hour) => ({day, hour, value}))).sort((a,b) => b.value - a.value);
const LEAD = ranked[0];
const groupPeak = rows => Array.from({length:14}, (_,hour) => ({hour, value: rows.reduce((s,r) => s+r[hour],0)/rows.length})).sort((a,b) => b.value-a.value)[0];
const weekdayPeak = groupPeak(CUSTOMERS.slice(0,5));
const weekendPeak = groupPeak(CUSTOMERS.slice(5));

// Slat types: one day contains a crosswise Plot of fourteen hourly cells.
const Hour = slat({ css: `
  .hour { cursor: pointer; outline: none; }
  .cell { --rhp-cell-gap: 2px; --rhp-radius: 3px; }
  .value { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; pointer-events: none; color: #080604; }
  .dark .value { color: #ffffff; }
  .on .cell { outline: 2px solid #352219; outline-offset: -2px; }
  .hour:focus-visible .cell { outline: 3px solid #352219; outline-offset: 0; }
  .clock { font: 500 12px/1 'DM Sans', sans-serif; color: #695348; --rhp-label-gap: 10px; }
  @media (max-width: 700px) { .clock { writing-mode: vertical-rl; rotate: 180deg; --rhp-label-gap: 9px; overflow: visible; text-overflow: clip; max-width: none; } .cell { --rhp-cell-gap: 1px; } .value { font-size: 12px; } }
` }, h => html`
  <div class=${() => `hour${h.count >= 33 ? ' dark' : ''}${h.on ? ' on' : ''}`}
    data-day=${() => h.day} data-hour=${() => h.index}
    aria-label=${() => `${DAYS[h.day]}, ${clock(h.index+7)} to ${clock(h.index+8)}: ${number.format(h.count)} average customers`}>
    <${Cell} value=${() => h.count} class="cell"><span class="value" aria-hidden="true">${() => number.format(h.count)}</span><//>
    <${Show} when=${() => h.day === 0}><${Label} edge="end" class="clock">${() => clock(h.index+7)}<//><//>
  </div>`);

const Day = slat({
  thickness: 43,
  room: { start: 42, end: 0, before: 49, after: 0 },
  css: `.name { font: 600 13px/1 'DM Sans', sans-serif; color: #352219; } @media (max-width: 700px) { .name { font-size: 12px; } }`
}, d => html`
  <div class="day" data-row=${() => d.index}>
    <${Label} edge="start" class="name">${() => d.day.slice(0,3)}<//>
    <${Plot} orientation="across" keyboard=${true} day=${() => d.index} count=${() => d.hours}
      on=${h => d.selected === h.index}>${Hour}<//>
  </div>`);

// Chart component: pointer, tap and keyboard share the same exact-value readout.
function CafePoster() {
  const [at, setAt] = createSignal(null);
  const current = () => at() ?? [LEAD.day, LEAD.hour];
  const cellOf = el => {
    const cell = el?.closest('[data-hour]');
    return cell ? [+cell.dataset.day, +cell.dataset.hour] : null;
  };
  const pick = e => { const cell = cellOf(e.target); if (cell) setAt(cell); };
  const leave = e => { if (e.pointerType !== 'touch') setAt(e.currentTarget.contains(document.activeElement) ? cellOf(document.activeElement) : null); };
  return html`
    <figure class="poster" onPointerMove=${e => e.pointerType !== 'touch' && pick(e)} onClick=${pick}
      onFocusIn=${pick} onPointerLeave=${leave}
      onFocusOut=${e => !e.currentTarget.contains(e.relatedTarget) && setAt(null)}>
      <div class="masthead"><span>The neighbourhood café</span><span class="edition">A week at a glance</span></div>
      <figcaption>
        <h1>The rush takes its time <em>on weekends.</em></h1>
        <p class="dek">Early coffees on weekdays. A little later, a little busier on weekends. Here’s how the rhythm of our café changes through the week.</p>
        <svg class="cup" viewBox="0 0 100 115" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M27 51h48v24c0 16-11 23-24 23S27 91 27 75V51Z"/><path d="M75 56h7c17 0 15 25-7 25M17 101c18 10 56 10 70 0M37 36c-9-11 9-13 1-25M52 37c-9-11 9-13 1-25M67 36c-9-11 9-13 1-25" stroke-linecap="round"/>
          <ellipse cx="51" cy="53" rx="21" ry="4"/>
        </svg>
      </figcaption>
      <div class="chart-heading"><h2>Average customers per hour</h2><p>Each column is the hour starting then.</p></div>
      <div>
        <${Chart} class="heatmap" scale=${[SCALE.min,SCALE.max]} ticks=${false}
          label="Average café customers by day, Monday to Sunday, and hour starting 7:00 to 20:00. Illustrative data."
          theme=${{font:"'DM Sans', sans-serif",ink:'#352219',muted:'#695348',surface:'#faf5e9',low:'#f1e6d2',high:'#683319'}}>
          <${Plot} day=${DAYS} hours=${CUSTOMERS} selected=${d => current()[0] === d.index ? current()[1] : -1}>${Day}<//>
        <//>
      </div>
      <div class="legend" aria-label=${`Colour scale: 0 to ${SCALE.max} customers per hour. Darker means busier.`}>
        <span>Quieter</span><div class="ramp" aria-hidden="true"><div class="gradient"></div><div class="legend-ticks"><span>0</span><span>${number.format(SCALE.max/2)}</span><span>${number.format(SCALE.max)}</span></div></div><span>Busier</span>
      </div>
      <div class=${() => at() ? 'readout picked' : 'readout'} aria-live="polite" aria-atomic="true">
        <span class="readout-number">${() => number.format(CUSTOMERS[current()[0]][current()[1]])}</span>
        <div class="readout-detail"><b>${() => `${DAYS[current()[0]]}, ${clock(current()[1]+7)} to ${clock(current()[1]+8)}`}</b><small>${() => at() ? 'Average customers in this hour' : 'Average customers · the busiest hour'}</small></div>
        <span class="hint">Point or tap to explore.<br>Tab for days; arrows for hours.</span>
      </div>
      <div class="insights">
        <div class="insight"><span class="eyebrow">Weekday peak</span><strong>${clock(weekdayPeak.hour+7)}</strong><p>The morning coffee rush.<br>${number.format(weekdayPeak.value)} customers per hour, averaged across weekdays.</p></div>
        <div class="insight"><span class="eyebrow">Weekend peak</span><strong>${clock(weekendPeak.hour+7)}</strong><p>Brunch brings the crowd.<br>${number.format(weekendPeak.value)} customers per hour, averaged across the weekend.</p></div>
        <div class="insight"><span class="eyebrow">Busiest of all</span><strong>${number.format(LEAD.value)} customers</strong><p>${DAYS[LEAD.day]} from ${clock(LEAD.hour+7)} to ${clock(LEAD.hour+8)} is the week’s high point.</p></div>
      </div>
      <footer class="note"><span>Illustrative data · averages, not live counts.</span><span>7 days / 14 hourly intervals / a familiar rhythm</span></footer>
    </figure>`;
}

// Mount the poster. The page needs a connection for rhp and the optional web fonts.
render(() => html`<${CafePoster} />`, document.getElementById('poster'));
</script>
</body>
</html>
