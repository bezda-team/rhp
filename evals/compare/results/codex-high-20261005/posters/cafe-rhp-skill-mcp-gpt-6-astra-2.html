<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f2e8">
<meta name="description" content="The rhythm of our neighbourhood café: an interactive heatmap of average customers per hour, Monday to Sunday. Illustrative data.">
<title>The weekend rush starts later | Our neighbourhood café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"@bezda/rhp/standalone":"https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js"}}</script>
<style>
  :root { color-scheme: light; --page: #ddd6c9; --paper: #f7f2e8; --ink: #35261d; --soft: #665448; --accent: #76391f; --rule: #cec1ad; --low: #e7d3af; --high: #4a2114; --text: "DM Sans", Arial, sans-serif; --display: "Fraunces", Georgia, serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 24px; background: var(--page); color: var(--ink); font-family: var(--text); }
  .poster { position: relative; max-width: 1080px; margin: auto; padding: 38px 48px 24px; background: var(--paper); box-shadow: 0 16px 50px #35261d16; border-top: 7px solid var(--ink); }
  .poster figcaption { display: grid; gap: 20px; margin-bottom: 28px; }
  .kicker { display: block; padding-bottom: 18px; border-bottom: 1px solid var(--rule); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; }
  .headline { display: block; max-width: 760px; font: 500 clamp(40px, 6.2vw, 76px)/1.02 var(--display); letter-spacing: -.045em; text-wrap: balance; }
  .dek { display: block; max-width: 600px; color: var(--soft); font-size: 17px; line-height: 1.55; }
  .cup { position: absolute; right: 55px; top: 124px; width: 77px; height: 77px; border: 2px solid var(--accent); border-radius: 50%; transform: rotate(-24deg); }
  .cup::before { content: ""; position: absolute; inset: 10px; border: 8px solid var(--accent); border-radius: 50%; }
  .cup::after { content: ""; position: absolute; top: 26px; right: -12px; width: 21px; height: 15px; border: 2px solid var(--accent); border-left: 0; border-radius: 0 7px 7px 0; background: var(--paper); }
  .chart-heading { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; padding-top: 19px; border-top: 1px solid var(--ink); }
  .chart-heading h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .chart-heading p { margin: 0; color: var(--soft); font-size: 12px; }
  .chart { margin-top: 4px; }
  .legend { display: flex; align-items: center; gap: 10px; margin: 14px 0 20px 44px; font-size: 12px; color: var(--soft); }
  .ramp { width: 150px; height: 10px; background: linear-gradient(90deg in oklab, var(--low), var(--high)); }
  .legend .meaning { margin-left: auto; }
  .inspector { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; gap: 14px; min-height: 82px; padding: 15px 20px; background: #ece3d4; border-left: 3px solid var(--accent); }
  .inspector output { display: grid; gap: 4px; }
  .slot { font-size: 14px; font-weight: 700; }
  .reading { font-size: 14px; color: var(--soft); }
  .reading strong { font-size: 20px; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .hint { max-width: 240px; margin: 0; font-size: 12px; line-height: 1.5; color: var(--soft); }
  .takeaways { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 30px; margin-top: 28px; }
  .takeaway { border-top: 1px solid var(--rule); padding-top: 14px; }
  .takeaway .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .takeaway .time { display: block; margin: 6px 0; font: 500 32px/1.2 var(--display); }
  .takeaway p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--soft); }
  .note { display: block; border-top: 1px solid var(--ink); margin-top: 26px; padding-top: 13px; font-size: 12px; line-height: 1.5; color: var(--soft); }
  .loading { max-width: 1080px; margin: auto; padding: 30px; background: var(--paper); }
  @media (max-width: 1000px) { .cup { display: none; } }
  @media (max-width: 700px) {
    body { padding: 16px 12px; }
    .poster { padding: 22px 16px 18px; border-top-width: 5px; }
    .poster figcaption { gap: 15px; margin-bottom: 20px; }
    .kicker { font-size: 11px; line-height: 1.6; padding-bottom: 12px; letter-spacing: .1em; }
    .headline { font-size: clamp(39px, 8vw, 54px); }
    .dek { font-size: 15px; line-height: 1.5; }
    .chart-heading { padding-top: 15px; }
    .chart-heading h2 { font-size: 14px; }
    .chart-heading p { font-size: 11px; }
    .legend { margin-left: 44px; flex-wrap: wrap; gap: 7px; }
    .ramp { flex: 1; max-width: 150px; }
    .legend .meaning { flex-basis: 100%; margin-left: 0; }
    .inspector { position: sticky; top: 0; z-index: 3; display: grid; gap: 8px; padding: 10px 12px; }
    .hint { max-width: none; }
    .takeaways { gap: 16px; grid-template-columns: 1fr; margin-top: 22px; }
    .takeaway { display: grid; grid-template-columns: 95px 1fr; column-gap: 14px; }
    .takeaway .eyebrow { grid-column: 1 / -1; }
    .takeaway .time { font-size: 29px; }
    .takeaway p { align-self: center; }
  }
  @media print { body { padding: 0; background: var(--paper); } .poster { box-shadow: none; max-width: none; } .hint { display: none; } * { print-color-adjust: exact; } }
</style>
</head>
<body>
<main id="poster"><p class="loading">Loading the café’s weekly rhythm…</p></main>
<noscript><p>This interactive heatmap needs JavaScript enabled.</p></noscript>
<script type="module">
import { Chart, Plot, Cell, Label, Poster, slat, nice, html, render, createSignal, Show } from "@bezda/rhp/standalone";

// Data: average customers in the hour starting at each column, 7:00 through 20:00.
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const CUSTOMERS = [
  [12, 32, 27, 7, 8, 20, 22, 10, 10, 15, 10, 6, 2, 4],
  [11, 32, 27, 11, 8, 20, 27, 8, 14, 14, 10, 6, 1, 4],
  [12, 34, 27, 8, 8, 19, 22, 9, 13, 15, 11, 8, 2, 1],
  [15, 35, 25, 9, 7, 23, 26, 9, 14, 13, 12, 9, 1, 2],
  [11, 35, 27, 9, 9, 20, 26, 11, 13, 17, 19, 15, 4, 3],
  [3, 8, 17, 35, 41, 28, 21, 24, 19, 14, 6, 4, 1, 3],
  [3, 5, 14, 31, 33, 26, 19, 23, 21, 15, 6, 5, 1, 4],
];
const NOTE = "Illustrative data · Average customers per hour · Each column is the hour starting then; 20:00 covers 20:00 to 21:00.";
const SLOTS = CUSTOMERS.flatMap((row, day) => row.map((value, hour) => ({ day, hour, value })));
const PEAK = [...SLOTS].sort((a, b) => b.value - a.value)[0];
const SCALE = nice(Math.min(0, ...CUSTOMERS.flat()), Math.max(...CUSTOMERS.flat()));
const count = new Intl.NumberFormat("en-GB");
const clock = h => `${h}:00`;
const peakFor = rows => [...Array(14)].map((_, hour) => ({ hour: hour + 7, value: rows.reduce((sum, row) => sum + row[hour], 0) / rows.length })).sort((a, b) => b.value - a.value)[0];
const WEEKDAY = peakFor(CUSTOMERS.slice(0, 5));
const WEEKEND = peakFor(CUSTOMERS.slice(5));
const quiet = SLOTS.filter(s => s.hour >= 12);
const quietMin = Math.min(...quiet.map(s => s.value));
const quietMax = Math.max(...quiet.map(s => s.value));

// Slat types: each day contains a perpendicular Plot of fourteen hour cells.
const Hour = slat({
  css: `
    .hour { outline: none; cursor: pointer; }
    .tile { --rhp-cell-gap: 2px; --rhp-radius: 2px; display: grid; place-items: center; }
    .value { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: #000; }
    .dark .value { color: #fffdf8; }
    .peak .tile { box-shadow: inset 0 0 0 2px #fffdf8, 0 0 0 1px #4a2114; }
    .peak .value { font-weight: 700; }
    .selected .tile, .hour:focus-visible .tile { outline: 2px solid #35261d; outline-offset: 0; }
    .clock { font: 500 12px/1 "DM Sans", Arial, sans-serif; color: var(--rhp-muted); --rhp-label-gap: 12px; pointer-events: none; }
    @media (max-width: 700px) {
      .clock { writing-mode: vertical-rl; font-size: 11px; line-height: 1.3; overflow: visible; text-overflow: clip; --rhp-label-gap: 9px; }
      .tile { --rhp-cell-gap: 1px; }
      .value { display: none; }
      .peak .value { display: block; font-size: 11px; }
    }
  `,
}, h => html`
  <div class=${() => `hour${h.customers >= 27 ? " dark" : ""}${h.day === PEAK.day && h.index === PEAK.hour ? " peak" : ""}${h.selected === h.day * 14 + h.index ? " selected" : ""}`}
    data-day=${() => h.day} data-hour=${() => h.index}
    tabindex=${() => h.tabstop === h.day * 14 + h.index ? 0 : -1} role="button"
    aria-label=${() => `${DAYS[h.day]}, ${clock(h.index + 7)} to ${clock(h.index + 8)}: ${count.format(h.customers)} average customers`}
    aria-pressed=${() => h.selected === h.day * 14 + h.index}>
    <${Cell} value=${() => h.customers} class="tile"><span class="value">${() => count.format(h.customers)}</span><//>
    <${Show} when=${() => h.day === 0}><${Label} edge="end" class="clock">${() => clock(h.index + 7)}<//><//>
  </div>`);

const Day = slat({
  thickness: 42,
  room: { start: 44, before: 52, end: 0, after: 0 },
  css: `.name { font: 600 12px/1 "DM Sans", Arial, sans-serif; color: var(--rhp-ink); }`,
}, d => html`
  <div class="day">
    <${Label} edge="start" class="name">${() => d.day.slice(0, 3)}<//>
    <${Plot} orientation="across" day=${() => d.index} customers=${() => d.hours}
      selected=${() => d.selected} tabstop=${() => d.tabstop}>${Hour}<//>
  </div>`);

// Chart component: one focus stop, with arrow keys to explore the entire grid.
function CafePoster() {
  const peakIndex = PEAK.day * 14 + PEAK.hour;
  const [selected, setSelected] = createSignal(null);
  const [tabstop, setTabstop] = createSignal(peakIndex);
  const current = () => SLOTS[selected() ?? peakIndex];
  const indexOf = el => {
    const cell = el?.closest?.("[data-hour]");
    return cell ? +cell.dataset.day * 14 + +cell.dataset.hour : null;
  };
  const pick = e => { const i = indexOf(e.target); if (i != null) setSelected(i); };
  const focus = e => { const i = indexOf(e.target); if (i != null) { setSelected(i); setTabstop(i); } };
  const click = e => { const cell = e.target.closest("[data-hour]"); if (cell) { cell.focus({ preventScroll: true }); pick(e); } };
  const leave = e => { if (e.pointerType !== "touch") setSelected(indexOf(document.activeElement)); };
  const keydown = e => {
    const i = indexOf(e.target);
    if (i == null || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    const day = Math.floor(i / 14), hour = i % 14;
    const destinations = { ArrowRight: day * 14 + Math.min(13, hour + 1), ArrowLeft: day * 14 + Math.max(0, hour - 1), ArrowDown: Math.min(6, day + 1) * 14 + hour, ArrowUp: Math.max(0, day - 1) * 14 + hour, Home: day * 14, End: day * 14 + 13, Enter: i, " ": i };
    if (!(e.key in destinations)) return;
    e.preventDefault();
    const next = destinations[e.key];
    e.currentTarget.querySelector(`[data-day="${Math.floor(next / 14)}"][data-hour="${next % 14}"]`).focus({ preventScroll: true });
    setSelected(next);
  };
  return html`
    <${Poster} kicker="Our neighbourhood café · A week in coffee"
      title="The weekend rush starts later."
      dek="Early coffees on weekdays. A slower start on weekends. Here’s when our café fills up, hour by hour."
      note=${NOTE}
      onPointerMove=${e => e.pointerType !== "touch" && pick(e)} onClick=${click} onFocusIn=${focus}
      onPointerLeave=${leave} onFocusOut=${e => !e.currentTarget.contains(e.relatedTarget) && setSelected(null)}
      onKeyDown=${keydown}>
      <span class="cup" aria-hidden="true"></span>
      <div class="chart-heading"><h2>Average customers per hour</h2><p>Hour starting · 24-hour clock</p></div>
      <div class="inspector">
        <output aria-live="polite" aria-atomic="true">
          <span class="slot">${() => `${DAYS[current().day]} · ${clock(current().hour + 7)} to ${clock(current().hour + 8)}`}</span>
          <span class="reading"><strong>${() => count.format(current().value)}</strong> customers / hour${() => selected() == null || selected() === peakIndex ? " · Weekly peak" : ""}</span>
        </output>
        <p class="hint">Point or tap to read a cell.<br>Keyboard: Tab in, then use arrow keys.</p>
      </div>
      <${Chart} class="chart" orientation="horizontal" scale=${[SCALE.min, SCALE.max]} ticks=${false}
        label="Café heatmap. Rows Monday to Sunday, columns 7:00 to 20:00. Darker cells mean more customers. Tab to a cell, then use arrow keys to explore."
        theme=${{ font: '"DM Sans", Arial, sans-serif', ink: "#35261d", muted: "#665448", surface: "#f7f2e8", low: "#e7d3af", high: "#4a2114" }}>
        <${Plot} day=${DAYS} hours=${CUSTOMERS} selected=${() => selected()} tabstop=${() => tabstop()}>${Day}<//>
      <//>
      <div class="legend" aria-label=${`Colour scale from ${SCALE.min} to ${SCALE.max} customers per hour`}>
        <span>${count.format(SCALE.min)}</span><span class="ramp" aria-hidden="true"></span><span>${count.format(SCALE.max)}</span>
        <span class="meaning">Darker means busier</span>
      </div>
      <div class="takeaways">
        <div class="takeaway"><span class="eyebrow">The weekday rush</span><span class="time">${clock(WEEKDAY.hour)}</span><p>The busiest hour on every weekday, Monday to Friday.</p></div>
        <div class="takeaway"><span class="eyebrow">The weekend rhythm</span><span class="time">${clock(WEEKEND.hour)}</span><p>Both weekend days peak later. Saturday reaches ${count.format(PEAK.value)} customers.</p></div>
        <div class="takeaway"><span class="eyebrow">Room to linger</span><span class="time">19:00+</span><p>Just ${count.format(quietMin)} to ${count.format(quietMax)} customers per hour in the last two slots.</p></div>
      </div>
    <//>`;
}

// Mount the complete poster. All data, styling and interactions are in this file.
document.getElementById("poster").replaceChildren();
render(() => html`<${CafePoster} />`, document.getElementById("poster"));
</script>
</body>
</html>
