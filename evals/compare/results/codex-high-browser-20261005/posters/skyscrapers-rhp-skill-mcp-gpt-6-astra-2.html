<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The world's ten tallest buildings, drawn to a common height scale. An interactive architectural poster using CTBUH data.">
  <meta name="theme-color" content="#f4f1e9">
  <title>A class of its own | The world's ten tallest buildings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script type="importmap">{"imports":{"@bezda/rhp/standalone":"https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js"}}</script>
  <style>
    :root { --paper: #f4f1e9; --ink: #232620; --soft: #5e6259; --accent: #b83b24; --rule: #d4d3c8; --text: "DM Sans", Arial, sans-serif; --display: "Barlow Condensed", Impact, sans-serif; --mono: "IBM Plex Mono", monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #dadbd3; color: var(--ink); font: 15px/1.5 var(--text); }
    .poster { max-width: 1320px; margin: 0 auto; padding: 30px 48px 26px; background: var(--paper); box-shadow: 0 10px 40px #23262012; }
    .masthead { display: flex; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); font: 500 11px/1.5 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .masthead strong { font-weight: 500; color: var(--accent); }
    .hero { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; align-items: end; padding: 29px 0 34px; }
    .kicker { margin: 0 0 12px; font: 500 11px/1.5 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font: 600 clamp(64px, 8.5vw, 114px)/.88 var(--display); letter-spacing: -.025em; }
    h1 span { display: block; color: var(--accent); }
    .intro { padding: 0 0 3px 25px; border-left: 1px solid var(--rule); }
    .intro h2 { margin: 0 0 13px; max-width: 16em; font-size: 23px; line-height: 1.15; letter-spacing: -.04em; font-weight: 500; }
    .intro p { margin: 0; max-width: 35em; font-size: 14px; color: var(--soft); line-height: 1.65; }
    .intro b { color: var(--ink); font-weight: 600; }
    .chart-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 1px solid var(--ink); padding-top: 13px; }
    .chart-heading h2 { margin: 0; font: 500 11px/1.6 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
    .hint { margin: 0; font-size: 11px; color: var(--soft); }
    .chart-area { margin-top: 18px; }
    .chart-note { display: flex; justify-content: space-between; gap: 20px; margin: 13px 0 18px; color: var(--soft); font: 400 10px/1.6 var(--mono); }
    .readout { display: grid; grid-template-columns: 52px 1fr auto; column-gap: 14px; align-items: center; min-height: 88px; padding: 14px 0; margin: 0 0 23px; border-block: 1px solid var(--ink); background: var(--paper); }
    .readout-number { font: 500 40px/1 var(--display); color: var(--accent); }
    .readout-name { display: block; font-size: 17px; font-weight: 600; line-height: 1.25; }
    .readout-meta { display: block; margin-top: 5px; color: var(--soft); font-size: 12px; }
    .readout-gap { text-align: right; font: 400 12px/1.5 var(--mono); color: var(--soft); }
    .readout-gap b { display: block; font: 600 30px/1.1 var(--display); color: var(--accent); }
    .index-title { display: flex; justify-content: space-between; margin-bottom: 13px; font: 500 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
    .index { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 21px 20px; }
    .entry { display: grid; grid-template-columns: 24px 1fr; align-content: start; gap: 5px; padding: 9px 0; border: 0; border-top: 1px solid var(--rule); background: none; color: var(--ink); text-align: left; cursor: pointer; font: inherit; }
    .entry-num { padding-top: 2px; font: 500 11px/1.5 var(--mono); color: var(--soft); }
    .entry-name { display: block; min-height: 2.5em; font-size: 13px; font-weight: 600; line-height: 1.25; }
    .entry-meta { display: block; margin-top: 7px; font-size: 11px; line-height: 1.5; color: var(--soft); }
    .entry-height { display: block; margin-top: 5px; font: 500 13px/1.4 var(--mono); }
    .entry.selected { border-top-color: var(--accent); }
    .entry.selected .entry-name, .entry.selected .entry-num, .entry.selected .entry-height { color: var(--accent); }
    .entry:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    footer { display: grid; grid-template-columns: 1fr auto; gap: 20px; border-top: 2px solid var(--ink); padding-top: 14px; margin-top: 27px; font-size: 10px; line-height: 1.65; color: var(--soft); }
    footer p { margin: 0; }
    footer strong { font-weight: 600; color: var(--ink); }
    .colophon { font: 500 10px/1.6 var(--mono); text-align: right; text-transform: uppercase; letter-spacing: .08em; }
    .status { margin: 24px 0; }
    @media (max-width: 1050px) { body { padding: 20px; } .poster { padding: 26px 30px; } .hero { gap: 24px; } .intro h2 { font-size: 21px; } .index { gap: 16px 13px; } .entry { grid-template-columns: 19px 1fr; } }
    @media (max-width: 699px) {
      body { padding: 0; }
      .poster { padding: 19px 22px 24px; box-shadow: none; }
      .masthead { font-size: 9px; letter-spacing: .08em; }
      .hero { display: block; padding: 24px 0; }
      .kicker { font-size: 10px; margin-bottom: 13px; }
      h1 { font-size: clamp(63px, 18vw, 98px); line-height: .9; }
      .intro { border: 0; padding: 0; margin-top: 21px; }
      .intro h2 { font-size: 20px; max-width: none; margin-bottom: 10px; }
      .intro p { font-size: 13px; line-height: 1.6; }
      .chart-heading { display: block; padding-top: 12px; }
      .hint { margin-top: 5px; font-size: 11px; }
      .chart-area { margin-top: 18px; }
      .chart-note { margin-top: 9px; }
      .chart-note .profiles { display: none; }
      .readout { display: none; }
      .directory { display: none; }
      footer { grid-template-columns: 1fr; gap: 12px; margin-top: 21px; }
      .colophon { text-align: left; }
    }
    @media print { body { padding: 0; background: var(--paper); } .poster { max-width: none; box-shadow: none; } .hint { display: none; } .readout { position: static; } }
  </style>
</head>
<body>
<main id="app"><p class="status">Loading the architectural poster…</p></main>
<noscript>This interactive poster needs JavaScript to display the building comparison.</noscript>
<script type="module">
import { Chart, Plot, Bar, Label, slat, shape, nice, html, render, createSignal, onCleanup, Show } from "@bezda/rhp/standalone";

// Data: supplied CTBUH architectural heights in metres, with completion years.
const BUILDINGS = [
  { name: "Burj Khalifa", city: "Dubai", height: 828, year: 2010 },
  { name: "Merdeka 118", city: "Kuala Lumpur", height: 678.9, year: 2023 },
  { name: "Shanghai Tower", city: "Shanghai", height: 632, year: 2015 },
  { name: "Makkah Royal Clock Tower", city: "Mecca", height: 601, year: 2012 },
  { name: "Ping An Finance Center", city: "Shenzhen", height: 599.1, year: 2017 },
  { name: "Lotte World Tower", city: "Seoul", height: 554.5, year: 2017 },
  { name: "One World Trade Center", city: "New York City", height: 541.3, year: 2014 },
  { name: "Guangzhou CTF Finance Centre", city: "Guangzhou", height: 530, year: 2016 },
  { name: "Tianjin CTF Finance Centre", city: "Tianjin", height: 530, year: 2019 },
  { name: "CITIC Tower", city: "Beijing", height: 527.7, year: 2018 }
];
// Schematic profiles, normalized to each building's full architectural height.
const PROFILES = [
  [[.02,1],[.02,.87],[.13,.87],[.13,.69],[.23,.69],[.23,.51],[.33,.51],[.33,.34],[.42,.34],[.42,.17],[.48,.17],[.5,0],[.52,.17],[.56,.17],[.56,.3],[.65,.3],[.65,.48],[.73,.48],[.73,.65],[.83,.65],[.83,.83],[.98,.83],[.98,1]],
  [[.12,1],[.12,.32],[.35,.21],[.55,.17],[.57,0],[.6,.2],[.85,.33],[.9,1]],
  [[.12,1],[.08,.77],[.15,.5],[.23,.24],[.34,.06],[.55,0],[.72,.025],[.78,.13],[.69,.4],[.72,.7],[.86,1]],
  [[0,1],[0,.59],[.16,.59],[.16,.35],[.24,.35],[.24,.22],[.41,.22],[.41,.14],[.48,.14],[.5,0],[.52,.14],[.59,.14],[.59,.22],[.76,.22],[.76,.35],[.84,.35],[.84,.59],[1,.59],[1,1]],
  [[.12,1],[.12,.24],[.23,.14],[.43,.03],[.5,0],[.57,.03],[.77,.14],[.88,.24],[.88,1]],
  [[.08,1],[.12,.6],[.21,.26],[.35,.06],[.47,0],[.53,0],[.65,.06],[.79,.26],[.88,.6],[.92,1]],
  [[.04,1],[.18,.3],[.4,.28],[.48,.28],[.49,0],[.51,0],[.52,.28],[.6,.28],[.82,.3],[.96,1]],
  [[.08,1],[.08,.12],[.18,.12],[.18,.04],[.7,.04],[.7,0],[.86,0],[.86,1]],
  [[.08,1],[.06,.74],[.15,.44],[.22,.3],[.27,.09],[.41,0],[.59,0],[.73,.09],[.78,.3],[.85,.44],[.94,.74],[.92,1]],
  [[.06,1],[.19,.78],[.27,.55],[.26,.32],[.18,.09],[.13,0],[.87,0],[.82,.09],[.74,.32],[.73,.55],[.81,.78],[.94,1]]
];
const number = new Intl.NumberFormat("en-US", { maximumFractionDigits: 1 });
const twoDigits = n => String(n).padStart(2, "0");
const rows = [...BUILDINGS].sort((a, b) => b.height - a.height).map((d, index, sorted) => ({
  ...d, rank: sorted.findIndex(b => b.height === d.height) + 1, id: twoDigits(index + 1),
  outline: shape(...PROFILES[BUILDINGS.indexOf(d)].map(([x, y], i) => [i ? "L" : "M", 1 - y, x]), ["Z"])
}));
const leader = rows[0];
const lead = leader.height - rows[1].height;
const scale = nice(Math.min(0, ...rows.map(d => d.height)), leader.height, 5);
const theme = { font: "var(--text)", ink: "var(--ink)", muted: "var(--soft)", grid: "var(--rule)", surface: "var(--paper)" };
const describe = d => `${d.name}, ${d.city}. ${number.format(d.height)} metres. Completed ${d.year}. ${d.height === leader.height ? "Tallest building." : `${number.format(leader.height - d.height)} metres below ${leader.name}.`}`;

// Slat types: architectural elevations on larger screens, labeled bars on phones.
const Elevation = slat({
  inset: .2, room: { start: 31, end: 28, before: 42, after: 8 },
  css: `
    .tower { cursor: pointer; }
    .building { --rhp-radius: 0px; }
    .height { font: 500 14px "IBM Plex Mono", monospace; --rhp-label-gap: 9px; }
    .id { font: 500 11px "IBM Plex Mono", monospace; --rhp-label-gap: 12px; color: var(--rhp-muted); }
    .lit .height, .lit .id { color: #b83b24; }
    .tower:focus-visible { outline: 2px solid #b83b24; outline-offset: 1px; }
    @container (max-width: 800px) { .height { font-size: 12px; } }
  `
}, d => html`
  <div class=${() => d.lit ? "tower lit" : "tower"} data-row=${() => d.index} aria-label=${() => describe(d)}>
    <${Bar} to=${() => d.height} shape=${() => d.outline} color=${() => d.lit ? "#b83b24" : "#697266"} class="building" />
    <${Label} at=${() => d.height} class="height">${() => number.format(d.height)}<//>
    <${Label} edge="start" class="id">${() => d.id}<//>
  </div>`);

const MobileBuilding = slat({
  thickness: 99, room: { start: 0, end: 48 },
  css: `
    .tower { cursor: pointer; border-top: 1px solid var(--rhp-grid); }
    .name { position: absolute; top: 9px; left: 0; width: 100%; font-size: 13px; line-height: 1.2; font-weight: 600; background: var(--rhp-surface); }
    .name small { font: 400 10px "IBM Plex Mono", monospace; margin-right: 7px; color: var(--rhp-muted); }
    .meta { position: absolute; top: 64px; left: 0; font-size: 11px; color: var(--rhp-muted); background: var(--rhp-surface); }
    .comparison { position: absolute; top: 80px; left: 0; font-size: 10px; line-height: 1.3; color: #b83b24; background: var(--rhp-surface); }
    .bar { --rhp-radius: 0px; }
    .height { font: 500 12px "IBM Plex Mono", monospace; --rhp-label-gap: 8px; }
    .lit .height, .lit .name { color: #b83b24; }
    .tower:focus-visible { outline: 2px solid #b83b24; outline-offset: 3px; }
  `
}, d => html`
  <div class=${() => d.lit ? "tower lit" : "tower"} data-row=${() => d.index} aria-label=${() => describe(d)}>
    <span class="name"><small>${() => d.id}</small>${() => d.name}</span>
    <${Bar} to=${() => d.height} thick="8px" color=${() => d.lit ? "#b83b24" : "#697266"} class="bar" />
    <${Label} at=${() => d.height} class="height">${() => number.format(d.height)}<//>
    <span class="meta">${() => `${d.city} · ${d.year}`}</span>
    <${Show} when=${() => d.lit}><span class="comparison">${() => d.height === leader.height ? `+${number.format(lead)} m above second place` : `${number.format(leader.height - d.height)} m below Burj Khalifa`}</span><//>
  </div>`);

// Chart component: pointer, keyboard and tap share the same selection.
function BuildingPoster() {
  const [picked, setPicked] = createSignal(null);
  const media = matchMedia("(max-width: 699px)");
  const [mobile, setMobile] = createSignal(media.matches);
  const resize = e => setMobile(e.matches);
  media.addEventListener("change", resize);
  onCleanup(() => media.removeEventListener("change", resize));
  const current = () => rows[picked() ?? 0];
  const rowOf = el => { const root = el?.closest?.("[data-row]"); return root ? Number(root.dataset.row) : null; };
  const pick = e => { const row = rowOf(e.target); if (row !== null) setPicked(row); };
  const leave = e => {
    if (e.pointerType !== "touch") setPicked(e.currentTarget.contains(document.activeElement) ? rowOf(document.activeElement) : null);
  };
  return html`
    <article class="poster" onPointerMove=${e => e.pointerType !== "touch" && pick(e)} onClick=${pick} onFocusIn=${pick}
      onPointerLeave=${leave} onFocusOut=${e => !e.currentTarget.contains(e.relatedTarget) && setPicked(null)}>
      <div class="masthead"><strong>The vertical city</strong><span>Architecture / No. 01</span></div>
      <header class="hero">
        <div><p class="kicker">The world's ten tallest buildings</p><h1>A class<span>of its own.</span></h1></div>
        <div class="intro"><h2>${leader.name} rises above the rest.</h2><p>At <b>${number.format(leader.height)} metres</b>, Dubai’s landmark stands <b>${number.format(lead)} metres</b> above its nearest rival. The world’s tallest completed buildings, compared from the ground up.</p></div>
      </header>
      <section aria-labelledby="comparison-title">
        <div class="chart-heading"><h2 id="comparison-title">01 / Height above ground · metres</h2><p class="hint">Point, tap or use Tab + arrow keys to explore.</p></div>
        <div class="chart-area">
          <${Show} when=${mobile} fallback=${html`
            <${Chart} orientation="vertical" height=${410} scale=${[scale.min, scale.max]} ticks=${scale.ticks} theme=${theme} label="The world's ten tallest buildings, architectural height in metres">
              <${Plot} rows=${rows} lit=${d => d.index === (picked() ?? 0)} keyboard=${true}>${Elevation}<//>
            <//>`}>
            <${Chart} scale=${[scale.min, scale.max]} ticks=${scale.ticks} theme=${theme} label="The world's ten tallest buildings, architectural height in metres">
              <${Plot} rows=${rows} lit=${d => d.index === (picked() ?? 0)} keyboard=${true}>${MobileBuilding}<//>
            <//>
          <//>
        </div>
        <p class="chart-note"><span>Common baseline. Architectural height in metres.</span><span class="profiles">Schematic profiles; widths are illustrative.</span></p>
        <div class="readout" aria-hidden="true">
          <span class="readout-number">${() => current().id}</span>
          <div><strong class="readout-name">${() => current().name}</strong><span class="readout-meta">${() => `${current().city} · Completed ${current().year} · ${number.format(current().height)} m`}</span></div>
          <div class="readout-gap"><b>${() => current() === leader ? `+${number.format(lead)} m` : `${number.format(leader.height - current().height)} m`}</b><span>${() => current() === leader ? "above second place" : "below Burj Khalifa"}</span></div>
        </div>
        <div class="directory">
          <div class="index-title"><span>02 / Building index</span><span>City · completed</span></div>
          <div class="index">${rows.map((d, i) => html`
            <button type="button" class=${() => i === (picked() ?? 0) ? "entry selected" : "entry"} data-row=${i} aria-label=${describe(d)} aria-pressed=${() => i === (picked() ?? 0)}>
              <span class="entry-num">${d.id}</span><span><strong class="entry-name">${d.name}</strong><span class="entry-meta">${d.city}<br />${d.year}</span><span class="entry-height">${number.format(d.height)} m</span></span>
            </button>`)}</div>
        </div>
      </section>
      <footer><p><strong>Source: Council on Tall Buildings and Urban Habitat (CTBUH).</strong><br />Supplied dataset. Heights include architectural spires. Completion years shown.<br />Index numbers identify buildings; Guangzhou and Tianjin share eighth place at 530 m.</p><p class="colophon">Ten buildings.<br />One extraordinary skyline.</p></footer>
    </article>`;
}

// Mount the self-contained page.
document.getElementById("app").replaceChildren();
render(BuildingPoster, document.getElementById("app"));
</script>
</body>
</html>
