<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="When our neighbourhood café is busiest: an interactive heatmap of average customers by weekday and hour, using illustrative data.">
<title>The weekend rush takes its time | Our neighbourhood café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"@bezda/rhp/standalone":"https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js"}}</script>
<style>
:root { --paper: #fbf6eb; --ink: #33241d; --soft: #71594b; --accent: #9e4125; --rule: #d9cbb7; --text: 'DM Sans', sans-serif; --display: 'Fraunces', Georgia, serif; }
* { box-sizing: border-box; }
body { margin: 0; padding: 36px 24px; background: #e2d9ca; color: var(--ink); font-family: var(--text); }
.poster { max-width: 1120px; margin: auto; padding: 34px 48px 24px; background: var(--paper); border-top: 6px solid var(--accent); box-shadow: 0 12px 45px #33241d12; }
.masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--ink); font-size: 12px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
.brand { display: flex; align-items: center; gap: 12px; }
.cup { width: 34px; height: 31px; flex: none; color: var(--accent); }
.edition { font-size: 11px; color: var(--soft); letter-spacing: .1em; }
.hero { display: grid; grid-template-columns: 1fr 174px; align-items: center; gap: 40px; padding: 30px 0 26px; }
h1 { margin: 0; font: 500 clamp(46px, 5.9vw, 76px)/1.02 var(--display); letter-spacing: -.045em; }
h1 em { font-weight: 500; color: var(--accent); }
.dek { max-width: 590px; margin: 18px 0 0; font-size: 15px; line-height: 1.6; color: var(--soft); }
.peak { border-left: 1px solid var(--rule); padding-left: 27px; }
.eyebrow { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.peak strong { display: block; margin: 5px 0 3px; font: 500 80px/1 var(--display); letter-spacing: -.06em; }
.peak p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--soft); }
.chart-heading { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; padding-top: 18px; border-top: 1px solid var(--rule); }
h2 { font-size: 15px; font-weight: 700; margin: 0; }
.axis-description { margin: 0; font-size: 12px; color: var(--soft); }
.hour-axis { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); margin: 17px 0 5px 34px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--soft); }
.heatmap { background: var(--paper); }
.below-chart { display: flex; justify-content: space-between; gap: 20px; margin: 17px 0 15px; align-items: center; }
.legend { display: flex; gap: 11px; align-items: center; font-size: 11px; color: var(--soft); white-space: nowrap; }
.legend-item { display: inline-flex; align-items: center; gap: 4px; }
.swatch { width: 13px; height: 13px; border: 1px solid #33241d14; display: inline-block; border-radius: 2px; }
.hint { font-size: 11px; color: var(--soft); margin: 0; }
.readout { margin-top: 14px; background: var(--paper); display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 11px 15px; border: 1px solid var(--rule); border-left: 3px solid var(--accent); font-size: 14px; }
.readout-main { font-weight: 700; font-variant-numeric: tabular-nums; }
.readout-detail { font-size: 12px; color: var(--soft); }
.insights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 24px 0 21px; }
.insight + .insight { padding-left: 24px; border-left: 1px solid var(--rule); }
.insight h3 { font: 500 25px/1.2 var(--display); margin: 5px 0 8px; letter-spacing: -.02em; }
.insight p { font-size: 12px; line-height: 1.6; color: var(--soft); margin: 0; }
footer { border-top: 1px solid var(--ink); padding-top: 12px; display: flex; justify-content: space-between; gap: 16px; font-size: 11px; line-height: 1.6; color: var(--soft); }
footer p { margin: 0; }
@media (max-width: 850px) {
  .poster { padding: 28px; }
  .hero { grid-template-columns: 1fr 140px; gap: 20px; }
  .peak { padding-left: 20px; }
  .below-chart { flex-wrap: wrap; gap: 9px; }
  .readout { align-items: flex-start; flex-direction: column; justify-content: center; gap: 4px; min-height: 66px; }
}
@media (max-width: 540px) {
  body { padding: 12px 8px; }
  .poster { padding: 18px 12px 16px; border-top-width: 4px; }
  .masthead { padding-bottom: 13px; font-size: 10px; letter-spacing: .09em; gap: 4px; }
  .brand { gap: 8px; }
  .cup { width: 27px; height: 25px; }
  .edition { font-size: 10px; letter-spacing: 0; }
  .hero { display: block; padding: 22px 0 20px; }
  h1 { font-size: 43px; line-height: 1.04; letter-spacing: -.04em; }
  .dek { font-size: 13px; line-height: 1.5; margin-top: 13px; }
  .peak { display: none; }
  .chart-heading { flex-direction: column; gap: 5px; padding-top: 14px; }
  h2 { font-size: 14px; }
  .axis-description { font-size: 11px; }
  .hour-axis { margin-left: 34px; margin-top: 14px; font-size: 11px; }
  .minutes { display: none; }
  .below-chart { margin-top: 12px; }
  .legend { width: 100%; justify-content: space-between; gap: 4px; font-size: 10px; }
  .legend-item { gap: 3px; }
  .swatch { width: 12px; height: 12px; }
  .hint { font-size: 10px; }
  .readout { position: sticky; top: 0; z-index: 3; padding: 10px; min-height: 68px; font-size: 13px; }
  .readout-detail { font-size: 11px; }
  .insights { gap: 12px; padding: 20px 0; }
  .insight + .insight { padding-left: 12px; }
  .insight .eyebrow { font-size: 9px; letter-spacing: .04em; }
  .insight h3 { font-size: 23px; }
  .insight p { font-size: 11px; line-height: 1.5; }
  footer { display: block; font-size: 10px; }
  footer p + p { margin-top: 4px; }
}
@media print { body { padding: 0; background: var(--paper); } .poster { box-shadow: none; max-width: none; } .hint { display: none; } * { print-color-adjust: exact; } }
</style>
</head>
<body>
<main id="app"></main>
<noscript>This café heatmap needs JavaScript enabled to display its illustrative data.</noscript>
<script type="module">
import { Chart, Plot, Cell, Label, slat, nice, html, render, createSignal } from '@bezda/rhp/standalone';

// Data: average customers in each hour starting from 7:00 through 20:00.
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const CUSTOMERS = [
  [12,32,27,7,8,20,22,10,10,15,10,6,2,4],
  [11,32,27,11,8,20,27,8,14,14,10,6,1,4],
  [12,34,27,8,8,19,22,9,13,15,11,8,2,1],
  [15,35,25,9,7,23,26,9,14,13,12,9,1,2],
  [11,35,27,9,9,20,26,11,13,17,19,15,4,3],
  [3,8,17,35,41,28,21,24,19,14,6,4,1,3],
  [3,5,14,31,33,26,19,23,21,15,6,5,1,4]
];
const HOURS = Array.from({ length: 14 }, (_, i) => i + 7);
const SCALE = nice(0, Math.max(...CUSTOMERS.flat()));
const ranked = CUSTOMERS.flatMap((values, day) => values.map((value, hour) => ({ day, hour, value }))).sort((a,b) => b.value - a.value);
const peak = ranked[0];
const PALETTE = ['#f0e4d2', '#e4b68a', '#cd8052', '#a84928', '#723020'];
const band = value => Math.min(4, Math.floor(value / 10));
const clock = hour => `${hour}:00`;
const dailyPeak = day => Math.max(...CUSTOMERS[day]);
const peakHour = rows => HOURS[HOURS.map((_, i) => rows.reduce((sum, row) => sum + row[i], 0)).reduce((best, value, i, values) => value > values[best] ? i : best, 0)];
const weekdayPeak = peakHour(CUSTOMERS.slice(0,5));
const weekendPeak = peakHour(CUSTOMERS.slice(5));

// Slat types: one day holds a crosswise Plot with one coloured Cell per hour.
const Hour = slat({ css: `
  .hour { cursor: pointer; outline: none; }
  .tile { --rhp-cell-gap: 2px; --rhp-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; color: #33241d; }
  .dark .tile { color: #fff9ee; }
  .selected .tile { outline: 2px solid #33241d; outline-offset: -3px; font-weight: 700; }
  .dark.selected .tile { outline-color: #fff9ee; }
  .hour:focus-visible .tile { outline: 3px solid #33241d; outline-offset: 0; }
  @media (max-width: 540px) { .tile { --rhp-cell-gap: .75px; --rhp-radius: 2px; font-size: 11px; } }
` }, h => html`
  <div class=${() => `hour ${h.value >= 30 ? 'dark' : ''} ${h.isSelected ? 'selected' : ''}`}
    data-day=${() => h.day} data-hour=${() => h.index} tabindex=${() => h.isSelected ? 0 : -1}
    role="button" aria-label=${() => `${DAYS[h.day]}, ${clock(h.index + 7)} to ${clock(h.index + 8)}: ${h.value} average customers`}
    aria-pressed=${() => h.isSelected}>
    <${Cell} class="tile" value=${() => h.value} color=${() => PALETTE[band(h.value)]}>${() => h.value}<//>
  </div>`);
const Day = slat({
  thickness: 43,
  room: { start: 34 },
  css: `
    .name { --rhp-label-gap: 4px; font-size: 13px; font-weight: 600; color: #71594b; }
    .weekend .name { color: #9e4125; font-weight: 700; }
    @media (max-width: 540px) { .name { font-size: 11px; --rhp-label-gap: 5px; } }
  `
}, d => html`
  <div class=${() => d.index > 4 ? 'day weekend' : 'day'}>
    <${Label} edge="start" class="name">${() => d.day.slice(0,3)}<//>
    <${Plot} orientation="across" day=${() => d.index} value=${() => d.hours}
      isSelected=${h => d.selected[0] === d.index && d.selected[1] === h.index}>${Hour}<//>
  </div>`);

// Poster and interaction: pointing previews a cell; focus, click and arrow keys select it.
function CafePoster() {
  const [at, setAt] = createSignal([peak.day, peak.hour]);
  const cellOf = el => el?.closest?.('[data-hour]');
  const pick = e => { const cell = cellOf(e.target); if (cell) setAt([+cell.dataset.day, +cell.dataset.hour]); };
  const leave = e => {
    if (e.pointerType === 'touch') return;
    const focused = cellOf(document.activeElement);
    setAt(focused ? [+focused.dataset.day, +focused.dataset.hour] : [peak.day, peak.hour]);
  };
  const key = e => {
    const cell = cellOf(e.target);
    if (!cell) return;
    let day = +cell.dataset.day, hour = +cell.dataset.hour;
    if (e.key === 'ArrowRight') hour = Math.min(13, hour + 1);
    else if (e.key === 'ArrowLeft') hour = Math.max(0, hour - 1);
    else if (e.key === 'ArrowDown') day = Math.min(6, day + 1);
    else if (e.key === 'ArrowUp') day = Math.max(0, day - 1);
    else if (e.key === 'Home') hour = 0;
    else if (e.key === 'End') hour = 13;
    else if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    setAt([day, hour]);
    e.currentTarget.querySelector(`[data-day="${day}"][data-hour="${hour}"]`).focus();
  };
  const detail = () => {
    const [day, hour] = at();
    const value = CUSTOMERS[day][hour];
    if (value === peak.value) return 'The busiest hour of the week.';
    if (value === dailyPeak(day)) return `${DAYS[day]}’s busiest hour.`;
    return `${dailyPeak(day) - value} fewer customers than ${DAYS[day]}’s busiest hour.`;
  };
  return html`
  <article class="poster" onPointerMove=${e => e.pointerType !== 'touch' && pick(e)} onClick=${pick}
    onFocusIn=${pick} onPointerLeave=${leave} onKeyDown=${key}
    onFocusOut=${e => !e.currentTarget.contains(e.relatedTarget) && setAt([peak.day, peak.hour])}>
    <header class="masthead">
      <div class="brand"><svg class="cup" viewBox="0 0 40 36" fill="none" aria-hidden="true"><path d="M6 13h23v9a10 10 0 0 1-10 10h-3A10 10 0 0 1 6 22V13Z" stroke="currentColor" stroke-width="1.8"/><path d="M29 15h3a5 5 0 0 1 0 10h-4M3 35h29M13 8c-4-4 4-4 0-8M22 8c-4-4 4-4 0-8" stroke="currentColor" stroke-width="1.8"/></svg><span>Our neighbourhood café</span></div>
      <span class="edition">The weekly rhythm</span>
    </header>
    <div class="hero">
      <div><h1>The weekend rush<br/><em>takes its time.</em></h1>
        <p class="dek">Early coffees on weekdays, leisurely mornings at the weekend. Find your moment in a week of café life.</p></div>
      <aside class="peak"><span class="eyebrow">The busiest hour</span><strong>${peak.value}</strong><p>customers, on average<br/>${DAYS[peak.day]} at ${clock(peak.hour + 7)}</p></aside>
    </div>
    <section aria-labelledby="heatmap-title">
      <div class="chart-heading"><h2 id="heatmap-title">Average customers per hour</h2><p class="axis-description">Hour starting · 24-hour clock</p></div>
      <output class="readout" aria-live="polite" aria-atomic="true"><span class="readout-main">${() => { const [day,hour] = at(); return `${DAYS[day]} · ${clock(hour+7)} · ${CUSTOMERS[day][hour]} customers`; }}</span><span class="readout-detail">${detail}</span></output>
      <div class="hour-axis" aria-hidden="true">${HOURS.map(h => html`<span>${h}<span class="minutes">:00</span></span>`)}</div>
      <${Chart} class="heatmap" scale=${[SCALE.min,SCALE.max]} ticks=${false}
        label="Average customers per hour, Monday to Sunday, 7:00 to 20:00. Use arrow keys to explore each hour."
        theme=${{ font: 'DM Sans, sans-serif', ink: '#33241d', muted: '#71594b', surface: '#fbf6eb' }}>
        <${Plot} day=${DAYS} hours=${CUSTOMERS} selected=${d => at()}>${Day}<//>
      <//>
      <div class="below-chart">
        <div class="legend" aria-label="Colour key, customers per hour"><span>Quieter</span>${PALETTE.map((color,i) => html`<span class="legend-item"><i class="swatch" style=${{background:color}}></i>${i === 4 ? '40+' : `${i * 10}–${i * 10 + 9}`}</span>`)}<span>Busier</span></div>
        <p class="hint">Point or tap to explore. Keyboard: Tab, then arrow keys.</p>
      </div>

    </section>
    <section class="insights" aria-label="The daily rhythm">
      <div class="insight"><span class="eyebrow">Weekday ritual</span><h3>${clock(weekdayPeak)}</h3><p>The morning rush peaks before the working day.</p></div>
      <div class="insight"><span class="eyebrow">Weekend pace</span><h3>${clock(weekendPeak)}</h3><p>The busiest hour arrives ${weekendPeak - weekdayPeak} hours later.</p></div>
      <div class="insight"><span class="eyebrow">A quieter cup</span><h3>19:00</h3><p>Just ${Math.min(...CUSTOMERS.map(row => row[12]))} to ${Math.max(...CUSTOMERS.map(row => row[12]))} customers, whichever day you visit.</p></div>
    </section>
    <footer><p>Illustrative data · Each cell shows an hourly average.</p><p>7:00 means 7:00 to 8:00; the final column covers 20:00 to 21:00.</p></footer>
  </article>`;
}

// Mount the self-contained poster.
render(() => html`<${CafePoster} />`, document.getElementById('app'));
</script>
</body>
</html>
