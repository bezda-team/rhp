<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="When our neighbourhood café is busiest: an interactive heatmap of average customers per hour, Monday to Sunday. Illustrative data.">
<title>The weekend rush sleeps in | Neighbourhood café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"@bezda/rhp/standalone":"https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js"}}</script>
<style>
:root { --page:#ded7ca; --paper:#faf5e9; --ink:#342319; --soft:#6c5546; --rule:#d7c8b3; --accent:#7b3e22; --low:#ead5b2; --high:#562713; --text:"DM Sans",Arial,sans-serif; --display:"Instrument Serif",Georgia,serif; }
* { box-sizing:border-box; }
body { margin:0; padding:36px 24px; background:var(--page); color:var(--ink); font-family:var(--text); }
.poster { position:relative; max-width:1120px; margin:auto; padding:36px 52px 24px; background:var(--paper); border-top:6px solid var(--ink); box-shadow:0 12px 50px #34231915; }
.poster figcaption { position:relative; display:grid; gap:16px; margin:0 0 34px; padding-top:49px; }
.kicker { position:absolute; top:0; left:0; right:0; padding-bottom:15px; border-bottom:1px solid var(--ink); font-size:12px; font-weight:700; letter-spacing:.17em; text-transform:uppercase; }
.headline { display:block; max-width:690px; font:400 clamp(48px,6.5vw,80px)/.98 var(--display); letter-spacing:-.025em; text-wrap:balance; }
.dek { display:block; max-width:620px; color:var(--soft); font-size:16px; line-height:1.6; }
.cup { position:absolute; top:108px; right:68px; width:116px; height:116px; color:var(--accent); transform:rotate(-9deg); }
.chart-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding-bottom:14px; border-bottom:1px solid var(--rule); }
.chart-heading h2 { margin:0; font-size:16px; font-weight:600; }
.chart-heading p { margin:5px 0 0; color:var(--soft); font-size:12px; }
.legend { display:grid; grid-template-columns:auto 136px auto; gap:7px; align-items:center; font-size:12px; color:var(--soft); }
.legend .ramp { height:9px; background:linear-gradient(90deg in oklab,var(--low),var(--high)); }
.legend .caption { grid-column:1 / -1; text-align:right; font-size:11px; }
.heatmap { margin-top:12px; }
.readout { display:flex; align-items:center; justify-content:space-between; gap:14px; min-height:66px; margin:16px 0 0; padding:10px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
.readout output { display:block; min-height:24px; font-size:15px; font-variant-numeric:tabular-nums; }
.readout output b { font-weight:700; color:var(--accent); }
.hint { max-width:210px; font-size:11px; line-height:1.55; color:var(--soft); text-align:right; }
.insights { display:grid; grid-template-columns:repeat(3,1fr); gap:26px; margin-top:26px; }
.insight + .insight { padding-left:26px; border-left:1px solid var(--rule); }
.insight .eyebrow { font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--accent); }
.insight strong { display:block; margin:5px 0; font:400 38px/1.1 var(--display); }
.insight p { max-width:28ch; margin:0; font-size:13px; line-height:1.6; color:var(--soft); }
.note { display:block; margin-top:28px; padding-top:13px; border-top:1px solid var(--ink); font-size:11px; color:var(--soft); }
@media(max-width:900px) { .poster { padding:28px 30px 22px; } .headline { max-width:560px; } .cup { width:85px; right:40px; top:108px; } .dek { max-width:75%; } }
@media(max-width:640px) {
 body { padding:12px 8px; }
 .poster { padding:21px 16px 20px; border-top-width:4px; }
 .poster figcaption { padding-top:43px; margin-bottom:24px; gap:14px; }
 .kicker { font-size:10px; letter-spacing:.12em; padding-bottom:13px; }
 .headline { max-width:300px; font-size:48px; }
 .dek { max-width:none; font-size:14px; line-height:1.55; }
 .cup { display:none; }
 .chart-heading { gap:10px; align-items:start; }
 .chart-heading h2 { max-width:175px; font-size:14px; }
 .chart-heading p { max-width:165px; font-size:11px; line-height:1.5; }
 .legend { grid-template-columns:auto 66px auto; gap:4px; font-size:11px; padding-top:2px; }
 .legend .caption { max-width:98px; line-height:1.4; }
 .readout { display:block; min-height:91px; margin-top:13px; padding:11px 0; }
 .readout output { font-size:13px; line-height:1.7; min-height:23px; }
 .hint { max-width:none; text-align:left; margin-top:6px; font-size:11px; }
 .insights { gap:14px; margin-top:22px; }
 .insight + .insight { padding-left:12px; }
 .insight .eyebrow { font-size:10px; letter-spacing:.04em; }
 .insight strong { font-size:29px; }
 .insight p { font-size:11px; line-height:1.55; }
 .note { margin-top:23px; line-height:1.6; }
}
@media print { body { padding:0; background:var(--paper); } .poster { box-shadow:none; max-width:none; } .hint { display:none; } * { print-color-adjust:exact; } }
</style>
</head>
<body>
<main id="poster"></main>
<noscript>This heatmap needs JavaScript enabled to display the café's hourly figures.</noscript>
<script type="module">
import { Chart, Plot, Cell, Label, Poster, slat, nice, html, render, createSignal, Show } from "@bezda/rhp/standalone";

// Data: each entry is the average number of customers in the hour starting at 7:00 through 20:00.
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const CUSTOMERS = [
 [12,32,27,7,8,20,22,10,10,15,10,6,2,4],
 [11,32,27,11,8,20,27,8,14,14,10,6,1,4],
 [12,34,27,8,8,19,22,9,13,15,11,8,2,1],
 [15,35,25,9,7,23,26,9,14,13,12,9,1,2],
 [11,35,27,9,9,20,26,11,13,17,19,15,4,3],
 [3,8,17,35,41,28,21,24,19,14,6,4,1,3],
 [3,5,14,31,33,26,19,23,21,15,6,5,1,4]
];
const SCALE = nice(0, Math.max(...CUSTOMERS.flat()));
const count = new Intl.NumberFormat("en-GB", { maximumFractionDigits:1 });
const clock = h => `${String(h).padStart(2,"0")}:00`;
const ranked = CUSTOMERS.flatMap((hours,day) => hours.map((value,hour) => ({ day,hour,value }))).sort((a,b) => b.value-a.value);
const PEAK = ranked[0];
const meanHours = rows => CUSTOMERS[0].map((_,hour) => rows.reduce((sum,row) => sum+row[hour],0)/rows.length);
const weekday = meanHours(CUSTOMERS.slice(0,5));
const weekend = meanHours(CUSTOMERS.slice(5));
const weekdayPeak = weekday.indexOf(Math.max(...weekday));
const weekendPeak = weekend.indexOf(Math.max(...weekend));
const quietHour = meanHours(CUSTOMERS).indexOf(Math.min(...meanHours(CUSTOMERS)));
const say = (day,hour) => `${DAYS[day]}, ${clock(hour+7)} to ${clock(hour+8)}: ${count.format(CUSTOMERS[day][hour])} customers on average`;

// Slat types: a day contains fourteen hour cells, with a shared colour scale.
const Hour = slat({ css:`
 .hour { cursor:pointer; }
 .tile { --rhp-cell-gap:2px; --rhp-radius:2px; display:grid; place-items:center; }
 .number { font-size:13px; font-weight:500; font-variant-numeric:tabular-nums; color:#080707; }
 .dark .number { color:#fffaf2; }
 .peak .tile { outline:2px solid #562713; outline-offset:1px; }
 .selected .tile { box-shadow:inset 0 0 0 2px #faf5e9, inset 0 0 0 3px #342319; }
 .hour:focus-visible { outline:2px solid #342319; outline-offset:0; z-index:1; }
 .clock { font-size:11px; color:var(--rhp-muted); --rhp-label-gap:10px; }
 @media(max-width:640px) {
  .tile { --rhp-cell-gap:1px; --rhp-radius:1px; }
  .number { display:none; }
  .peak .number { display:block; font-size:11px; font-weight:700; }
  .clock { writing-mode:vertical-rl; rotate:180deg; height:40px; overflow:visible; text-overflow:clip; --rhp-label-gap:8px; }
 }
` }, h => html`
 <div class=${() => `hour${h.value >= 30 ? " dark" : ""}${h.day === PEAK.day && h.index === PEAK.hour ? " peak" : ""}${h.active ? " selected" : ""}`}
  data-day=${() => h.day} data-hour=${() => h.index} tabindex=${() => h.active ? 0 : -1}
  role="button" aria-label=${() => say(h.day,h.index)} aria-pressed=${() => !!h.active}>
  <${Cell} value=${() => h.value} class="tile"><span class="number" aria-hidden="true">${() => count.format(h.value)}</span><//>
  <${Show} when=${() => h.day === 0}><${Label} edge="end" class="clock">${() => clock(h.index+7)}<//><//>
 </div>`);
const Day = slat({
 thickness:44,
 room:{ start:42, before:48 },
 css:`
  .name { font-size:13px; font-weight:600; }
  .weekend .name { color:#7b3e22; }
  @media(max-width:640px) { .name { font-size:11px; } }
 `
}, d => html`
 <div class=${() => d.index >= 5 ? "day weekend" : "day"}>
  <${Label} edge="start" class="name">${() => d.day.slice(0,3)}<//>
  <${Plot} orientation="across" day=${() => d.index} value=${() => d.hours}
   active=${h => d.selected === h.index}>${Hour}<//>
 </div>`);

// Chart component: hover previews; tap and keyboard focus keep a selected hour.
function CafePoster() {
 const [at,setAt] = createSignal(null);
 const selected = () => at() ?? [PEAK.day,PEAK.hour];
 const cellOf = el => el?.closest?.("[data-hour]");
 const pick = e => { const cell=cellOf(e.target); if(cell) setAt([+cell.dataset.day,+cell.dataset.hour]); };
 const leave = e => {
  if(e.pointerType === "touch") return;
  const cell=cellOf(document.activeElement);
  setAt(cell ? [+cell.dataset.day,+cell.dataset.hour] : null);
 };
 const key = e => {
  const cell=cellOf(e.target);
  if(!cell) return;
  let day=+cell.dataset.day, hour=+cell.dataset.hour;
  if(e.key === "ArrowRight") hour=Math.min(13,hour+1);
  else if(e.key === "ArrowLeft") hour=Math.max(0,hour-1);
  else if(e.key === "ArrowDown") day=Math.min(6,day+1);
  else if(e.key === "ArrowUp") day=Math.max(0,day-1);
  else if(e.key === "Home") hour=0;
  else if(e.key === "End") hour=13;
  else if(e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(e); return; }
  else return;
  e.preventDefault();
  setAt([day,hour]);
  e.currentTarget.querySelector(`[data-day="${day}"][data-hour="${hour}"]`).focus();
 };
 return html`
 <${Poster} kicker="Our neighbourhood café · The weekly rhythm"
  title="The weekend rush sleeps in."
  dek=${`Weekdays fill up at ${clock(weekdayPeak+7)}. On weekends, the busiest hour shifts to ${clock(weekendPeak+7)}. Here’s when to join the bustle, or find a little breathing room.`}
  note="Illustrative data · Average customers per hour, not live occupancy. Each column covers the hour starting at its label, including 20:00 to 21:00."
  onPointerMove=${e => e.pointerType !== "touch" && pick(e)} onClick=${pick} onFocusIn=${pick}
  onPointerLeave=${leave} onFocusOut=${e => !e.currentTarget.contains(e.relatedTarget) && setAt(null)} onKeyDown=${key}>
  <svg class="cup" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
   <path d="M26 48h59v23c0 18-12 29-29 29S26 89 26 71V48Z"/>
   <path d="M85 53h8c20 0 18 27 0 27H84M18 105h77M43 36c-12-12 12-14 0-27M59 36c-12-12 12-14 0-27M75 36c-12-12 12-14 0-27" stroke-linecap="round"/>
  </svg>
  <div class="chart-heading">
   <div><h2>Average customers per hour</h2><p>Hour starting · 24-hour clock</p></div>
   <div class="legend" aria-label=${`Colour scale: 0 to ${SCALE.max} customers. Darker means busier.`}>
    <span>0</span><span class="ramp"></span><span>${SCALE.max}</span><span class="caption">Darker means busier</span>
   </div>
  </div>
  <${Chart} class="heatmap" scale=${[SCALE.min,SCALE.max]} ticks=${false}
   label="Average customers by day and hour. Monday to Sunday, 7:00 to 20:00. Tab into the heatmap and use arrow keys to explore every cell."
   theme=${{font:"var(--text)", ink:"var(--ink)", muted:"var(--soft)", surface:"var(--paper)",low:"var(--low)",high:"var(--high)"}}>
   <${Plot} day=${DAYS} hours=${CUSTOMERS} selected=${d => selected()[0] === d.index ? selected()[1] : -1}>${Day}<//>
  <//>
  <div class="readout">
   <output aria-live="polite" aria-atomic="true">${() => {
    const [d,h]=selected();
    return html`<b>${DAYS[d].slice(0,3) + " " + clock(h+7) + " to " + clock(h+8)}</b> · ${count.format(CUSTOMERS[d][h])} customers${at() == null ? " · Peak" : ""}`;
   }}</output>
   <div class="hint">Point or tap to explore.<br>Keyboard: Tab in, then arrow keys.</div>
  </div>
  <div class="insights">
   <div class="insight"><span class="eyebrow">The early crowd</span><strong>${clock(weekdayPeak+7)}</strong><p>The busiest weekday hour. Coffee before the day begins.</p></div>
   <div class="insight"><span class="eyebrow">A slower start</span><strong>${clock(weekendPeak+7)}</strong><p>The weekend peak. Saturday reaches ${count.format(PEAK.value)} customers.</p></div>
   <div class="insight"><span class="eyebrow">Room to linger</span><strong>${clock(quietHour+7)}</strong><p>The quietest hour on average across the week.</p></div>
  </div>
 <//>`;
}

render(() => html`<${CafePoster} />`,document.getElementById("poster"));
</script>
</body>
</html>
