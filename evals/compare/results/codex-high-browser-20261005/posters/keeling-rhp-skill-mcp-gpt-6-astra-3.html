<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Atmospheric carbon dioxide at Mauna Loa, 1960 to 2024. NOAA annual means, with the 2015 milestone above 400 ppm and a pre-industrial reference of about 280 ppm.">
<title>A rising carbon record | Mauna Loa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@600;700;800&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"@bezda/rhp/standalone":"https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js"}}</script>
<style>
:root { --page:#dddcd4; --paper:#f7f5ec; --ink:#242d2a; --soft:#5e655d; --accent:#b34425; --rule:#d8dbd0; --display:"Libre Franklin",Arial,sans-serif; --text:"DM Sans",Arial,sans-serif; --mono:"IBM Plex Mono",monospace; }
* { box-sizing:border-box; }
body { margin:0; padding:38px 24px; background:var(--page); color:var(--ink); font-family:var(--text); }
.poster { max-width:1100px; margin:0 auto; padding:32px 52px 28px; background:var(--paper); box-shadow:0 8px 40px #242d2a12; }
.masthead { display:flex; justify-content:space-between; align-items:center; gap:16px; border-top:3px solid var(--ink); padding:13px 0; border-bottom:1px solid var(--ink); font:500 11px/1.4 var(--mono); letter-spacing:.08em; text-transform:uppercase; }
.station { display:flex; align-items:center; gap:11px; }
.station svg { width:44px; height:24px; flex:none; }
.edition { color:var(--soft); text-align:right; }
.intro { display:grid; grid-template-columns:1fr auto; gap:28px; align-items:end; padding:35px 0 28px; }
.kicker { margin:0 0 13px; color:var(--accent); font:600 11px/1.4 var(--mono); letter-spacing:.12em; text-transform:uppercase; }
h1 { font:800 clamp(38px,5.5vw,64px)/1.02 var(--display); letter-spacing:-.055em; max-width:650px; margin:0; }
.dek { max-width:560px; margin:20px 0 0; font-size:16px; line-height:1.55; color:var(--soft); }
.latest { text-align:right; padding-bottom:4px; }
.latest .value { display:block; color:var(--accent); font:600 clamp(54px,6.5vw,80px)/1 var(--display); letter-spacing:-.065em; }
.latest .unit span { display:none; }
.latest .unit { display:block; margin-top:10px; font:500 12px/1.6 var(--mono); }
.latest .tag { display:block; margin-bottom:12px; font:500 11px var(--mono); color:var(--soft); text-transform:uppercase; letter-spacing:.08em; }
figure { margin:0; }
.chart-heading { display:flex; justify-content:space-between; gap:15px; border-top:1px solid var(--rule); padding-top:17px; margin-bottom:18px; font:500 11px/1.5 var(--mono); color:var(--soft); }
.chart-heading b { color:var(--ink); font-weight:500; }
.plot { touch-action:pan-y; cursor:crosshair; }
.explore { display:grid; grid-template-columns:1fr auto; align-items:center; gap:20px; margin:17px 0 25px; padding:14px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
.readout { font:500 13px/1.5 var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; margin:0; }
.readout strong { color:var(--accent); }
.control { display:flex; align-items:center; gap:12px; }
.control label { font-size:12px; color:var(--soft); }
input[type=range] { width:150px; height:28px; accent-color:var(--accent); cursor:pointer; }
input:focus-visible, a:focus-visible, summary:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
.hint { font-size:11px; line-height:1.5; color:var(--soft); margin:5px 0 0; }
.context { display:grid; grid-template-columns:1fr 1fr; gap:38px; padding:0 0 25px; }
.context p { font-size:14px; line-height:1.5; margin:0; max-width:390px; color:var(--soft); }
.context strong { display:block; font:600 24px/1.3 var(--display); color:var(--ink); letter-spacing:-.04em; margin-bottom:6px; }
.note { display:flex; justify-content:space-between; gap:25px; padding-top:16px; border-top:1px solid var(--ink); color:var(--soft); font-size:11px; line-height:1.6; }
.note p { margin:0; max-width:650px; }
a { color:inherit; text-underline-offset:3px; }
details { margin-top:16px; color:var(--soft); font-size:12px; }
summary { cursor:pointer; width:fit-content; }
table { width:100%; border-collapse:collapse; margin-top:12px; font:12px/1.5 var(--mono); }
th,td { padding:6px 10px; text-align:left; border-bottom:1px solid var(--rule); }
@media(max-width:760px) {
 body { padding:18px 12px; } .poster { padding:24px 24px; }
 .intro { gap:20px; } h1 { font-size:46px; } .latest .value { font-size:58px; }
 .latest .unit { font-size:11px; } .dek { font-size:15px; }
}
@media(max-width:560px) {
 body { padding:0; } .poster { padding:20px 20px 24px; box-shadow:none; }
 .masthead { font-size:9px; letter-spacing:.03em; padding:9px 0; gap:9px; }
 .station { gap:7px; } .station svg { width:33px; } .edition { max-width:84px; }
 .intro { display:block; padding:24px 0 20px; } .kicker { font-size:10px; margin-bottom:10px; }
 h1 { font-size:42px; max-width:340px; } .dek { margin-top:13px; font-size:14px; line-height:1.5; }
 .latest { display:flex; align-items:baseline; text-align:left; gap:12px; padding:0; margin-top:19px; }
 .latest .tag { display:none; } .latest .unit span { display:inline; } .latest .value { font-size:48px; } .latest .unit { margin:0; font-size:11px; }
 .chart-heading { font-size:10px; margin-bottom:16px; padding-top:12px; } .chart-heading .period { display:none; }
 .explore { grid-template-columns:1fr; gap:7px; margin:13px 0 20px; padding:12px 0; }
 .control { justify-content:space-between; } input[type=range] { flex:1; max-width:200px; }
 .readout { font-size:12px; } .hint { font-size:10px; }
 .context { gap:20px; padding-bottom:20px; } .context strong { font-size:22px; } .context p { font-size:12px; }
 .note { display:block; font-size:10px; } .note .folio { display:none; }
}
@media print { body { padding:0; background:var(--paper); } .poster { box-shadow:none; max-width:none; } .explore, details { display:none; } }
</style>
</head>
<body>
<main id="poster"></main>
<noscript>This poster needs JavaScript to draw the chart. Atmospheric CO₂ at Mauna Loa rose from 316.9 ppm in 1960 to 424.6 ppm in 2024. In 2015, the annual mean first passed 400 ppm, reaching 400.8 ppm. The pre-industrial reference is about 280 ppm.</noscript>
<script type="module">
import { Chart, Plot, Scale, Line, Dot, Tick, Label, Place, slat, html, render, createSignal, onCleanup } from '@bezda/rhp/standalone';

// Data: the supplied NOAA annual means, in ppm, at selected years.
const DATA = [[1960,316.9],[1965,320.0],[1970,325.7],[1975,331.1],[1980,338.8],[1985,346.1],[1990,354.5],[1995,360.8],[2000,369.7],[2005,379.8],[2010,389.9],[2015,400.8],[2020,414.2],[2024,424.6]];
const SORTED = [...DATA].sort((a,b) => a[0]-b[0]);
const YEARS = SORTED.map(d => d[0]);
const PPM = SORTED.map(d => d[1]);
const FIRST = SORTED[0], LAST = SORTED.at(-1), BASE = 280;
const MILESTONE = SORTED.find(d => d[0] === 2015);
const X = [FIRST[0], LAST[0]];
// A line chart uses a focused concentration scale, including the historical reference.
const Y = [Math.floor((BASE-20)/20)*20, Math.ceil(Math.max(...PPM)/20)*20];
const fmt = new Intl.NumberFormat('en-US', {minimumFractionDigits:1,maximumFractionDigits:1});
const increase = fmt.format(LAST[1]-FIRST[1]);
const percent = Math.round((LAST[1]/BASE-1)*100);
const theme = {font:'"IBM Plex Mono", monospace', ink:'#242d2a', muted:'#5e655d', grid:'#d8dbd0', surface:'#f7f5ec', series:['#b34425']};

// Slat types: the record, reference, fixed annotations, and a selected reading.
const Curve = slat({room:{},css:'.curve { stroke-width:3px; }'}, d => html`<div><${Line} points=${() => d.points} class="curve" /></div>`);
const Decade = slat({room:{after:28},css:`
 .mark { top:100%; height:5px; translate:-50% 0; --rhp-tick-width:1px; background:var(--rhp-muted); }
 .year { top:calc(100% + 11px); translate:-50% 0; --rhp-label-gap:0px; font-size:11px; color:var(--rhp-muted); }
 .first .year { translate:0 0; } .last .year { translate:-100% 0; }
 @container(max-width:600px) { .minor { display:none; } }
`}, d => html`<div class=${() => d.first ? 'first' : d.last ? 'last' : ''}>
 <${Tick} at=${() => d.at} class="mark" />
 <${Label} at=${() => d.at} class=${() => [1970,1990,2010,2020].includes(d.at) ? 'year minor' : 'year'}>${() => d.at}<//>
</div>`);
const Reference = slat({room:{},css:`
 .baseline { stroke-width:1.3px; stroke-dasharray:5 5; }
 .reference-text { position:absolute; left:0; top:10px; white-space:nowrap; font-size:11px; color:var(--rhp-muted); }
`}, d => html`<div>
 <${Line} points=${() => d.points} color="muted" class="baseline" />
 <${Place} at=${FIRST[0]} cross=${BASE}><span class="reference-text">≈280 ppm · Pre-industrial level</span><//>
</div>`);
const Sample = slat({room:{},css:'.sample { background:var(--rhp-surface); border:1.6px solid var(--rhp-series-1); }'}, d => html`<div>
 <${Dot} at=${() => d.year} cross=${() => d.ppm} size="5px" class="sample" />
</div>`);
const Annotations = slat({room:{before:12,end:8},css:`
 .anchor { background:var(--rhp-series-1); box-shadow:0 0 0 3px var(--rhp-surface); }
 .label { position:absolute; white-space:nowrap; font-size:12px; line-height:1.5; color:var(--rhp-ink); }
 .label b { font-weight:600; }
 .start { left:0; bottom:15px; }
 .end { right:0; bottom:15px; color:var(--rhp-series-1); font-weight:600; }
 .milestone { right:0; top:45px; width:168px; white-space:normal; padding-right:10px; border-right:1px solid var(--rhp-series-1); text-align:right; }
 .milestone b { color:var(--rhp-series-1); }
 .milestone span { display:block; font-family:"DM Sans",sans-serif; font-size:13px; margin-top:3px; }
 .leader { position:absolute; right:0; top:8px; height:38px; border-right:1px solid var(--rhp-series-1); }
 @container(max-width:700px) { .milestone { top:75px; } .leader { height:68px; } }
 @container(max-width:480px) { .label { font-size:11px; } .milestone { width:147px; top:95px; } .leader { height:88px; } .milestone span { font-size:12px; } }
`}, () => html`<div>
 <${Dot} at=${FIRST[0]} cross=${FIRST[1]} size="7px" class="anchor" />
 <${Place} at=${FIRST[0]} cross=${FIRST[1]}><span class="label start">${fmt.format(FIRST[1])} ppm</span><//>
 <${Dot} at=${LAST[0]} cross=${LAST[1]} size="8px" class="anchor" />
 <${Place} at=${LAST[0]} cross=${LAST[1]}><span class="label end">${fmt.format(LAST[1])} ppm</span><//>
 <${Dot} at=${MILESTONE[0]} cross=${MILESTONE[1]} size="9px" class="anchor" />
 <${Place} at=${MILESTONE[0]} cross=${MILESTONE[1]}><span class="leader"></span><div class="label milestone"><b>2015 · ${fmt.format(MILESTONE[1])} ppm</b><span>First annual mean<br>above 400 ppm</span></div><//>
</div>`);
const Reading = slat({room:{},css:`
 .hair { --rhp-tick-width:1px; background:var(--rhp-muted); opacity:.45; }
 .picked { background:var(--rhp-surface); border:2px solid var(--rhp-series-1); }
 .hidden { visibility:hidden; }
`}, d => html`<div class=${() => d.active ? '' : 'hidden'}>
 <${Tick} at=${() => d.year} thick=${1} class="hair" />
 <${Dot} at=${() => d.year} cross=${() => d.ppm} size="11px" class="picked" />
</div>`);

// Chart component: actual year spacing, with pointer, tap, and native range input access.
function CarbonPoster() {
 const [picked,setPicked] = createSignal(null);
 const [compact,setCompact] = createSignal(matchMedia('(max-width:560px)').matches);
 const mq = matchMedia('(max-width:560px)');
 const resize = e => setCompact(e.matches);
 mq.addEventListener('change',resize);
 onCleanup(() => mq.removeEventListener('change',resize));
 const index = () => picked() ?? YEARS.length-1;
 let plot, slider;
 const point = e => {
  const r = plot.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
  const year = X[0]+(e.clientX-r.left)/r.width*(X[1]-X[0]);
  setPicked(YEARS.reduce((best,y,i) => Math.abs(y-year)<Math.abs(YEARS[best]-year) ? i : best,0));
 };
 const leave = e => { if(e.pointerType !== 'touch' && !slider.matches(':focus-visible')) setPicked(null); };
 const say = () => `${YEARS[index()]}: ${fmt.format(PPM[index()])} parts per million`;
 return html`<article class="poster">
  <header class="masthead"><span class="station"><svg viewBox="0 0 60 30" aria-hidden="true"><path d="M1 25 L18 16 L25 7 L34 7 L42 17 L59 25 M1 29 H59 M25 7 L28 12 L34 7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Mauna Loa Observatory</span><span class="edition">Hawaiʻi · Atmospheric record</span></header>
  <div class="intro"><div><p class="kicker">The long view / 1960 to 2024</p><h1>Carbon dioxide<br>keeps climbing.</h1><p class="dek">Measured above the Pacific, the record at Mauna Loa traces a sustained rise in atmospheric CO₂.</p></div><div class="latest"><span class="tag">2024 annual mean</span><span class="value">${fmt.format(LAST[1])}</span><span class="unit">ppm <span> / 2024 annual mean</span></span></div></div>
  <figure aria-label="Atmospheric carbon dioxide at Mauna Loa">
   <figcaption class="chart-heading"><b>CO₂ concentration · parts per million (ppm)</b><span class="period">Selected annual means, 1960 to 2024</span></figcaption>
   <div class="plot" onPointerMove=${e => e.pointerType !== 'touch' && point(e)} onClick=${point} onPointerLeave=${leave}>
    <${Chart} scale=${X} cross=${Y} crossTicks=${[300,350,400]} height=${() => compact() ? 295 : 335} theme=${theme} label="Mauna Loa annual mean CO₂, from 316.9 ppm in 1960 to 424.6 ppm in 2024. Pre-industrial reference about 280 ppm.">
     <${Scale} ticks=${[1960,1970,1980,1990,2000,2010,2020,2024]}>${Decade}<//>
     <${Plot} overlap=${true} points=${[[[FIRST[0],BASE],[LAST[0],BASE]]]} style=${{'pointer-events':'none'}}>${Reference}<//>
     <${Plot} overlap=${true} points=${[SORTED]} ref=${el => plot=el}>${Curve}<//>
     <${Plot} overlap=${true} year=${YEARS} ppm=${PPM} style=${{'pointer-events':'none'}}>${Sample}<//>
     <${Plot} overlap=${true} slats=${1} style=${{'pointer-events':'none'}}>${Annotations}<//>
     <${Plot} overlap=${true} slats=${1} year=${() => YEARS[index()]} ppm=${() => PPM[index()]} active=${() => picked() !== null} style=${{'pointer-events':'none'}}>${Reading}<//>
    <//>
   </div>
  </figure>
  <div class="explore"><div><p class="readout" aria-live="polite">${() => YEARS[index()]}<span> annual mean: </span><strong>${() => fmt.format(PPM[index()])} ppm</strong></p><p class="hint">Point or tap the chart. Use the year slider or arrow keys.</p></div><div class="control"><label for="year">Explore a year</label><input id="year" type="range" min="0" max=${YEARS.length-1} step="1" value=${index} aria-valuetext=${say} ref=${el => slider=el} onInput=${e => setPicked(+e.currentTarget.value)} onFocus=${e => setPicked(+e.currentTarget.value)} /></div></div>
  <div class="context"><p><strong>+${increase} ppm</strong>The increase since 1960, when the annual mean was ${fmt.format(FIRST[1])} ppm.</p><p><strong>About ${percent}% higher</strong>The 2024 concentration compared with the pre-industrial level of about 280 ppm.</p></div>
  <footer class="note"><p>Source: <a href="https://gml.noaa.gov/ccgg/trends/">NOAA Global Monitoring Laboratory</a>. Annual means as supplied, rounded to 0.1 ppm.<br>Dots show selected years; straight segments connect the readings. The 280 ppm line is a historical reference, not a Mauna Loa measurement.</p><span class="folio">CO₂ / 01</span></footer>
  <details><summary>View all 14 readings</summary><table><caption>Supplied annual mean CO₂ at Mauna Loa</caption><thead><tr><th scope="col">Year</th><th scope="col">CO₂ (ppm)</th></tr></thead><tbody>${SORTED.map(d => html`<tr><td>${d[0]}</td><td>${fmt.format(d[1])}</td></tr>`)}</tbody></table></details>
 </article>`;
}

// Mount the self-contained poster.
render(() => html`<${CarbonPoster} />`,document.getElementById('poster'));
</script>
</body>
</html>
