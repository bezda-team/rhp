<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisbon gained the most ground</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
  body { background: #f6f3ee; color: #1f1a14; font-family: Inter, sans-serif; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-family: Fraunces, serif; }
  button { font: inherit; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0"></script>
</head>
<body>
<main>
  <h1>Lisbon gained the most ground</h1>
  <p>Share of commuters who walk, cycle or take transit (%), 2025: Lisbon is up 9 points on 2024, more than any other city.</p>
  <div><button>2024</button> <button>2025</button></div>
  <p id="readout"></p>
  <div style="height: 360px"><canvas id="chart" tabindex="0"></canvas></div>
  <p><small>Source: illustrative data</small></p>
</main>
<script type="module">
Chart.defaults.font.family = 'Inter, sans-serif';
Chart.defaults.color = '#1f1a14';
Chart.register(ChartDataLabels);

const phone = () => matchMedia('(max-width: 480px)').matches;
const cities = ['Vienna', 'Oslo', 'Lisbon', 'Prague', 'Dublin'];
const years = { 2024: [72, 61, 48, 55, 39], 2025: [70, 64, 57, 52, 45] };
let year = 2025;

// readout
const readout = document.getElementById('readout');
let shown;
function show(i = cities.indexOf('Lisbon')) {
  shown = i;
  const change = years[2025][i] - years[2024][i];
  readout.textContent = `${cities[i]}: ${years[year][i]}% in ${year}` +
    (year === 2025 ? `, ${change > 0 ? '+' : ''}${change} points since 2024` : '');
}
show();

// pictograms
const person = new Path2D('M0 1 C0 .72 .12 .6 .32 .55 C.38 .53 .4 .5 .4 .46 C.3 .42 .26 .34 .26 .26 C.26 .13 .36 .04 .5 .04 C.64 .04 .74 .13 .74 .26 C.74 .34 .7 .42 .6 .46 C.6 .5 .62 .53 .68 .55 C.88 .6 1 .72 1 1 Z');
const people = {
  id: 'people',
  afterDatasetsDraw(chart) {
    const { ctx, scales: { x } } = chart;
    chart.getDatasetMeta(0).data.forEach((bar, i) => {
      const value = years[year][i], pitch = x.getPixelForValue(10) - x.getPixelForValue(0);
      const size = Math.min(pitch * 0.8, bar.height);
      for (let j = 0; j < Math.ceil(value / 10); j++) {
        ctx.save();
        ctx.translate(x.getPixelForValue(j * 10 + 5) - size / 2, bar.y - size / 2);
        ctx.scale(size, size);
        ctx.fillStyle = '#d9d3c7';
        ctx.fill(person);
        ctx.beginPath();
        ctx.rect(0, 0, Math.min(1, (value - j * 10) / 10), 1);
        ctx.clip();
        ctx.fillStyle = i === 2 ? '#c2410c' : '#b8b2a7';
        ctx.fill(person);
        ctx.restore();
      }
    });
  }
};

// chart
const canvas = document.getElementById('chart');
await document.fonts.ready;
const chart = new Chart(canvas, {
  type: 'bar',
  plugins: [people],
  data: {
    labels: cities,
    datasets: [{
      label: '2025',
      data: years[year],
      backgroundColor: 'transparent',
      barPercentage: () => phone() ? 0.5 : 0.9
    }]
  },
  options: {
    indexAxis: 'y',
    animation: false,
    maintainAspectRatio: false,
    layout: { padding: { top: 30 } },
    scales: {
      x: { min: 0, max: 100, grid: { display: false } },
      y: {
        grid: { display: false },
        ticks: { mirror: phone, labelOffset: () => phone() ? -21 : 0 }
      }
    },
    plugins: {
      legend: { display: false },
      tooltip: { enabled: false },
      datalabels: { anchor: 'end', align: 'end', backgroundColor: '#f6f3ee',
        offset: ({ chart, dataIndex }) => {
          const value = years[year][dataIndex], x = chart.scales.x;
          return x.getPixelForValue(Math.ceil(value / 10) * 10) - x.getPixelForValue(value) + 4;
        } },
      annotation: {
        clip: false,
        annotations: {
          target: {
            type: 'line',
            scaleID: 'x',
            value: 60,
            label: { display: true, content: 'EU target: 60%', position: 'start', yAdjust: -30 }
          }
        }
      }
    }
  }
});

// interaction
const pick = (event) => show(chart.getElementsAtEventForMode(event, 'nearest', { intersect: true }, true)[0]?.index);
canvas.onpointermove = pick;
canvas.onpointerdown = pick;
canvas.onfocus = () => canvas.matches(':focus-visible') && show(0);
canvas.onblur = () => show();
canvas.onpointerleave = (event) => event.pointerType !== 'touch' && show();
canvas.onkeydown = (event) => {
  const step = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[event.key];
  if (step) {
    event.preventDefault();
    show((shown + step + cities.length) % cities.length);
  }
};

// years
document.querySelectorAll('button').forEach((button) => {
  button.onclick = () => {
    year = +button.textContent;
    chart.data.datasets[0].data = years[year];
    chart.update();
    show();
  };
});
</script>
</body>
</html>
