<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commuters who walk, cycle or take transit</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<div id="chart"></div>
<script>
const data = [
  {name: "Oslo", 2025: 64},
  {name: "Lisbon", 2025: 57},
  {name: "Vienna", 2025: 70},
  {name: "Dublin", 2025: 45},
  {name: "Prague", 2025: 52},
];

const width = 720, height = 300;
const margin = {top: 10, right: 30, bottom: 30, left: 60};

const x = d3.scaleLinear([0, 100], [margin.left, width - margin.right]);
const y = d3.scaleBand(data.map(d => d.name), [margin.top, height - margin.bottom]).padding(0.2);

const svg = d3.select("#chart").append("svg")
    .attr("width", width)
    .attr("height", height)
    .attr("viewBox", [0, 0, width, height])
    .attr("style", "max-width: 100%; height: auto;");

svg.append("g").selectAll().data(data).join("rect")
    .attr("x", x(0))
    .attr("y", d => y(d.name))
    .attr("width", d => x(d[2025]) - x(0))
    .attr("height", y.bandwidth())
    .attr("fill", "steelblue");

svg.append("g")
    .attr("transform", `translate(0,${height - margin.bottom})`)
    .call(d3.axisBottom(x));

svg.append("g")
    .attr("transform", `translate(${margin.left},0)`)
    .call(d3.axisLeft(y));
</script>
