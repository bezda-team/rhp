<!doctype html>
<!-- 500 columns in a vertical chart: each about 1px thick. expect: small-plot -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>small-plot</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 40px; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  #chart { max-width: 640px; margin: 0 auto; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Label, slat, html, render } from "@bezda/rhp/standalone";

const sold = Array.from({ length: 500 }, (_, i) => 4 + ((i * 7) % 13));

const Day = slat((d) => html`<div><${Bar} to=${() => d.sold} /></div>`);

render(() => html`
  <${Chart} orientation="vertical" scale=${[0, 20]} label="Fruit sold each day">
    <${Plot} sold=${sold}>${Day}<//>
  <//>`, document.getElementById("chart"));
</script>
</body>
</html>
