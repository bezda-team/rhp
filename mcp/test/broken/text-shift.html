<!doctype html>
<!-- A readout on one line under the chart: the fruit's name comes first, so "crates sold" slides along with every name. Nothing else moves. expect: text-shift -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text-shift</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 16px; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #222; }
  .poster { max-width: 640px; margin: 0 auto; }
  .readout { height: 1lh; margin: 12px 0 0; white-space: nowrap; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Label, slat, html, render, createSignal } from "@bezda/rhp/standalone";

const fruit = ["Apples", "Elderberries", "Figs", "Watermelons"];
const sold = [12, 18, 7, 9];

const Fruit = slat({ thickness: 36, room: { start: 110, end: 40 } }, (d) => html`
  <div data-row=${() => d.index}>
    <${Label} edge="start">${() => d.fruit}<//>
    <${Bar} to=${() => d.sold} color=${() => (d.on ? "#1d4ed8" : "#64748b")} />
    <${Label} at=${() => d.sold}>${() => d.sold}<//>
  </div>`);

const [on, setOn] = createSignal(0);
const rowOf = (el) => {
  const root = el.closest("[data-row]");
  return root ? +root.dataset.row : null;
};
const pick = (e) => {
  const row = rowOf(e.target);
  if (row != null) setOn(row);
};

render(() => html`
  <figure class="poster" onPointerMove=${pick} onClick=${pick}>
    <${Chart} scale=${[0, 20]} label="Crates of fruit sold">
      <${Plot} fruit=${fruit} sold=${sold} on=${(d) => on() === d.index}>${Fruit}<//>
    <//>
    <p class="readout"><b>${() => fruit[on()]}</b>${" "}<span>crates sold:</span>${" "}<b>${() => sold[on()]}</b></p>
  </figure>`, document.getElementById("chart"));
</script>
</body>
</html>
