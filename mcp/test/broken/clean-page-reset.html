<!doctype html>
<!-- A page reset that reaches rhp's SVGs (svg { display: block }) is not aimed at the chart. expect: none -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>none</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 40px; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  #chart { max-width: 640px; margin: 0 auto; }
  svg { display: block; max-width: 100%; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Area, Label, slat, html, render } from "@bezda/rhp/standalone";

const fruit = ["Apples", "Bananas"];
const ripeness = [[[0, 1], [15, 3], [30, 1]], [[0, 1], [10, 2], [30, 1]]];

const Fruit = slat({ thickness: 48, room: { start: 90, end: 20 } }, (d) => html`
  <div>
    <${Label} edge="start">${() => d.fruit}<//>
    <${Area} points=${() => d.ripeness} />
  </div>`);

render(() => html`
  <${Chart} scale=${[0, 30]} label="Days to ripen">
    <${Plot} fruit=${fruit} ripeness=${ripeness}>${Fruit}<//>
  <//>`, document.getElementById("chart"));
</script>
</body>
</html>
