<!doctype html>
<!-- The month slider and the readout sit above a chart taller than the window: a reader in the middle of the chart cannot see either of them. expect: scrolls-away:info; widths: 1280 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrolls-away</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 16px; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #222; }
  .poster { max-width: 640px; margin: 0 auto; }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .readout { height: 1lh; margin: 0 0 12px; white-space: nowrap; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Label, slat, html, render, createSignal } from "@bezda/rhp/standalone";

const streets = Array.from({ length: 36 }, (_, i) => `Street ${i + 1}`);
const trees = (month) => streets.map((_, i) => ((i * 7 + month * 3) % 17) + 2);

const Street = slat({ thickness: 32, room: { start: 90, end: 40 } }, (d) => html`
  <div data-row=${() => d.index}>
    <${Label} edge="start">${() => d.street}<//>
    <${Bar} to=${() => d.trees} color=${() => (d.on ? "#15803d" : "#64748b")} />
    <${Label} at=${() => d.trees}>${() => d.trees}<//>
  </div>`);

const [month, setMonth] = createSignal(1);
const [on, setOn] = createSignal(null);
const pick = (e) => {
  const root = e.target.closest("[data-row]");
  if (root) setOn(+root.dataset.row);
};

render(() => html`
  <figure class="poster" onPointerMove=${pick} onClick=${pick}>
    <div class="controls"><label for="month">Month</label><input id="month" type="range" min="1" max="12" value=${month} onInput=${(e) => setMonth(+e.target.value)} /></div>
    <p class="readout">${() => (on() == null ? "Point at a street." : `${streets[on()]}: ${trees(month())[on()]} trees planted`)}</p>
    <${Chart} scale=${[0, 20]} label="Trees planted by street">
      <${Plot} street=${streets} trees=${() => trees(month())} on=${(d) => on() === d.index}>${Street}<//>
    <//>
  </figure>`, document.getElementById("chart"));
</script>
</body>
</html>
