<!doctype html>
<!-- A chart without the guard (noCssGuard) whose slat roots are figures: they keep the browser's margins for a figure, which move them off their places. expect: page-css-reaches -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>page-css-reaches-browser</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 40px; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  #chart { max-width: 640px; margin: 0 auto; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Label, slat, html, render } from "@bezda/rhp/standalone";

const fruit = ["Apples", "Bananas", "Cherries"];
const sold = [12, 18, 7];

const Fruit = slat({ thickness: 36, room: { start: 90, end: 40 } }, (d) => html`
  <figure>
    <${Label} edge="start">${() => d.fruit}<//>
    <${Bar} to=${() => d.sold} />
    <${Label} at=${() => d.sold}>${() => d.sold}<//>
  </figure>`);

render(() => html`
  <${Chart} scale=${[0, 20]} label="Fruit sold today" noCssGuard=${true}>
    <${Plot} fruit=${fruit} sold=${sold}>${Fruit}<//>
  <//>`, document.getElementById("chart"));
</script>
</body>
</html>
