<!doctype html>
<!-- A scatter whose names end 20px before their dots: "Bergen" starts right after the dot of a city with no name, on the line of its text, nearer it than to its own dot (on a phone the text runs over that dot), so a reader may take it for that dot's name. expect: ambiguous-label -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ambiguous-label</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 40px; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  #chart { max-width: 640px; margin: 0 auto; }
  @media (max-width: 600px) { body { padding: 24px 16px; } }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Dot, Label, html, render } from "@bezda/rhp/standalone";

// Rainy days and mean temperature: only some cities are named
const city = ["Bergen", "", "Oslo", ""];
const rain = [70, 58.2, 30, 15];
const temp = [50, 50, 25, 80];

const City = (d) => html`
  <div>
    <${Dot} at=${() => d.rain} cross=${() => d.temp} size="10px" />
    <${Label} at=${() => d.rain} cross=${() => d.temp} side="before" style="--rhp-label-gap: 20px">${() => d.city}<//>
  </div>`;

render(() => html`
  <${Chart} scale=${[0, 100]} cross=${[0, 100]} height=${260} label="Rainy days against mean temperature">
    <${Plot} overlap=${true} city=${city} rain=${rain} temp=${temp}>${City}<//>
  <//>`, document.getElementById("chart"));
</script>
</body>
</html>
