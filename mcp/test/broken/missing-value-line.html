<!doctype html>
<!-- A line with a gap: it breaks at the missing point, a note. expect: missing-value:info -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>missing-value</title>

  body { margin: 0; padding: 24px 40px; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  #chart { max-width: 640px; margin: 0 auto; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Line, slat, html, render } from "@bezda/rhp/standalone";

// Weekly sales, with no count for week 3
const weeks = [[1, 12], [2, 15], [3, null], [4, 9], [5, 14]];

const Trend = slat({ room: {} }, () => html`<${Line} points=${weeks} />`);

render(() => html`
  <${Chart} scale=${[1, 5]} cross=${[0, 20]} height=${200} label="Sales by week">
    <${Plot} overlap=${true} slats=${1}>${Trend}<//>
  <//>`, document.getElementById("chart"));
</script>
</body>
