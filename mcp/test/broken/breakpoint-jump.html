<!doctype html>
<!-- A readout narrowed only between the page's own breakpoints at 560px and 600px, where the second fruit's sentence takes a second line and moves the chart down: no width checked (1280, 390) falls there. expect: layout-jump -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>breakpoint-jump</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 16px; font: 16px/1.5 monospace; background: #fff; color: #222; }
  #chart { max-width: 640px; margin: 0 auto; }
  .readout { width: 30ch; max-width: 100%; min-height: 1lh; margin: 8px 0; }
  @media (min-width: 561px) and (max-width: 600px) { .readout { width: 20ch; } }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Label, slat, html, render, createSignal } from "@bezda/rhp/standalone";

const fruit = ["Apples", "Bananas", "Cherries", "Dates", "Elderberries"];
const sold = [12, 18, 7, 9, 4];
// What the readout says for each fruit
const says = ["12 sold.", "18 sold today, the most.", "7 sold.", "9 sold.", "4 sold."];

const Fruit = slat({ thickness: 36, room: { start: 140, end: 40 } }, (d) => html`
  <div data-row=${() => d.index}>
    <${Label} edge="start">${() => d.fruit}<//>
    <${Bar} to=${() => d.sold} color=${() => (d.on ? "#1d4ed8" : "#8aa0b4")} />
    <${Label} at=${() => d.sold}>${() => d.sold}<//>
  </div>`);

const [on, setOn] = createSignal(null);
const rowOf = (el) => {
  const root = el.closest("[data-row]");
  return root ? +root.dataset.row : null;
};
const pick = (e) => {
  const row = rowOf(e.target);
  if (row != null) setOn(row);
};
const readout = () => html`<p class="readout">${() => (on() == null ? "Tap or point at a fruit." : says[on()])}</p>`;

render(() => html`
  <div onPointerMove=${(e) => e.pointerType !== "touch" && pick(e)} onClick=${pick} onPointerLeave=${(e) => e.pointerType !== "touch" && setOn(null)}>
    ${readout()}
    <${Chart} scale=${[0, 20]} label="Fruit sold today">
      <${Plot} fruit=${fruit} sold=${sold} on=${(d) => on() === d.index}>${Fruit}<//>
    <//>
    
  </div>`, document.getElementById("chart"));
</script>
</body>
</html>
