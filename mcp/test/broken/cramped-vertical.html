<!doctype html>
<!-- A vertical chart at the default 240px: the labels of short stacked parts crowd each other. expect: cramped text-overlap -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cramped text-overlap</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 40px; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  #chart { max-width: 640px; margin: 0 auto; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Label, slat, html, render } from "@bezda/rhp/standalone";

const fruit = ["Apples", "Bananas", "Cherries"];
const parts = [[3, 2, 3], [2, 3, 2], [3, 3, 2]];

const Part = (p) => html`<div><${Bar} from=${() => p.from} to=${() => p.to} color=${() => p.color} /><${Label} at=${() => (p.from + p.to) / 2}>${() => p.to - p.from}<//></div>`;

const Fruit = slat((d) => html`
  <div>
    <${Label} edge="start">${() => d.fruit}<//>
    <${Plot} overlap=${true} from=${() => [0, d.parts[0], d.parts[0] + d.parts[1]]} to=${() => [d.parts[0], d.parts[0] + d.parts[1], d.parts[0] + d.parts[1] + d.parts[2]]} color=${["series-1", "series-2", "series-3"]}>${Part}<//>
  </div>`);

render(() => html`
  <${Chart} orientation="vertical" scale=${[0, 80]} label="Fruit sold, three days">
    <${Plot} fruit=${fruit} parts=${parts}>${Fruit}<//>
  <//>`, document.getElementById("chart"));
</script>
</body>
</html>
