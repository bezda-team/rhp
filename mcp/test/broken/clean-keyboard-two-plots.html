<!doctype html>
<!-- A leader in a chart of its own above the rest, as a leaderboard draws its record: the arrow keys go from the leader's one slat to the first slat of the chart under it, which is also slat 1 of its Plot, and the report says the focus moved. expect: none; says: - key ArrowDown: focus moved to slat 1 (Bananas) of another Plot -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>none</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 40px; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  #chart { max-width: 640px; margin: 0 auto; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Label, slat, html, render } from "@bezda/rhp/standalone";

const Fruit = slat({ thickness: 36, room: { start: 90, end: 40 }, css: ".fruit:focus-visible { outline: 2px solid #1d1d1f; outline-offset: -2px; }" }, (d) => html`
  <div class="fruit" data-row=${() => d.row}>
    <${Label} edge="start">${() => d.fruit}<//>
    <${Bar} to=${() => d.sold} color="#8aa0b4" />
    <${Label} at=${() => d.sold}>${() => d.sold}<//>
  </div>`);

// The leader's slat is alone in its Plot: ArrowDown there goes on to the chart under it, ArrowUp on that one's first comes back
const cross = (e) => {
  const row = +e.target.closest("[data-row]")?.dataset.row;
  const to = row === 0 && e.key === "ArrowDown" ? 1 : row === 1 && e.key === "ArrowUp" ? 0 : null;
  if (to == null) return;
  e.preventDefault();
  e.currentTarget.querySelector(`[data-row="${to}"]`).focus();
};

render(() => html`
  <div onKeyDown=${cross}>
    <${Chart} scale=${[0, 20]} ticks=${false} label="The best seller">
      <${Plot} keyboard=${true} fruit=${["Apples"]} sold=${[18]} row=${0}>${Fruit}<//>
    <//>
    <${Chart} scale=${[0, 20]} label="The others">
      <${Plot} keyboard=${true} fruit=${["Bananas", "Cherries"]} sold=${[12, 7]} row=${(d) => d.index + 1}>${Fruit}<//>
    <//>
  </div>`, document.getElementById("chart"));
</script>
</body>
</html>
