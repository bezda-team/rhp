<!doctype html>
<!-- A button in each slat, and a sort that moves the slats: each button moves with its slat, as it should, so the layout does not jump. expect: none -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>none</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 40px; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  #chart { max-width: 640px; margin: 0 auto; }
  .sort { margin: 0 0 12px; padding: 6px 12px; border: 1px solid #555; border-radius: 4px; background: #fff; color: #222; font: inherit; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Label, slat, sortBy, html, render, createSignal } from "@bezda/rhp/standalone";

const fruit = ["Apples", "Bananas", "Cherries", "Dates"];
const sold = [12, 18, 7, 15];

const [starred, setStarred] = createSignal(new Set());
const star = (i) => setStarred((s) => new Set(s.has(i) ? [...s].filter((x) => x !== i) : [...s, i]));

const Fruit = slat({
  thickness: 36,
  room: { start: 90, end: 56 },
  css: ".star { padding: 2px 8px; border: 1px solid #555; border-radius: 4px; background: #fff; color: #222; font: inherit; } .star[aria-pressed=true] { background: #222; color: #fff; }",
}, (d) => html`
  <div>
    <${Label} edge="start">${() => d.fruit}<//>
    <${Bar} to=${() => d.sold} />
    <${Label} edge="end">
      <button class="star" aria-label=${() => `Star ${d.fruit}`} aria-pressed=${() => String(starred().has(d.index))} onClick=${() => star(d.index)}>★</button>
    <//>
  </div>`);

const [dir, setDir] = createSignal("desc");

render(() => html`
  <button class="sort" onClick=${() => setDir(dir() === "desc" ? "asc" : "desc")}>Sort</button>
  <${Chart} scale=${[0, 20]} label="Fruit sold today">
    <${Plot} fruit=${fruit} sold=${sold} order=${() => sortBy("sold", dir())}>${Fruit}<//>
  <//>`, document.getElementById("chart"));
</script>
</body>
</html>
