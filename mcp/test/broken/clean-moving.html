<!doctype html>
<!-- A live feed that never comes to rest with motion on (the JS version glides into each reading) and changes in steps with reduced motion: measured at rest, its interactions tried as it moves. expect: none -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>none</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 40px; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  #chart { max-width: 640px; margin: 0 auto; }
  .readout { min-height: 1lh; margin: 0 0 8px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Label, slat, html, render, createSignal, onCleanup } from "@bezda/rhp/standalone";

// A reading every 400 ms, the same on every load
const REGION = ["North", "East", "South", "West"];
const STEP = 400;
const [load, setLoad] = createSignal([40, 55, 35, 60]);
let k = 0;
const timer = setInterval(() => {
  k++;
  setLoad(REGION.map((_, i) => 30 + ((k * 7 + i * 13) % 40)));
}, STEP);

const Region = slat({ thickness: 36, room: { start: 70, end: 40 }, css: ".region:focus-visible { outline: 2px solid #222; outline-offset: -2px; }" }, (d) => html`
  <div class="region" data-row=${() => d.index}>
    <${Label} edge="start">${() => d.region}<//>
    <${Bar} to=${() => d.load} color=${() => (d.on ? "#1d4ed8" : "#7c93b5")} />
    <${Label} at=${() => d.load}>${() => Math.round(d.load)}<//>
  </div>`);

function Live() {
  const [on, setOn] = createSignal(null);
  onCleanup(() => clearInterval(timer));
  const rowOf = (el) => {
    const root = el.closest("[data-row]");
    return root ? +root.dataset.row : null;
  };
  const pick = (e) => {
    const row = rowOf(e.target);
    if (row != null) setOn(row);
  };
  return html`
    <div onPointerMove=${(e) => e.pointerType !== "touch" && pick(e)} onClick=${pick} onFocusIn=${pick} onPointerLeave=${(e) => e.pointerType !== "touch" && setOn(null)}>
      <p class="readout">${() => (on() == null ? "Tap or point at a region." : `${REGION[on()]}: ${Math.round(load()[on()])}% load`)}</p>
      <${Chart} scale=${[0, 80]} label="Load by region, live">
        <${Plot} keyboard=${true} region=${REGION} load=${load} on=${(d) => on() === d.index}
          animate=${{ groups: ["load"], duration: STEP * 1.5, ease: "linear" }}>${Region}<//>
      <//>
    </div>`;
}

render(() => html`<${Live} />`, document.getElementById("chart"));
</script>
</body>
</html>
