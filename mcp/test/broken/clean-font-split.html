<!doctype html>
<!-- A family split by unicode-range (as Google Fonts serves CJK ones): a slice that also covers Latin letters is never loaded, and the face the text uses is. expect: none -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>font split by unicode-range</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  /* the slice comes first, as in Google's CSS; the face declared last is checked first for a character, so the Latin
     text uses the second face and the slice is never needed */
  @font-face { font-family: "Split Sans"; src: url("no-such-slice.woff2") format("woff2"); unicode-range: U+20-7E, U+4E00-4E7F; }
  @font-face { font-family: "Split Sans"; src: local("Helvetica Neue"), local("Helvetica"), local("Arial"), local("Liberation Sans"), local("DejaVu Sans"); unicode-range: U+0-FF; }
  body { margin: 0; padding: 24px 40px; font-family: "Split Sans", system-ui, sans-serif; background: #fff; color: #222; }
  #chart { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 16px; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Label, slat, html, render } from "@bezda/rhp/standalone";

const fruit = ["Apples", "Bananas", "Cherries"];
const sold = [12, 18, 7];

const Fruit = slat({ thickness: 36, room: { start: 90, end: 40 } }, (d) => html`
  <div>
    <${Label} edge="start">${() => d.fruit}<//>
    <${Bar} to=${() => d.sold} />
    <${Label} at=${() => d.sold}>${() => d.sold}<//>
  </div>`);

render(() => html`
  <h1>Fruit sold today</h1>
  <${Chart} scale=${[0, 20]} label="Fruit sold today" theme=${{ font: "\"Split Sans\", system-ui, sans-serif" }}>
    <${Plot} fruit=${fruit} sold=${sold}>${Fruit}<//>
  <//>`, document.getElementById("chart"));
</script>
</body>
</html>
