<!doctype html>
<!-- Thin slats (15px) with a tag on one of them only are not cramped. expect: none -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>none</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 40px; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  #chart { max-width: 640px; margin: 0 auto; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Label, slat, html, render } from "@bezda/rhp/standalone";

const day = Array.from({ length: 22 }, (_, i) => i + 1);
const close = [48, 49, 50, 49, 47, 46, 46, 45, 47, 48, 47, 50, 51, 50, 51, 54, 56, 55, 57, 58, 59, 62];

const Day = slat({ thickness: 15, room: { start: 20, end: 60 } }, (d) => html`
  <div>
    <${Bar} to=${() => d.close} thick=${0.6} />
    <${Label} at=${() => d.close}>${() => (d.index === day.length - 1 ? "$" + d.close : "")}<//>
  </div>`);

render(() => html`
  <${Chart} scale=${[0, 70]} label="Closing price, a month">
    <${Plot} day=${day} close=${close}>${Day}<//>
  <//>`, document.getElementById("chart"));
</script>
</body>
</html>
