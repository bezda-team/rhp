<!doctype html>
<!-- Slats whose focus ring is replaced by the pick: the slat the keyboard reaches is picked and its bar turns dark, so focus shows. expect: none -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>none</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 40px; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  #chart { max-width: 640px; margin: 0 auto; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
import { Chart, Plot, Bar, Label, slat, html, render, createSignal } from "@bezda/rhp/standalone";

const fruit = ["Apples", "Bananas", "Cherries"];
const sold = [12, 18, 7];

const Fruit = slat({ thickness: 36, room: { start: 90, end: 40 }, css: ".fruit:focus-visible { outline: none; }" }, (d) => html`
  <div class="fruit" data-row=${() => d.index}>
    <${Label} edge="start">${() => d.fruit}<//>
    <${Bar} to=${() => d.sold} color=${() => (d.on ? "#1d1d1f" : "#8aa0b4")} />
    <${Label} at=${() => d.sold}>${() => d.sold}<//>
  </div>`);

const [on, setOn] = createSignal(null);
const rowOf = (el) => {
  const root = el.closest("[data-row]");
  return root ? +root.dataset.row : null;
};

render(() => html`
  <div onFocusIn=${(e) => setOn(rowOf(e.target))} onFocusOut=${() => setOn(null)}>
    <${Chart} scale=${[0, 20]} label="Fruit sold today">
      <${Plot} keyboard=${true} fruit=${fruit} sold=${sold} on=${(d) => on() === d.index}>${Fruit}<//>
    <//>
  </div>`, document.getElementById("chart"));
</script>
</body>
</html>
