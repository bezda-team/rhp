<!doctype html>
<!-- out-of-view's chart with a hover style on its slats (CSS only): a tap darkens the tapped bar, in view, so the reader sees that the tap did something. expect: none -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>none</title>
<script type="importmap">{ "imports": { "@bezda/rhp/standalone": "https://cdn.jsdelivr.net/npm/@bezda/rhp@2/dist/standalone.js" } }</script>
<style>
  body { margin: 0; padding: 24px 40px; font-family: system-ui, sans-serif; background: #fff; color: #222; }
  main { max-width: 640px; margin: 0 auto; }
  .readout { height: 24px; margin: 0 0 16px; font-size: 16px; line-height: 24px; white-space: nowrap; }
  @media (max-width: 600px) { body { padding: 24px 16px; } }
</style>
</head>
<body>
<main id="chart"></main>
<script type="module">
import { Chart, Plot, Bar, Label, slat, html, render, createSignal } from "@bezda/rhp/standalone";

const hour = Array.from({ length: 24 }, (_, i) => `${i}:00`);
const visitors = [12, 8, 5, 4, 4, 6, 14, 28, 41, 52, 58, 61, 66, 63, 57, 55, 59, 64, 70, 62, 48, 36, 24, 17];

const Hour = slat({ thickness: 44, room: { start: 56, end: 40 }, css: ".hour:hover .bar { filter: brightness(.6); }" }, (d) => html`
  <div class="hour" data-row=${() => d.index}>
    <${Label} edge="start">${() => d.hour}<//>
    <${Bar} class="bar" to=${() => d.visitors} />
  </div>`);

const [picked, setPicked] = createSignal(null);
const pick = (e) => {
  const el = e.target.closest("[data-row]");
  if (el) setPicked(+el.dataset.row);
};

render(() => html`
  <p class="readout">${() => (picked() == null ? "Tap an hour to see its visitors." : `${hour[picked()]}: ${visitors[picked()]} visitors`)}</p>
  <div onClick=${pick}>
    <${Chart} scale=${[0, 80]} label="Visitors by hour">
      <${Plot} hour=${hour} visitors=${visitors}>${Hour}<//>
    <//>
  </div>`, document.getElementById("chart"));
</script>
</body>
</html>
